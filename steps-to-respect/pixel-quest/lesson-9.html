<style>:root{
  --night:#1B1530; --deep:#120E22; --blue:#2340A8; --white:#FFFFFF; --gold:#FFD23F; --pink:#FF5C8A; --cyan:#3AE0FF; --green:#7CF56B; --red:#FF6B6B; --lav:#BFD0FF; --orange:#FF9D3C; --violet:#B48CFF;
  --pixel:"Press Start 2P",ui-monospace,monospace; --read:"VT323",ui-monospace,monospace;
  /* layout: fixed 1600x900 stage scaled to fit; one scene per screen; shared dialogue box and XP HUD */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color-scheme:dark;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;transform:translate(-50%,-50%);overflow:hidden;background:var(--night);color:#fff;font-family:var(--pixel)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:90;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 5px)}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
.scene *{margin:0}
.abs{position:absolute}
canvas.bg{position:absolute;inset:0;width:1600px;height:900px;image-rendering:pixelated}
img.bgimg{position:absolute;inset:0;width:1600px;height:900px;object-fit:cover;image-rendering:pixelated}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,14,34,.55),rgba(18,14,34,0) 30%,rgba(18,14,34,0) 60%,rgba(18,14,34,.5))}
.shade.dark{background:rgba(18,14,34,.62)}
img.px{image-rendering:pixelated;display:block}
.notes{display:none}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.star{position:absolute;width:6px;height:6px;background:#fff;opacity:.7}
.scene[data-type=title] .star{animation:tw 2s steps(2) infinite}
@keyframes tw{50%{opacity:.2}}
.win{position:absolute;background:var(--blue);border:6px solid #fff;box-shadow:0 0 0 6px var(--night),0 0 0 12px #fff;border-radius:6px;padding:26px 32px}
.win.rel{position:relative}
.h{font:28px/1.5 var(--pixel);color:var(--gold);text-shadow:4px 4px 0 #000}
.k{font:15px/1.7 var(--pixel);color:var(--gold)}
.read{font:44px/1.05 var(--read);letter-spacing:.01em}
.tag{display:inline-block;font:15px var(--pixel);padding:8px 12px;background:#000;border:3px solid #fff}
.frag{opacity:0;translate:0 24px;transition:opacity .25s steps(3),translate .3s steps(3)}
.frag.on{opacity:1;translate:0 0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.pxbtn{background:var(--blue);border:5px solid #fff;padding:14px 20px;font:18px var(--pixel);box-shadow:5px 5px 0 #000;color:#fff}
.pxbtn:active{translate:3px 3px;box-shadow:2px 2px 0 #000}
.pxbtn.sm{font-size:14px;padding:10px 12px;border-width:4px}
.center{left:0;right:0;text-align:center}
.headline{font:34px/1.4 var(--pixel);color:var(--gold);text-shadow:5px 5px 0 #000}

/* HUD */
#hud{position:absolute;left:24px;right:24px;top:20px;display:none;align-items:center;gap:18px;z-index:60;font:14px var(--pixel)}
#hud.on{display:flex}
#hud .world{background:#000;border:4px solid #fff;padding:10px 14px;white-space:nowrap}
#hud .xp{margin-left:auto;display:flex;align-items:center;gap:12px;background:#000;border:4px solid #fff;padding:8px 12px}
#hud .bar{width:260px;height:20px;border:3px solid #fff;background:#222}
#hud .bar b{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--green) 0 12px,#5BD44C 12px 24px);transition:width .6s steps(8)}
#ctr{position:absolute;right:24px;bottom:14px;font:14px var(--pixel);color:var(--lav);z-index:60}
.plus{position:absolute;font:24px var(--pixel);color:var(--green);text-shadow:4px 4px 0 #000;z-index:70;pointer-events:none;animation:plus 1.2s steps(10) forwards}
@keyframes plus{from{translate:0 16px;opacity:0}20%{translate:0 0;opacity:1}80%{opacity:1}to{opacity:0}}
#help{position:absolute;left:50%;bottom:12px;translate:-50% 0;background:#000;border:3px solid #fff;padding:10px 16px;font:14px/1.6 var(--pixel);z-index:95;transition:opacity .6s;white-space:nowrap}

/* dialogue */
#dlg{position:absolute;left:50px;right:50px;bottom:44px;display:none;z-index:50}
#dlg.on{display:block}
#dlg .who{position:absolute;left:24px;top:-34px;background:var(--pink);border:5px solid #fff;padding:10px 16px;font:16px var(--pixel)}
#dlg .txt{font:54px/1.08 var(--read);padding:8px 40px 10px 0}
#dlg .more{position:absolute;right:26px;bottom:18px;font:18px var(--pixel);color:var(--gold)}
.menu{list-style:none;padding:0;margin:14px 0 0;display:none;gap:12px;font:46px/1 var(--read)}
.menu.on{display:grid}
.menu li{cursor:pointer;padding-left:50px;position:relative}
.menu li.sel::before{content:"▶";position:absolute;left:0;top:2px;color:var(--gold);font:28px var(--pixel);animation:blink .8s steps(2) infinite}
.menu li.good{color:var(--green)}.menu li.bad{color:var(--red);text-decoration:line-through}
.menu.row{grid-auto-flow:column;grid-auto-columns:1fr}

/* item get */
.itemget{position:absolute;left:0;right:0;top:110px;text-align:center}
.itemget canvas,.itemget img{display:block;margin:26px auto 0;image-rendering:pixelated}
.spin{animation:spinY 1.6s steps(8) 2}
@keyframes spinY{50%{transform:scaleX(-1)}}
.rays{position:absolute;left:50%;top:330px;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(rgba(255,210,63,.14) 0 10deg,transparent 10deg 20deg)}
.scene[data-type=clear] .rays{animation:rot 20s linear infinite}
@keyframes rot{to{rotate:360deg}}

/* stat */
.stat{display:grid;grid-template-columns:600px 1fr 120px 150px;gap:24px;align-items:center;font:22px/1.5 var(--pixel)}
.stat .meter{height:56px;border:5px solid #fff;background:#000}
.stat .meter b{display:block;height:100%;width:0;transition:width .4s steps(6)}
.stat .n{font:56px var(--read);text-align:right}
.stat .pm{display:flex;gap:10px}

/* quests */
.quest{display:flex;gap:24px;align-items:center;font:44px/1.05 var(--read);padding:13px 0;border-bottom:3px dashed rgba(255,255,255,.35)}
.quest i{flex:none;width:44px;height:44px;border:5px solid #fff;display:grid;place-items:center;font:20px var(--pixel);font-style:normal;color:var(--green)}
.quest i.done{background:var(--green);color:#000}

/* cards */
.qcard{background:#F5E6C4;color:#3A2A14;border:6px solid #3A2A14;padding:22px 24px;font:42px/1.05 var(--read);box-shadow:8px 8px 0 #000;position:relative;cursor:pointer}
.qcard small{display:block;font:14px var(--pixel);color:#8A5A1A;margin-bottom:12px}
.qcard .stamp{position:absolute;right:14px;bottom:10px;border:4px solid #C8202B;color:#C8202B;font:14px var(--pixel);padding:6px 8px;rotate:-10deg;display:none;background:#F5E6C4}
.qcard.on.stamped .stamp{display:block;animation:pop .3s steps(3)}
@keyframes pop{from{scale:.3}}

/* panels */
.pgrid{position:absolute;display:grid;gap:34px}
.panel{position:relative;background:var(--blue);border:6px solid #fff;box-shadow:0 0 0 6px var(--night),0 0 0 12px #fff;border-radius:6px;padding:22px 26px}
.panel .pl{font:24px/1.4 var(--pixel)}
.panel .pl .badge{display:inline-block;border:4px solid #fff;padding:5px 12px;margin-right:12px;color:#000}
.panel .pt{font:50px/1.06 var(--read);margin-top:16px}
.panel ul{list-style:none;padding:0;margin:14px 0 0;font:42px/1.08 var(--read)}
.panel li{padding-left:30px;position:relative;margin-top:6px}
.panel li::before{content:"▸";position:absolute;left:0;color:var(--gold)}

/* inventory */
.inv{position:absolute;display:grid;gap:26px}
.slot{background:var(--blue);border:6px solid #fff;border-radius:6px;padding:20px 14px;text-align:center;font:16px/1.6 var(--pixel);cursor:pointer;transition:translate .1s}
.slot:hover{translate:0 -6px}
.slot canvas,.slot img{display:block;margin:0 auto 14px;image-rendering:pixelated}
.slot small{display:block;font:36px/1 var(--read);color:var(--lav);margin-top:12px}
.slot.locked{filter:grayscale(1) brightness(.5)}
.slot.locked small{visibility:hidden}

/* list */
.lst{list-style:none;padding:0;margin:16px 0 0}
.lst li{font:44px/1.08 var(--read);padding:8px 0 8px 46px;position:relative}
.lst li::before{content:"▶";position:absolute;left:0;top:14px;font:20px var(--pixel);color:var(--gold)}
.lst.num li::before{content:attr(data-n);font:18px var(--pixel);color:#000;background:var(--gold);border:3px solid #fff;padding:3px 7px;top:12px}
.foot{font:16px/1.7 var(--pixel);color:var(--cyan)}
.chips{display:flex;flex-wrap:wrap;gap:14px}
.chip{background:#000;border:4px solid #fff;padding:10px 16px;font:16px/1.4 var(--pixel)}

/* timer */
.timerw{text-align:center;padding:16px 22px}
.timerw .tt{font:96px/1 var(--read);margin:6px 0 10px}
.timerw .row{display:flex;gap:10px;justify-content:center}

/* quiz */
.bossbar{position:absolute;left:50px;right:50px;top:96px;display:flex;gap:18px;align-items:center;font:16px var(--pixel);z-index:5}
.bossbar .bn{background:#000;border:4px solid #fff;padding:10px 14px;color:var(--red);white-space:nowrap}
.bossbar .hpw{flex:1;height:34px;border:5px solid #fff;background:#000}
.bossbar .hp{display:block;height:100%;width:100%;background:#9B30FF;transition:width .4s steps(5)}
.team{background:#000;border:4px solid #fff;padding:6px 8px 6px 12px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.team b{font:40px/1 var(--read);min-width:40px;text-align:center;color:var(--gold)}
.team button{background:var(--blue);border:3px solid #fff;font:13px var(--pixel);padding:6px 7px;color:#fff}
.lvlup{position:absolute;left:0;right:0;top:210px;text-align:center;font:54px var(--pixel);color:var(--green);text-shadow:6px 6px 0 #000;display:none;z-index:6}
.verdict{display:inline-block;font:20px var(--pixel);padding:8px 14px;border:4px solid #fff;margin-top:16px}

/* memory */
.memwrap{position:absolute;left:0;right:0;top:200px;height:440px;display:flex;align-items:center;justify-content:center;gap:40px}
.ring{font:120px/1 var(--read);color:var(--gold);width:180px;height:180px;border:8px solid #fff;display:grid;place-items:center;background:#000}
.words{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;max-width:1300px}
.words span{background:#F5E6C4;color:#3A2A14;border:6px solid #3A2A14;box-shadow:8px 8px 0 #000;font:64px/1 var(--read);padding:14px 26px}
.digits{display:flex;gap:18px}
.digits span{width:120px;height:150px;display:grid;place-items:center;background:#000;border:6px solid #fff;font:120px/1 var(--read);color:var(--cyan)}
.hiddenmem{font:180px/1 var(--pixel);color:var(--lav);text-shadow:8px 8px 0 #000}

/* select */
.sgrid{position:absolute;left:70px;right:70px;top:200px;display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.scard{background:#000;border:6px solid #fff;padding:20px;cursor:pointer;min-height:230px;box-shadow:8px 8px 0 #000}
.scard:hover{translate:0 -6px}
.scard b{display:inline-block;font:22px var(--pixel);background:var(--gold);color:#000;border:4px solid #fff;padding:6px 12px}
.scard p{font:44px/1.02 var(--read);margin-top:18px}
.scard.seen{border-color:var(--green)}
.overlay{position:absolute;left:120px;right:120px;top:150px;display:none;z-index:40}
.overlay.on{display:block}

/* tv */
.tv{position:absolute;left:470px;top:190px;width:660px;height:420px;background:#3A2A14;border:8px solid #000;border-radius:30px;box-shadow:0 0 0 6px #fff,10px 10px 0 6px #000;padding:26px}
.tv .scr{width:100%;height:100%;background:#0B0B14;border:6px solid #000;border-radius:16px;display:grid;place-items:center;overflow:hidden;position:relative}
.tv .scr::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 3px,transparent 3px 7px)}

/* breathe */
.bbox{position:absolute;left:520px;top:220px;width:560px;height:330px;border:8px solid #fff;background:#000;overflow:hidden}
.bbox b{position:absolute;left:0;right:0;bottom:0;height:0;background:repeating-linear-gradient(0deg,var(--cyan) 0 16px,#2BB8D8 16px 32px);transition:height 4s steps(16)}
.bbox p{position:absolute;inset:0;display:grid;place-items:center;font:30px/1.4 var(--pixel);text-shadow:4px 4px 0 #000;text-align:center;z-index:2}

.secret{position:absolute;width:40px;height:40px;border:0;padding:0;background:transparent;opacity:.28;z-index:20}
.secret:hover{opacity:.6}
#fx{position:absolute;inset:0;z-index:80;pointer-events:none}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:85;transition:opacity 1.2s}
#dim.on{opacity:.82}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:42vh;overflow:auto;background:#FFF8EC;color:#1E1E1E;padding:18px 28px 24px;font:16px/1.55 "DM Sans",system-ui,sans-serif;transform:translateY(105%);transition:transform .3s;z-index:100;border-top:6px solid var(--pink)}
#notes.open{transform:none}
#notes h3{font:700 14px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px;color:#6b5d63}
#notes p{margin:0 0 8px;max-width:90ch}
#notes .ask{font-weight:700}
#notes .tip{background:#EFE3FF;border-left:4px solid #8A5CF6;padding:6px 10px}
#notes .fix{background:#FFF0C2;border-left:4px solid #E0A100;padding:6px 10px}
#notes a{color:#2340A8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#toast{position:absolute;left:50%;top:150px;translate:-50% 0;background:var(--red);color:#000;border:4px solid #fff;padding:12px 18px;font:15px/1.6 var(--pixel);z-index:96;display:none;box-shadow:6px 6px 0 #000}
#toast.on{display:block}
</style>
</head>

nt, encourage others when playing games, give compliments, take turns deciding what to play, encourage those who are learning, play by the rules\n\nCLASS--> possible answers:\noffer to help others, raise your hand when you want to say something, ask first before using someone else's things, listen when others are speaking, compliment someone you haven't before, work with different people, try to learn from others who are different\n\nYOUNGER STUDENTS --> possible answers:\noffer to help them learn something new, invite them to play- especially those that are left out, say hi to them, share things with them\n \nFAMILY MEMBERS--> possible answers:\nask first before using someone else's things, say kind things to each other, use a friendly voice, offer to help with problems or chores, share your things, show interest in others' activities", "19": "**read through slide \n\nChoose a behavior that you would like to improve. It can be something you do already but what to try to do more often.", "20": "**read thru slide", "21": "**read thru slide", "22": "Deciding on a behavior you want to start using or use more often is setting a goal for yourself. \n\n**read through slide \n\nOften, we think of goal setting as things that are more related to academic or physical achievements but starting with our behavior can be just as valuable. \n\nThat is what we are each going to do now, but before we do, let's go over some criteria to help us.", "23": "**read through and expand on each one", "24": "**read thru", "25": "Go ahead and fill out your plans for yourself. Your goal needs to be a single behavior, keep it specific so it's easy to tell when you have done it. \n\n**hand out passport and read thru instructions on next slide\n\nhttps://www.canva.com/design/DAGqiXNUDsQ/llMQgTn1bscfrAS8tHOT4A/edit?utm_content=DAGqiXNUDsQ&utm_campaign=designshare&utm_medium=link2&utm_source=sharebutton", "26": "instructions: \n\nFirst draw yourself as you are today. What are some goals you want to  inv:sc=>({enter(el){$$('.slot',el).forEach(b=>b.onclick=e=>{e.stopPropagation();equip(b)})},steps:sc.items.map((it,k)=>el=>equip($$('.slot',el)[k]))}),
 stat:()=>({enter(el){$$('.stat',el).forEach(s=>{let v=+(s.dataset.v||0);const draw=()=>{s.dataset.v=v;$('.n',s).textContent=v;$('.meter b',s).style.width=Math.min(100,v*4)+'%'};draw();$$('.pm button',s).forEach(b=>b.onclick=e=>{e.stopPropagation();v=Math.max(0,v+ +b.dataset.d);draw()})})},steps:[]}),
 standup:sc=>{const st=(sc.intro||[]).map((x,k)=>el=>$$('.suintro .frag',el)[k].classList.add('on'));
   sc.items.forEach((it,k)=>st.push(el=>{$('.suintro',el).style.display='none';$$('.suart0',el).forEach(a=>a.style.display='none');const q=$('.suq',el);q.style.display='block';
     $('.sutop',el).textContent=it[2]||sc.head||'STAND UP IF…';$('.sutext',q).innerHTML=it[0];const im=$('.suimg',q);if(it[1]){im.src=IMG[it[1]];im.style.display='block';im.style.height=(it[3]||sc.artH||330)+'px'}else im.style.display='none';
     q.animate([{translate:'0 30px',opacity:0},{translate:'0 0',opacity:1}],{duration:300,easing:'steps(4)'});$('.sun',el).textContent=`QUESTION ${k+1} OF ${sc.items.length}`;award('su'+k,3)}));
   return {enter(el){$('.suintro',el).style.display='';$$('.suart0',el).forEach(a=>a.style.display='');$('.suq',el).style.display='none';$('.sutop',el).textContent=sc.head||'STAND UP IF…';$('.sun',el).textContent=''},steps:st}},
 item:sc=>({enter(){award('item'+cur,sc.xp||20)},steps:[]}),
 big:sc=>({enter(el){if(sc.xp)award('big'+cur,sc.xp);const d=$('.dimbtn',el);if(d)d.onclick=e=>{e.stopPropagation();$('#dim').classList.toggle('on');d.textContent=$('#dim').classList.contains('on')?'LIGHTS ON':'DIM SCREEN'};
   const c=$('.clapbtn',el);if(c)c.onclick=e=>{e.stopPropagation();confetti(800,700,120);award('clap'+Math.random(),5)}},steps:[]}),
 list:sc=>({enter(el){if(sc.timer)timer($('.timerw',el),sc.timer.sec)},steps:[],fragXP:3}),

 memory:sc=>{let left=sc.secs;return {enter(el){left=sc.secs;$('.mcontent',el).style.display='none';$('.hiddenmem',el).style.display='none';$('.ring',el).style.display='none';$('.mq',el).style.display='none';$('.ma',el).style.display='none';$('.mlead',el).textContent=sc.lead||'';
     if(sc.kind==='shapes')drawShapes($('.shapes',el))},
   steps:[el=>{$('.mlead',el).textContent=`Look carefully for ${sc.secs} seconds…`;$('.mcontent',el).style.display='';const r=$('.ring',el);r.style.display='grid';r.textContent=left;
       const id=I(()=>{left--;r.textContent=left;if(left<=0){clearInterval(id);$('.mcontent',el).style.display='none';r.style.display='none';$('.hiddenmem',el).style.display='block';$('.mlead',el).textContent='Time! Press → for the question.'}},1000)},
     el=>{$('.mcontent',el).style.display='none';$('.ring',el).style.display='none';$('.hiddenmem',el).style.display='block';$('.mq',el).style.display='block';$('.mlead',el).textContent=''},
     el=>{$('.ma',el).style.display='block';award('mem'+cur,10);confetti(800,780,80)}]}},
 breathe:sc=>{let n=0;return {enter(el){n=0;const b=$('.bbox b',el);b.style.transition='none';b.style.height='0';$('.bt',el).textContent='PRESS → TO START';$('.bcount',el).textContent=''},
   steps:[el=>{const b=$('.bbox b',el),t=$('.bt',el);const cyc=()=>{n++;$('.bcount',el).textContent=`BREATH ${n} OF 3`;t.textContent='BREATHE IN…';b.style.transition='height 4s steps(16)';b.style.height='100%';
       T(()=>{t.textContent='HOLD…'},4000);T(()=>{t.textContent='BREATHE OUT…';b.style.height='0'},6000);T(()=>{if(n<3)cyc();else{t.textContent='“SLOW DOWN.” NICE AND CALM.';award('breathe',20);confetti(800,380,90)}},10000)};cyc()}]}},
 select:sc=>({enter(el){const ov=$('.overlay',el);ov.classList.remove('on');$$('.scard',el).forEach(c=>c.onclick=e=>{e.stopPropagation();const it=sc.items[+c.dataset.k];$('.otitle',ov).textContent=`SCENARIO ${+c.dataset.k+1} · ${it[0].toUpperCase()}`;$('.otext',ov).innerHTML=it[1];ov.classList.add('on');c.classList.add('seen');award('sel'+c.dataset.k,5)});
   $('.oclose',ov).onclick=e=>{e.stopPropagation();ov.classList.remove('on')}},steps:[]}),
 clear:sc=>({enter(el){$('.qlogEnd',el).innerHTML=questHTML(QUESTS.length,true,true);award('clear',30);$('.endxp',el).textContent='RESPECT XP: '+xp;T(()=>confetti(800,160,220),500)},steps:[]})
};
function equip(b){if(!b||!b.classList.contains('locked'))return;b.classList.remove('locked');award('item'+cur+b.textContent,10);confetti(toStage(b).x,toStage(b).y-60,50)}
function drawShapes(cv){const c=cv.getContext('2d');c.fillStyle='#F5E6C4';c.fillRect(0,0,320,150);
  c.fillStyle='#3E9B3E';for(let y=-20;y<=20;y++)for(let x=-20;x<=20;x++)if(x*x+y*y<=400)c.fillRect(45+x,75+y,1,1);
  c.fillStyle='#E0B000';c.fillRect(100,68,44,14);c.fillRect(115,53,14,44);
  c.fillStyle='#6E7F96';c.fillRect(160,55,40,40);
  c.fillStyle='#8A4FD0';for(let y=-16;y<=16;y++)for(let x=-28;x<=28;x++)if((x*x)/784+(y*y)/256<=1)c.fillRect(240+x,75+y,1,1);
  c.fillStyle='#D7262E';for(let y=0;y<40;y++){const w=Math.round(y*0.6);c.fillRect(290-w,55+y,w*2+1,1)}}

/* ---------- build scenes ---------- */
const S={};
L.scenes.forEach((sc,i)=>{const el=document.createElement('section');el.className='scene';el.dataset.label=sc.label||sc.t;el.dataset.type=sc.t;
  el.innerHTML=(R[sc.t]||R.big)(sc)+(sc.secret?`<button class="secret" style="left:${sc.secret[0]}px;top:${sc.secret[1]}px" aria-label="Hidden treasure"><canvas class="icon" data-icon="coin" width="40" height="40" style="width:40px;height:40px;image-rendering:pixelated"></canvas></button>`:'')+`<aside class="notes">${notesFor(sc)}</aside>`;
  stage.insertBefore(el,$('#hud'));S[i]=(C[sc.t]||C.big)(sc);S[i].sc=sc});
const scenes=$$('.scene');
$$('canvas.icon').forEach(icon);$$('.stars').forEach(st=>{for(let k=0;k<50;k++){const s=document.createElement('i');s.className='star';s.style.left=Math.random()*1600+'px';s.style.top=Math.random()*900+'px';s.style.animationDelay=(-Math.random()*2)+'s';st.appendChild(s)}});
paintBgs(document);
$$('.linkbtn').forEach(b=>b.onclick=e=>{e.stopPropagation();window.open(b.dataset.url,'_blank','noopener')});
$('#hud .world').textContent=`LEVEL ${L.num} · ${L.short||L.name}`;

/* ---------- navigation ---------- */
function go(i){if(i<0||i>=scenes.length)return;clearAll();busy=false;if(typing){clearInterval(typing);typing=null}scenes[cur].classList.remove('on');$('#dim').classList.remove('on');cur=i;stepI=0;const el=scenes[cur];el.classList.add('on');
  $$('.frag',el).forEach(f=>f.classList.remove('on'));dlg.classList.remove('on');menuOn=false;$('.menu',dlg).classList.remove('on');
  $('#hud').classList.toggle('on',cur>=1);$('#ctr').textContent=String(cur+1).padStart(2,'0')+' / '+scenes.length;
  const s=S[cur];s&&s.enter&&s.enter(el);
  const b=$('.secret',el);if(b){b.style.opacity='';b.onclick=e=>{e.stopPropagation();b.style.opacity=1;award('coin'+cur,25);confetti(toStage(b).x,toStage(b).y,90)}}
  $('#notesH').textContent='Speaker notes · scene '+(cur+1)+' · '+el.dataset.label+' · press N to hide';const n=$('.notes',el);$('#notesB').innerHTML=n?n.innerHTML:'';
  try{history.replaceState(null,'','#s'+(cur+1))}catch(e){}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.id);toast.id=setTimeout(()=>t.classList.remove('on'),2600)}
function next(){if(busy)return;if(finishTyping())return;if(menuOn){const t=$('.txt',dlg);t.animate([{translate:'-6px 0'},{translate:'6px 0'},{translate:'0 0'}],{duration:180});toast('PICK AN ANSWER FIRST · OR PRESS S TO SKIP THIS ACTIVITY');return}
  const el=scenes[cur],s=S[cur];
  if(s&&s.steps&&stepI<s.steps.length){s.steps[stepI++](el);return}
  const fr=$$('.frag[data-step]',el).filter(f=>!f.classList.contains('on'));
  if(fr.length){fr[0].classList.add('on');if(s&&s.fragXP)award('f'+cur+'-'+fr.length,s.fragXP);return}go(cur+1)}
function prev(){if(stepI>0||$$('.frag.on[data-step]',scenes[cur]).length){go(cur);return}go(cur-1)}
addEventListener('keydown',e=>{
  if(e.target.matches('input'))return;
  if(menuOn&&(e.key==='ArrowUp'||e.key==='ArrowDown'||e.key==='ArrowLeft'&&$('.menu',dlg).classList.contains('row'))){e.preventDefault();menuSel=(menuSel+((e.key==='ArrowDown')?1:-1)+menuN)%menuN;paintMenu();return}
  if(menuOn&&e.key==='Enter'){e.preventDefault();pick();return}
  if(e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();if(menuOn&&$('.menu',dlg).classList.contains('row')){menuSel=(menuSel+1)%menuN;paintMenu();return}next()}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev()}
  else if(e.key==='s'||e.key==='S'){e.preventDefault();go(cur+1)}
  else if(e.key==='n'||e.key==='N')$('#notes').classList.toggle('open');
  else if(e.key==='f'||e.key==='F'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(err){}}});
stage.addEventListener('click',e=>{if(e.target.closest('button,input,label,form,.menu,.slot,.qcard,.stat,.secret,.timerw,.scard,.overlay,.team'))return;next()});
const m=location.hash.match(/^#s(\d+)$/);go(m?Math.min(+m[1]-1,scenes.length-1):0);
window.__pq={next,go,get cur(){return cur},get menuOn(){return menuOn},get steps(){return S[cur].steps.length},get stepI(){return stepI},pick:()=>pick(),down:()=>{menuSel=(menuSel+1)%menuN;paintMenu()}};
})();
