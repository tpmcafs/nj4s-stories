<style>
:root{
  --ink:#1E1E1E; --pink:#F7B6CF; --sky:#019FEB; --tomato:#F04728; --butter:#FFDD66; --mint:#37E0AB; --lilac:#C3ABFF; --blue:#0A84FF; --green:#34C759; --orange:#FF9D3C;
  --display:"Bricolage Grotesque","Arial Black",sans-serif; --body:"DM Sans",system-ui,sans-serif; --mono:"Space Mono",ui-monospace,monospace; --wide:"Archivo","Helvetica Neue",Arial,sans-serif;
  /* layout: fixed 1600x900 stage; phone in the middle with big-type story left and class prompts right; some screens go full-stage */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#111;color-scheme:dark;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;transform:translate(-50%,-50%);overflow:hidden;background:#FFE9F1;color:var(--ink);font-family:var(--body);transition:background .6s}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
#side{position:absolute;left:70px;top:96px;width:500px}
#side .k{font:700 18px/1.4 var(--mono);letter-spacing:.08em;color:#9A2A58;text-transform:uppercase}
#side h1{font:800 100px/.92 var(--display);letter-spacing:-.035em;margin:16px 0 0;text-wrap:balance}
#side .p{font:500 28px/1.32 var(--body);margin-top:20px}
#rside{position:absolute;left:1105px;top:96px;width:440px}
#rside .k{font:700 17px var(--mono);letter-spacing:.08em;color:#666;text-transform:uppercase}
#rside .q{font:800 42px/1.08 var(--display);margin-top:14px;text-wrap:balance}
.anim-in{animation:sideIn .5s cubic-bezier(.2,1.2,.3,1)}
@keyframes sideIn{from{opacity:0;translate:0 30px}}
.lines{display:grid;gap:12px;margin-top:20px}
.line{font:500 24px/1.3 var(--body);padding-left:20px;border-left:5px solid currentColor;animation:sideIn .45s cubic-bezier(.2,1.2,.3,1)}
#phone{position:absolute;left:615px;top:22px;width:440px;height:856px;background:#111;border-radius:64px;padding:14px;box-shadow:26px 26px 0 rgba(30,30,30,.16);transition:opacity .4s,translate .5s}
#phone.away{opacity:0;translate:0 60px;pointer-events:none}
#scr{position:absolute;inset:14px;border-radius:52px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.notch{position:absolute;left:50%;top:24px;width:120px;height:34px;margin-left:-60px;background:#111;border-radius:20px;z-index:20}
.sb{position:absolute;left:0;right:0;top:0;height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 34px;font:700 16px var(--body);z-index:15;pointer-events:none}
.homebar{position:absolute;left:50%;bottom:10px;width:150px;height:6px;margin-left:-75px;background:#111;border-radius:6px;z-index:19}
.view{position:absolute;inset:0;display:flex;flex-direction:column;animation:openApp .45s cubic-bezier(.2,1.15,.3,1)}
@keyframes openApp{from{scale:.3;opacity:0;border-radius:50px}}
.hd{padding:64px 18px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #eee;background:#F7F7F9;font:700 19px var(--body)}
.hd .t{margin:auto;text-align:center}
.hd small{display:block;font:400 15px var(--body);color:#888}
.hd .bk{color:var(--blue);font:600 17px var(--body);width:60px}
.body{flex:1;overflow:hidden;padding:16px}
.msgs{flex:1;padding:14px;display:flex;flex-direction:column;gap:8px;overflow:hidden;justify-content:flex-end}
.m{max-width:86%;padding:12px 17px;border-radius:22px;font:400 21px/1.3 var(--body);position:relative}
.m.new{animation:msgIn .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes msgIn{from{scale:.4;opacity:0}}
.m.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px;transform-origin:right bottom}
.m.them{align-self:flex-start;background:#E9E9EB;border-bottom-left-radius:6px;transform-origin:left bottom}
.m.bot{align-self:flex-start;background:#1E1E1E;color:#fff;border-bottom-left-radius:6px}
.who{font:600 15px var(--body);color:#888;margin:4px 0 -4px 12px;display:flex;align-items:center;gap:6px}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font:700 14px var(--body);color:#111}
.sys{align-self:center;font:600 15px var(--body);color:#888;text-align:center;max-width:90%}
.compose{display:flex;gap:10px;align-items:center;padding:12px 14px 30px;border-top:1px solid #eee}
.compose .in{flex:1;min-height:44px;border:1px solid #ddd;border-radius:22px;padding:10px 16px;font:18px/1.3 var(--body);color:#bbb}
.compose .send{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font:700 20px var(--body);flex:none}
.pin{margin:10px 12px 0;background:#FFF5CC;border-radius:16px;padding:12px 14px;font:500 18px/1.35 var(--body);display:flex;gap:10px;animation:msgIn .5s cubic-bezier(.2,1.4,.4,1)}
.lock{position:absolute;inset:0;color:#fff;display:flex;flex-direction:column;align-items:center;padding-top:96px}
.lock .t{font:300 104px/1 var(--wide);font-stretch:90%}
.lock .d{font:500 19px var(--body);margin-top:4px}
.notifs{width:calc(100% - 28px);margin-top:30px;display:grid;gap:10px}
.notif{background:rgba(255,255,255,.88);color:#111;border-radius:22px;padding:13px 16px;font:18px/1.35 var(--body);animation:nIn .5s cubic-bezier(.2,1.4,.4,1) backwards}
.notif b{display:flex;justify-content:space-between;font:700 14px var(--body);color:#666;margin-bottom:4px;letter-spacing:.02em}
@keyframes nIn{from{translate:0 -30px;opacity:0;scale:.9}}
.widget{width:calc(100% - 28px);margin-top:22px;background:rgba(255,255,255,.92);color:#111;border-radius:26px;padding:18px 20px;animation:nIn .5s cubic-bezier(.2,1.4,.4,1) backwards}
.row{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid #eee;font:500 20px/1.3 var(--body);animation:msgIn .4s cubic-bezier(.2,1.4,.4,1) backwards}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2.5px solid #C7C7CC;display:grid;place-items:center;color:#fff;font:700 15px var(--body)}
.chk.on{background:var(--blue);border-color:var(--blue)}
.pollb{border:2px solid #eee;border-radius:18px;background:#fff;padding:16px;text-align:left;position:relative;overflow:hidden;font:600 20px var(--body);width:100%}
.pollb i{position:absolute;left:0;top:0;bottom:0;opacity:.22;transition:width .4s}
.pollb span{position:relative;display:flex;justify-content:space-between;gap:10px}
.big-n{font:800 110px/1 var(--display);font-variant-numeric:tabular-nums}
.tagc{display:inline-block;background:#F2F2F7;border-radius:99px;padding:8px 14px;font:600 19px var(--body);margin:0 8px 8px 0;animation:msgIn .4s cubic-bezier(.2,1.5,.4,1)}
#full{position:absolute;inset:0;display:none;z-index:25}
#full.on{display:block;animation:sideIn .5s}
.wcard{background:#fff;border-radius:34px;padding:26px 28px;box-shadow:0 18px 40px rgba(30,30,30,.12);overflow:hidden}
.wcard h3{font:800 34px/1 var(--display);margin:0 0 12px;display:flex;align-items:center;gap:12px}
.wcard h3 i{width:16px;height:16px;border-radius:50%;display:block}
.wcard p{font:500 22px/1.3 var(--body);margin:10px 0 0}
.frag{opacity:0;translate:0 30px;scale:.96;transition:opacity .35s,translate .55s cubic-bezier(.2,1.5,.4,1),scale .55s cubic-bezier(.2,1.5,.4,1)}
.frag.on{opacity:1;translate:0 0;scale:1}
.story{position:absolute;inset:0;display:flex;flex-direction:column;color:#fff}
.story .bars{display:flex;gap:4px;padding:62px 14px 0}
.story .bars i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.story .bars i b{display:block;height:100%;width:0;background:#fff;transition:width .4s}
.story .who2{display:flex;align-items:center;gap:10px;padding:12px 16px;font:700 17px var(--body)}
.story .card{flex:1;display:grid;place-items:center;padding:24px;text-align:center}
.story .card p{font:700 30px/1.2 var(--display);animation:msgIn .45s cubic-bezier(.2,1.4,.4,1)}
.story .bub{background:#fff;color:#111;border-radius:28px;padding:20px 22px;font:700 26px/1.2 var(--display);position:relative;animation:msgIn .45s cubic-bezier(.2,1.4,.4,1);text-align:left}
.story .bub small{display:block;font:700 15px var(--mono);letter-spacing:.06em;margin-bottom:6px}
.story .reply{margin:0 14px 30px;border:1.5px solid rgba(255,255,255,.7);border-radius:99px;padding:12px 18px;font:500 16px var(--body);color:rgba(255,255,255,.85)}
.tbtn{border:0;border-radius:99px;padding:14px 28px;font:700 20px var(--body)}
.timerbig{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;margin-top:16px}
.timerbig .tt{font:300 72px/1 var(--wide);min-width:180px;font-variant-numeric:tabular-nums}
#ctr{position:absolute;left:70px;bottom:24px;font:700 15px var(--mono);letter-spacing:.06em;opacity:.6;z-index:40}
