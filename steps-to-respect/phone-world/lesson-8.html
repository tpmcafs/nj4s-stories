<script>
/* Lesson specs for Steps to Respect Lessons 2–10. Wording and speaker notes come from the original decks.
   Notes: lines separated by "\n"; a line starting with "? " is an ASK line (shown bold). */
const LESSON_NAMES=['Friendship','Conflicts between friends','Are you mad at me?','Conflict and bullying','Cultural diversity','Refusing and reporting','Bystanders can help','Taking responsibility','Making it happen','Safe, caring, respectful school'];
const MAPNOTE=n=>`? Can anyone tell me something they remember about last week's lesson? (wait for responses)\nAs you can see, this week is Lesson ${n}: ${LESSON_NAMES[n-1]}.`;
const SPECS={
2:{n:2,title:'Conflict between friends',scenes:[
 {t:'title',notes:'Introduce yourself.'},
 {t:'standup',title:'Stand up, sit down',rules:['Stand up if your answer is YES.','Sit down if your answer is NO.'],prompts:['…you are never late for school','…your favorite food is a hamburger','…you have more than two siblings','…your favorite subject in school is language arts','…you like coming to school'],notes:'Have students introduce themselves with this icebreaker.\nPress → for each “Stand up if…” question.'},
 {t:'map',notes:"Last week, we talked about friendship and how to have more respectful friendships.\n? Can anyone tell me something they remember about last week's lesson? (wait for responses)\nAs you can see, this week we will dive a little deeper into friendship and what to do when we have a conflict with our friends."},
 {t:'objectives',title:'Conflicts in friendship',items:['Identify angry feelings','Define conflict','Apply emotion-management strategies, including self-talk, during a conflict','Identify a conflict from different perspectives','Generate and evaluate possible solutions to a problem'],notes:'Throughout this program, we will practice treating all people with respect.\nRead through objectives.'},
 {t:'poll',kicker:'Show of hands',title:'Raise your hand if you have ever felt angry.',options:['I have felt angry'],notes:'? Raise your hand if you have ever felt angry. (wait for response)\nIt looks like we all have. Everyone feels angry sometimes.'},
 {t:'questions',kicker:'Think about feeling angry',title:'How does your body feel?',qs:['How does your body feel when you are angry?'],answers:['It feels hot or cold','Your heart beats faster','You’re out of breath','Your head hurts','Your face feels hard and tense'],notes:'? Now think about feeling angry. How does your body feel?\n(Possible responses: It feels hot or cold, your heart beats faster, you\'re out of breath, your head hurts, your face feels hard and tense.) Press → to show them.'},
 {t:'def',kicker:'Is anger a bad thing?',word:'anger',prompt:'Is anger a bad thing?',def:'Sometimes anger is helpful. It lets us know when something isn’t right and needs to be changed.',notes:'Summarize.\n? I feel angry when I see students put down or pick on other students. Is it bad to feel angry about that? (No)\nPress → for “sometimes anger is helpful” and summarize/provide an example.'},
 {t:'questions',kicker:'Think about angry people',title:'How do people sometimes act when they are angry?',qs:['How do people sometimes act when they are angry?'],answers:['They may yell','They may get very quiet','They may start a fight'],notes:'Read through.\n(Possible answers: they may yell, get very quiet, start a fight)\nAngry behavior that hurts people is not okay. If we let our anger get away from us and don\'t control it, we may hurt a friendship that we really want to keep.'},
 {t:'statement',kicker:'Anger isn’t bad',text:'How we act when we are angry is what matters.',sub:'Angry behavior that hurts or disrespects people is not okay and has consequences.',notes:'Sometimes when we are angry, we do or say things that are disrespectful and hurtful. It\'s not bad to feel angry. But how you act when you are angry is important.'},
 {t:'steps',kicker:'Last week · Good intentions',title:'4 friendship moves',steps:[['Assume','that your friends and the people around you have good intentions'],['Check','intentions when you are unsure about something'],['Communicate','to build connection and to make your friendships last'],['Apologize','if you accidentally hurt someone and to show your good intentions']],notes:'Quick review if you want.\nIn the last lesson, we began exploring ways to build lasting friendships.\nIn today\'s lesson, we are going to learn about keeping friendships by managing our feelings and acting respectfully and responsibly when we are angry. That will help us work out conflicts with other people, especially our friends.'},
 {t:'def',kicker:'Word of the day',word:'conflict',prompt:'Who can tell me what this means?',def:'A disagreement that happens when people want different things.',notes:'Read through and summarize.\nFor example, if two friends want to do different activities at the same time, they have a conflict.\nHere are some of the things to consider about conflict.'},
 {t:'list',kicker:'Conflict defined',title:'Things to know about conflict',items:['Both people have equal power','All friendships have conflicts from time to time','Not the same as a fight or argument','Can be handled respectfully or disrespectfully'],notes:'Summarize or give examples if needed. Press → for each one.\nThe people involved in a conflict have equal power to solve the problem.\nAll friends have conflicts from time to time.\nA conflict is not necessarily the same as a fight or an argument, but it can lead to one if good problem-solving skills are not used.\nConflict can be handled either respectfully or disrespectfully. Being able to resolve conflicts is an important friendship skill.'},
 {t:'story',kicker:'Scenario',title:'Jack and Rob',place:'street',cast:[['Jack','#3AE0FF'],['Rob','#FF9D3C']],lines:[['','Jack and Rob are good friends. They like to hang out after school. They’ve been going to Jack’s house to play games a lot lately.'],['','Jack wants to play games again today, but Rob wants to go to the mall to buy the new Lego set.'],['Rob','Come on Jack, we always go to your house. Let’s do what I want for a change.'],['?','How might Jack feel after Rob’s remark?'],['Jack','You wanted to come to my house too, it’s not just what I wanted!'],['','Jack notices his tone of voice and decides he better check his emotions. Let’s see how he does this.']],notes:'Read the scenario as it plays.\n? How might Jack feel after Rob\'s remark? (Possible answers: annoyed, angry, frustrated, uneasy)\nJack is annoyed too. Jack notices his tone of voice and decides he better check his emotions.'},
 {t:'steps',kicker:'Managing your feelings and actions',title:'What Jack does',steps:[['Check your feelings','Complete the sentence “I feel ____.” Jack thinks, “I feel angry.”'],['Decide what to do','“I need to get calm” or “I’m going to argue back”? Jack thinks, “I need to calm down before I try to solve this problem.”']],notes:'To check your feelings, first you need to decide what you are feeling. Complete the sentence "I feel...". Let\'s imagine that Jack is using the steps. He thinks to himself, "I feel angry."\nNext he needs to decide what to do based on how he feels.\nJack thinks "I need to calm down before I try to solve this problem."'},
 {t:'statement',kicker:'Self-talk',text:'Self-talk helps you concentrate.',sub:'Self-talk is anything you say to yourself that helps you do your best, like “I can do it” or “Stay focused.”',notes:'In this example, Jack is using self-talk. Self-talk is anything you say to yourself that helps you do your best.\nMany people use self-talk to help them concentrate. They say things like "I can do it" or "stay focused". Self-talk can help us manage our feelings and act respectfully.'},
 {t:'breathe',kicker:'What you need to do to get calm',title:'Take three deep breaths',words:['Chill out!','Relax!','Slow down!'],notes:'Read through/summarize: take three deep breaths or say a couple words to help you “get calm.” Practice together with the breathing circle.'},
 {t:'video',kicker:'Calming down',title:'What to do if you need to get calm',url:'https://youtube.com/shorts/Kv_mnWQKUKE?si=VW_D4AO7qdKNZ0CL',text:'A funny example of self-talk and pausing before getting angry.',notes:'Show the video.\nThis is a funny example of how people use self-talk and pausing before getting angry.\nEven adults, especially adults, use these methods to calm down too!'},
 {t:'list',kicker:'Conflicts in friendship',title:'Jack and Rob are like many friends',items:['At times they both want different things.','Neither person has done anything wrong, but they must work together to resolve the conflict respectfully.','After you are calm, the most important step to take when you have conflict is the first one.'],notes:'Read through/summarize.'},
 {t:'questions',kicker:'What’s the problem?',title:'How can the problem be described respectfully?',scenario:'“Let’s do what I want for a change.” (Rob)',qs:['Does this give both points of view?'],answers:['No. First say what one person wants, then say what the other person wants.','Words like “always” and “never” don’t state both viewpoints respectfully.'],notes:'Identify the problem by describing it in a way that says respectfully what both people want.\n? Rob said "Let\'s do what I want for a change"! Does that give both points of view? (Answer: No)\nTo give both points of view, you need to first say what one person wants, then say what the other person wants.\nPS: If you use words like "always" and "never" you are not stating both viewpoints respectfully.'},
 {t:'activity',kicker:'Activity · Worksheets',title:'Identify the problem respectfully',items:['Identifying what both people want is a very important skill.','It is a fair way of dealing with conflicts.','Work with partners to practice identifying problems in a respectful way.'],minutes:5,notes:'Now we are going to do an activity in pairs to practice identifying the problem in a respectful way.\nWorksheet answers for part 1: 1) f  2) d  3) e  4) c\nIf there is time at the end, have students share their "respectful statements".'},
 {t:'activity',kicker:'Role play',title:'Solve it respectfully',items:['Act out the scenario and see if you can solve the problem respectfully.','Say what one person wants, then what the other person wants.'],roles:['Partner A','Partner B'],minutes:3,notes:'Pairs act out the scenario. If there is time, have students share their "respectful statements".'},
 {t:'end',notes:'Any questions? Thank the class.'}]},

3:{n:3,title:'Are you mad at me?',scenes:[
 {t:'title',notes:'Introduce yourself.'},
 {t:'map',notes:"So far in the Steps to Respect program, we have explored things people do to keep friends. Let's review some of those things."},
 {t:'steps',kicker:'Review',title:'What we’ve learned so far',steps:[['Intentions','Look for good intentions in our friends and others'],['Trust','Keep your word and be respectful'],['Conflicts','Resolve disagreements respectfully and apologize if you need to']],notes:'? Who can tell me one thing we learned so far?\nSummarize/acknowledge other student responses.\n? Everyone has disagreements sometimes. Why is it important for friends to work out problems fairly and respectfully? (Possible answers: Friendships aren\'t good if they\'re unfair and disrespectful. Being fair and respectful helps you keep the friends you have.)'},
 {t:'objectives',title:'Are you mad at me?',items:['Apply a problem-solving model and skill steps to manage conflicts respectfully','Apply perspective-taking skills','Generate ideas for making amends'],notes:'Last week, we explored ways to solve problems and resolve conflicts between friends.\nToday we will talk about how to resolve conflicts in which one friend accidentally hurts or embarrasses the other.'},
 {t:'activity',kicker:'Role play · Part 1',title:'Are you mad at me?',items:['Watch the skit about two friends who have the same goal but run into problems.','What is the problem?','How might this problem affect the trust these friends have in each other?'],roles:['Jake','Ryan','Volunteer 3'],notes:'Next, I am going to need three volunteers. (select 3 students)\nWe are going to see a skit about two friends who have the same goal but encounter problems.\nAs you watch, try to figure out: What is the problem? How might this problem affect the trust these friends have in each other?\nHand out page 1 of the skit script (Canva link in the original deck).'},
 {t:'questions',kicker:'Discuss',title:'What is the problem?',qs:['What is the problem between Jake and Ryan?','Why do you think Ryan told Jake’s secret?','Do you think Ryan meant to upset Jake?','How might Ryan feel in this situation?','How might this situation affect the trust in their friendship?'],answers:['Jake is upset that Ryan has told other people that he likes Lily.'],notes:'? What is the problem between Jake and Ryan? (Jake is upset that Ryan has told other people that he likes Lily)\n? Why do you think Ryan told Jake\'s secret? (He is trying to help him)\n? Do you think Ryan meant to upset Jake? (No, he thinks he\'s doing him a favor)\n? Do you think Jake believes that Ryan embarrassed him on purpose? (Maybe, but it\'s not clear)\n? How might Ryan feel in this situation? (upset, like he has let his friend down)\n? How might this situation affect the trust in their friendship? (Jake may not trust Ryan anymore)'},
 {t:'questions',kicker:'Brainstorm',title:'What can be done to fix this friendship?',qs:['What can Ryan do to make it better with Jake?','For each idea: Is it fair? How will people feel?'],answers:['Apologize.','State intentions.'],notes:'Ryan knows he made a mistake and really embarrassed his friend. Let\'s brainstorm a list of things Ryan can do to make it better with Jake.\nAccept silly or disrespectful ideas during the brainstorm process; you can also add your own ideas to the list. Remember some items from this list to recall later.\nLet\'s evaluate each idea by asking "is it fair? how will people feel?"\nThe best answer is for Ryan to apologize and state his intentions.'},
 {t:'activity',kicker:'Role play · Part 2',title:'Ryan tries to work it out',items:['Watch how Ryan tries to work things out with Jake.','Did Ryan try any of the ideas we brainstormed?'],roles:['Jake','Ryan','Volunteer 3'],notes:'Jake and Ryan, get back up here. We are now going to see how Ryan attempts to work things out with Jake.\nHand out page 2 of the script.\nLet\'s think about some of the things we brainstormed earlier. Did Ryan try any of the ideas we discussed?'},
 {t:'questions',kicker:'Discussion',title:'Forgiving lets you move on.',qs:['Why does Ryan try so many different ideas?','Why is it important for Ryan to say he is sorry?','How does Jake learn that Ryan didn’t intend to embarrass him?','What clues let you know that Jake forgives Ryan?','Why is forgiving others an important part of solving problems in a friendship?'],answers:['Forgiving lets you move on. If you don’t forgive, your relationship won’t be able to grow.'],notes:'? Why does Ryan try so many different ideas? (When he sees that something might not be working, he switches to something else.)\n? Why is it important for Ryan to say he is sorry? (It lets Jake know that he feels bad about what happened. It shows that he wants to work it out.)\n? How does Jake learn that Ryan didn\'t intend to embarrass him? (They talk it out and Ryan tells him he didn\'t mean to tell and was trying to help.)\n? What clues let you know that Jake forgives Ryan? (He believes that Ryan is sorry. He says it\'s okay and asks to hang out after.)\n? Why is forgiving others an important part of solving problems in a friendship? (Forgiving lets you move on. If you don\'t forgive, your friendship won\'t be able to grow.)'},
 {t:'steps',kicker:'Working out conflicts',title:'4 steps',steps:[['Step 1','Respectfully ask what’s wrong'],['Step 2','Listen carefully and think about your friend’s point of view'],['Step 3','Figure out what to do to make it better'],['Step 4','Ask yourself “Is it working?” If it’s not, try something else']],notes:'Like we talked about last week, not all friendships are perfect and that\'s okay. Here are some steps you can take when trying to work out a conflict with a friend.\nStep 1. ? What are some different ways to respectfully ask someone what\'s wrong?\nStep 2. ? What could you do to let your friend know that you are listening carefully?\nStep 3. ? How would you come up with ideas for making it better?\nStep 4. ? What clues would you use to help you know whether a strategy is working?'},
 {t:'questions',kicker:'Apologies',title:'Is it easier to forgive someone who apologizes sincerely?',qs:['Is it easier to forgive someone who apologizes sincerely? Why?'],answers:['An apology tells you that the person has good intentions.','It tells you the person will be more careful and won’t make the same mistake again.','It shows that the person cares about how you feel.'],notes:'Read through.\nPossible answers: Usually it is easier to forgive someone who apologizes sincerely. An apology tells you that the person has good intentions. It tells you that the person will be more careful and won\'t make the same mistake again. It shows that the person cares about how you feel.'},
 {t:'activity',kicker:'Activity · Scenarios',title:'New topics to think about',items:['Managing conflicts fairly and respectfully','Making it better with a friend','Write something you have done, or a good idea for something you could do.'],minutes:5,notes:'Read through/summarize.'},
 {t:'activity',kicker:'Role play',title:'Solve it respectfully',items:['Act out the scenario and see if you can solve the problem respectfully.'],roles:['Partner A','Partner B'],minutes:3,notes:'Pairs practice. If there is time at the end, have students share their "respectful statements".'},
 {t:'end',notes:'Any questions? Thank the class.'}]},

4:{n:4,title:'Conflict and bullying',scenes:[
 {t:'title',notes:'Introduce yourself, the NJ4S program, and the purpose of today\'s program.'},
 {t:'map',notes:MAPNOTE(4)},
 {t:'compare',kicker:'What is respect vs. disrespect?',title:'Respect vs. disrespect',cols:[['Respect',['A positive feeling or action that shows high regard for someone or something','The golden rule: treat others the way you want to be treated.']],['Disrespect',['The lack of showing respect for someone or something','Treating someone in an insulting, rude, or impolite way']]],foot:'Respect for: self · others · objects · places',notes:'Respect: a positive feeling or action that shows high regard for someone or something (high regard is like you think highly of someone or something): value their feelings or point of view, accept them as an equal, be patient, allow space, admit mistakes. Treat others the way you want to be treated. Treat others fairly.\nDisrespect: the lack of showing respect for someone or something; treating someone in an insulting, rude, or impolite way.\n? What is a way you can show us respect today?\n? What is a way you can show respect to your school building?'},
 {t:'list',kicker:'Cultural respect',title:'Culture is the beliefs, values, and behaviors that a group of people share.',chips:true,items:['Clothes','Manners','Religion','Celebrations','Folk art','Food','Language','Child-rearing','Gender roles'],notes:'When talking about respecting someone, something that\'s important to keep in mind is cultural respect.\nCulture is the beliefs, values, and behaviors that a group of people share. This group could be from the same country, or believe in the same religion, etc. It could also be smaller groups like the culture of your soccer team.\n? Does anyone know a way people can show their culture? (Press → for each one.)\nManners: we view direct eye contact as respectful; some cultures view it as disrespectful. Food: Mexican, Indian, Chinese, Greek, Italian food, etc. Celebrations: Christmas, Lunar New Year, Hanukkah, Día de los Muertos, Kwanzaa, etc.\n? Is there an aspect of your culture that you enjoy most?\nNext year, when you go into high school, you will be meeting a whole bunch of new students. It\'s important to be respectful of their cultures to make your new school a positive community.'},
 {t:'def',kicker:'School culture',word:'school culture',prompt:'Does a school have a culture?',def:'Culture is the beliefs, values, and behaviors that a group of people share, including people from a specific school.',extras:['Dress code, celebrations and events, ways of interacting with teachers, and rules all make up a school’s culture.'],notes:'A culture could be a group of people from a particular country, or a group of people who follow a particular religion. But it could also be a group of people who go to a particular school. Your school has its own culture: a certain way of doing things. Your high school will have its own culture too.\nSo not only is it important to be respectful of each person\'s culture, but also it\'s important to respect the culture of the school you belong to.'},
 {t:'compare',kicker:'Joking, teasing, conflict, bullying',title:'What’s the difference?',cols:[['Joking',['Intent: to be funny or light-hearted','Tone: playful','Key: everyone is laughing, even the person the joke is about','Goes wrong when: it’s one-sided or hits a sore spot']],['Teasing',['Intent: to be playful or slightly annoying','Tone: light or potentially sarcastic','Key: harmless when balanced between people in a strong relationship','Goes wrong when: it’s constant or targets insecurities']],['Conflict',['Intent: to express disagreement or resolve a problem','Tone: can be emotional, tense, or serious','Key: opposing views; doesn’t have to be mean-spirited','Goes wrong when: it’s not respectful, or turns into yelling and blaming']],['Bullying',['Intent: to hurt, control, or belittle someone','Tone: aggressive, mocking, or cruel','Key: a power imbalance; often repetitive and unwanted','Never okay']]],notes:'These terms overlap but have important differences, especially when it comes to intent and how the other person feels.\nJoking example: "Wow, you finally made it on time. Did the world stop spinning?"\nTeasing example: "Oh look, the grammar police are here!" (to a friend who corrects you a lot)\nConflict example: "I feel like you never listen to me when I talk about ____."\nBullying example: repeatedly calling someone names or excluding them on purpose.'},
 {t:'compare',kicker:'Conflict vs. bullying',title:'What is the difference?',cols:[['Conflict',['A disagreement or argument where both sides express their opinions','Equal power between those involved']],['Bullying',['When someone (or a group) repeatedly hurts, threatens, or leaves someone out on purpose','Is one-sided: the person bullying has more power']]],notes:'Conflict: a disagreement or argument where both sides express their opinions. Equal power among those involved; both people are upset with the situation. People generally stop and change behavior when they realize it\'s hurting someone. Conflict is a normal part of everyday life.\nBullying: when someone (or a group) repeatedly hurts, threatens, or leaves someone out on purpose. The person bullying has more power and the target has a difficult time defending themselves. The bully continues when they realize it\'s hurting someone. Only the target is upset; the bully usually feels no regret.'},
 {t:'list',kicker:'Power imbalance',title:'Bullying is repeated, intentional harm by someone with more power.',chips:true,items:['Money','Social status','Age','Gender','Material things','Physical size','Mental','Emotional','Anonymity online','& more!'],notes:'Bullying is when a person is exposed to repeated intentional harm at the hands of one or more individuals who have more power than the person being victimized. This is called a power imbalance.\nLots of people think you have to be forceful or manipulative to gain power. However, research shows that having high levels of social intelligence is more important for gaining power over others.\nWays people have more power: money, social status (more popular), age (older), material things, physical size, mentally (sees themselves as superior), emotionally (manipulation of feelings), anonymity online.'},
 {t:'video',kicker:'Video clip',title:'Power imbalance',url:'https://youtu.be/bgOpn-oJEe4',text:'Watch until 1:13. What kinds of power do you see?',notes:'Watch until 1:13.\n? What kinds of power does the bigger character have? (physical: larger/taller; mental: feels superior/smarter/more talented)'},
 {t:'compare',kicker:'Recognizing bullying',title:'4 kinds of bullying',cols:[['Physical',['Hitting','Poking','Pinching','Shoving or pushing','Spitting','Damaging property','Gestures']],['Verbal',['Name calling','Making fun of','Jokes at another’s expense','Unwelcome teasing','Spreading secrets','Threatening someone']],['Social',['Spreading rumors','Gossiping','Excluding someone','Setting someone up to look foolish']],['Cyberbullying',['Sharing someone’s private information','Using texting or other apps to damage someone’s reputation','Using social media to intimidate or exclude someone']]],notes:'Read through each kind of bullying.'},
 {t:'video',kicker:'Video clip',title:'Recognizing bullying',url:'https://youtu.be/qM_vpZLGSTI?feature=shared&t=253',text:'Starts at 4:14. Which bullying behaviors do you see?',notes:'Watch from 4:14.\n? Which of these behaviors did you see? (setting someone up to look foolish)'},
 {t:'game',kicker:'Game',title:'Is it bullying or a conflict?',choices:['Bullying','Conflict'],rules:['Team 1 and Team 2','1 volunteer up front for each team','Listen to the scenario: is it bullying or conflict?','Show your answer on your card after the scenario is read','1 pt for correct answer, 2 pts for answering first','Switch volunteers for each question'],rounds:[['You arrive at the movie theater with your friend. They want to see an action movie, but you want to see a comedy. You can’t agree on which movie to watch and start arguing in the lobby of the theater.','Conflict'],['You invite your friend to go to IHOP with you on Sunday morning. They say they can’t go, because they are going to church with their family. You say “Okay whatever, Jesus-lover,” in a snotty tone. “At least I’m not a sinner like you,” they say back. Now you’re not speaking to each other.','Conflict'],['You run into an 8th grader you recognize at the store after school. She doesn’t have enough money to buy the snacks she wants. She demands you give her your money and says, “If you tell anyone about this, you’ll regret it.”','Bullying'],['You’re sitting with your friends at lunch and notice the new kid who was in your science class that morning. They just moved to the United States from another country. You wave and smile at them to be friendly. Your friend leans over and says, “Don’t let that new kid sit at our table with us! Their gross lunch will probably stink up the whole table!” Your other friends laugh.','Bullying'],['You hear your best friend told another friend your secret. To get back at them, you reveal one of their secrets. It escalates to the point that the two of you are spreading rumors about each other within your friend group.','Conflict'],['Every day this week your friend has received a message from an unknown number that says, “You’re a big fat slob. Everyone hates you.”','Bullying'],['A classmate in your English class is constantly humming and singing to themselves during independent work time. You’re trying to do your assigned reading and it really annoys you. You’ve reached your breaking point and shout out “OMG STOP! You’re so annoying!”','Conflict']],notes:'Play in two teams. Press → to read each scenario, then → again to reveal the answer. Use the + buttons to keep score (1 pt for correct, 2 pts for answering first).'},
 {t:'compare',kicker:'Upstander and bystander',title:'Which one will you be?',cols:[['Bystander',['Anyone who knows that bullying is happening']],['Upstander',['A person who speaks or acts in support of someone, especially someone being attacked or bullied']]],notes:'Bystander = standing by and letting bullying continue.\nUpstander = standing up to put a stop to bullying.'},
 {t:'compare',kicker:'What should I do?',title:'Refuse · Support · Report',cols:[['Refusing',['Ask: “Is it safe for me to speak out assertively?”','If it is safe, say “Stop saying/doing that.”','Walk away calmly']],['Support',['Find someone to support and listen','Be someone else’s support system','Go to a trusted adult']],['Reporting',['When you or someone else is in danger','When there is unwanted physical contact','When there is verbal/written harassment']],['4 W’s of reporting',['Who was involved?','What happened?','When did the bullying occur?','Where did the bullying occur?']]],notes:'What should I do if I am being bullied, or if I witness bullying? Be an upstander! Intervene on behalf of the person being bullied by providing support or reporting to a trusted adult.\nThere are many things you can do to stand up to bullying. First you have to decide if it is safe to do so.\nWhen you refuse bullying, you are rejecting the bullying behavior. Sometimes the bullying continues even if you walk away, and that\'s when you may need support or should report the bullying.'},
 {t:'end',notes:'Questions? Thank the class.'}]},

5:{n:5,title:'Cultural diversity',scenes:[
 {t:'title',notes:'Introduce yourself.'},
 {t:'map',notes:MAPNOTE(5)},
 {t:'objectives',title:'Cultural diversity',items:['Learn how important it is to respect each other and appreciate different cultures'],notes:'By the end of this workshop, you will learn how important it is to respect each other and appreciate different cultures.'},
 {t:'def',kicker:'What is respect?',word:'respect',prompt:'What is respect?',def:'Respect is the way we value the rights, feelings and experiences of others. It can also apply to things and the way we treat our environment.',notes:'Read through.'},
 {t:'def',kicker:'What is culture?',word:'culture',prompt:'What does culture mean to you?',def:'Culture is the way people live. It includes the things that make a group of people unique and special.',notes:'? What does culture mean to you? (wait for responses, then press →)'},
 {t:'list',kicker:'Important to know',title:'Culture facts',items:['Everyone has a culture','You can belong to more than one culture','No culture is better than another. Just different.'],notes:'Read through each point.'},
 {t:'def',kicker:'Word of the day',word:'cultural respect',prompt:'What is cultural respect?',def:'Being kind and respectful to people who may live, dress, speak, or believe differently than you. It means understanding that not everyone is the same, and that’s okay.',notes:'Read through.'},
 {t:'compare',kicker:'Cultural respect',title:'What it looks like, and what it’s not',cols:[['Looks like',['Listening when someone talks about their culture','Being polite about traditions that are different from yours','Using people’s names the right way','Not making fun of how someone looks, talks, or celebrates']],['Is not',['Making jokes about someone’s culture','Saying one culture is better than another','Leaving people out because they are different']]],notes:'Read through both lists.'},
 {t:'list',kicker:'Why cultural respect is important',title:'It matters because…',items:['It helps everyone feel safe and included','It helps people get along better','It makes schools and communities fair and friendly'],notes:'Read through.'},
 {t:'questions',kicker:'Let’s talk',title:'Share with the class',qs:['Where are you or your family from?','What is something you like about your culture?'],notes:'Invite a few students to share.'},
 {t:'standup',title:'“If you… stand up!”',rules:['I will read a sentence. If it is true for you, quietly stand up. If not, stay seated.','No talking, laughing, or pointing.','You don’t have to explain why you stood.','Everyone’s experience matters.'],sit:'Thank you, please sit.',prompts:['If you eat a food at home that not everyone eats, stand up.','If your family has a special meal for holidays or celebrations, stand up.','If you celebrate a holiday that is important to your family, stand up.','If more than one language is spoken in your home, stand up.','If you know words in another language, stand up.','If your family has traditions you do every year, stand up.','If you learned something important from an older family member, stand up.','If your family celebrates birthdays or events in a special way, stand up.','If you’ve learned something from someone who is different from you, stand up.','If you like learning about how other people live, stand up.','If you think it’s important to respect people’s differences, stand up.'],notes:'Cultural awareness game. Read the rules, then press → for each sentence. Say "Thank you, please sit" after each.'},
 {t:'questions',kicker:'Let’s reflect',title:'What did you notice?',qs:['What did you notice?','Were we all standing at the same time?','What does this tell us about our class?'],answers:['Even though we’re in the same classroom, we all have different cultures and experiences. Cultural respect means being kind and open to those differences.'],notes:'Discuss each question, then press → for the takeaway.'},
 {t:'statement',kicker:'Up next',text:'When we stood up, we noticed that we weren’t all the same… but we also weren’t alone.',sub:'Now we’re going to move into an activity that helps us see how much we actually have in common.',notes:'Read through.'},
 {t:'activity',kicker:'Activity',title:'Same but different BINGO',items:['Ask classmates questions politely','Listen carefully','You cannot use the same person twice','We walk, not run'],minutes:10,notes:'Before we start, remember: ask classmates questions politely, listen carefully, you cannot use the same person twice, we walk, not run.\nThe original slide also links two YouTube videos you can play as background: https://youtu.be/ZMsvwwp6S7Q and https://www.youtube.com/watch?v=6k8cpUkKK4c'},
 {t:'questions',kicker:'Let’s reflect',title:'What do we share?',qs:['What similarities did you notice?','Did everyone’s culture look exactly the same?','What does this teach us about respecting others?'],answers:['Even though our cultures may look different, we share many things in common. That’s why cultural respect is important.'],notes:'Discuss each question, then press → for the takeaway.'},
 {t:'list',kicker:'Our world, together',title:'Let’s celebrate our differences and what we share!',items:['When we share our cultures, we make new friends.','Learning about others helps us grow.','Try a new food, learn a new word, or listen to new music.','Share what you love about your culture with a friend!'],notes:'Read through.'},
 {t:'end',notes:'Any questions? Thank the class.'}]},

6:{n:6,title:'Refusing and reporting',scenes:[
 {t:'title',notes:'Introduce yourself.'},
 {t:'map',notes:MAPNOTE(6)},
 {t:'objectives',title:'Reporting and refusing',items:['Evaluate situations and determine a safe response','Apply assertiveness skills','Apply emotion-management techniques','Apply bullying-reporting skills'],notes:'Read through objectives.'},
 {t:'list',kicker:'Review',title:'Recognizing bullying',items:['Is it fair?','Is it one-sided?','Is someone using power in a hurtful way?','How does it feel?'],notes:'Let\'s take a moment to review how we can recognize bullying.\nFirst, ask yourself, "Is it fair?" This helps us assess whether everyone is on equal footing or if there\'s an imbalance.\nNext, consider if the situation is one-sided. If one person is consistently dominating or harming another unfairly, that\'s a key indicator of bullying.\nFinally, think about power. Is someone using their power in a hurtful way? This could be through physical strength, social status, or verbal aggression.\nBy recognizing these signs, we empower ourselves and others to take action.'},
 {t:'def',kicker:'Refuse',word:'refuse',prompt:'What does it mean to refuse bullying?',def:'When you refuse bullying, you are rejecting, or saying no to, bullying.',notes:'Refusing bullying is an important skill that we all need to practice. It means that you are rejecting or saying no to bullying behavior.\nWhen we refuse bullying, we are taking a stand against harmful behavior and showing that it won\'t be tolerated. It\'s about setting boundaries and protecting ourselves and others.\nIt might not always stop the behavior immediately, but it sets the stage for taking further action, like reporting.'},
 {t:'list',kicker:'Report',title:'Report bullying to an adult immediately when:',items:['You or someone else is in danger','Refusing the bullying doesn’t work'],notes:'? When should you report bullying?\nFirst, report bullying to an adult right away if you or someone else is in danger. Acting quickly can help prevent harm.\nSecond, if refusing the bullying doesn\'t work, it\'s important to report it. Seeking help shows strength and responsibility.\nReporting isn\'t about getting someone in trouble; it\'s about ensuring a safe environment for everyone. Adults are there to help.\nToday\'s lesson is about how to decide when it is safe to refuse bullying by speaking out.'},
 {t:'story',kicker:'Scenario',title:'Carlos and Jody',place:'hall',cast:[['Carlos','#7CF56B'],['Jody','#FF5C8A']],lines:[['','Carlos and his family recently moved to the US from Ecuador. Sometimes Jody and her friends tease Carlos about his accent. Carlos tries to ignore it.'],['','Today Carlos is wearing new glasses.'],['Jody','Hey four-eyes! Do you think glasses are going to make you smart or something? You still sound stupid when you talk.']],notes:'Read the scenario.'},
 {t:'questions',kicker:'Discussion',title:'Think about how Jody was talking to Carlos',qs:['Is it fair?','How would you feel?','Do you think this is bullying?','What should he do?'],notes:'? Is Jody\'s behavior fair? Why not? (No, it\'s wrong to tease Carlos about his culture or the way he talks. These are differences we value and can learn from. It is also not fair to tease Carlos about his glasses.)\n? How would you feel if you were Carlos? (uncomfortable, sad, bad, excluded, disliked, lonely, embarrassed)\n? Do you think Jody is bullying Carlos? Why? (Yes. Jody keeps teasing Carlos, and it makes him uncomfortable.)\n? What should Carlos do? (Ignore it. Report Jody to the teacher. Stand up to Jody and tell her to stop.)'},
 {t:'questions',kicker:'Brainstorm',title:'What should you do?',qs:['What are some things that should be considered as you make a decision?'],answers:['Is it safe for me to refuse?'],notes:'When Carlos recognizes that Jody is bullying him, he must determine whether it is safe to refuse the bullying by speaking out. Let\'s brainstorm a list of things Carlos should consider as he makes that decision. (Answer: Is it safe for me to refuse?)'},
 {t:'list',kicker:'When is it safe to refuse?',title:'Things to consider',items:['Is the person bigger or older?','Are there multiple people?','Is no adult nearby?','Do I feel trapped?','Do I have friends or allies around?'],foot:'If it’s not safe, do NOT refuse. Go straight to reporting.',notes:'Read through.\nRemember that anytime you don\'t feel safe, you should get an adult\'s help. Also remember that what may feel safe for one person might not feel safe for another.\n? Who are some adults that you can trust to speak to about bullying?\n(The original deck repeats this list later, under "When it may be unsafe". It now appears once, here.)'},
 {t:'steps',kicker:'Steps to refuse bullying',title:'The 4 steps',steps:[['Check your feelings',''],['Stay or get calm','Take 3 deep breaths. Say a calming phrase: “Slow down,” “Keep calm.”'],['Use assertive behaviors','Stand tall. Look at the person. Strong, clear voice. Words that mean “Stop.” Label the behavior (“That’s bullying.”)'],['Walk away calmly','']],notes:'Briefly show. Break down each step in the following screens, but you can skim (focus more on the assertiveness screens).'},
 {t:'def',kicker:'Step 1',word:'check your feelings',prompt:'How might you feel if you get bullied?',def:'It’s normal to feel scared, hurt, angry, or upset.',extras:['But sometimes it’s better not to show your emotions to the bully. Why?'],notes:'? How might you feel if you get bullied? (press → after responses)\nDon\'t let emotions take control of your behaviors, because sometimes it\'s better not to show your emotions to the person doing the bullying.\n? Why might this be? If someone is bullying and sees you\'re frightened or angry, they may use your feelings to control you.\n? How do people act when they lose control of their emotions? (people may cry, yell or get mad)\n? Why do some people like to see others lose control? (They think it\'s funny. Some people feel more powerful when others lose control.)'},
 {t:'breathe',kicker:'Step 2: Stay calm or get calm',title:'Let’s practice together!',words:['Slow down','Keep calm'],notes:'Practice the calming techniques together. Afterward ask: How does your body feel now compared to before?\nYou should know that bullying might continue even if the person being bullied is calm. In the long run, though, remaining calm will discourage some bullying and help you make good decisions when you are bullied.'},
 {t:'compare',kicker:'Step 3',title:'Assertive vs. aggressive',cols:[['Assertive',['Clear','Respectful','Confident','Strong voice']],['Aggressive',['Mean','Hurtful','Yelling','Rude']]],foot:'Being assertive is powerful because it shows confidence without being disrespectful.',notes:'Step 3 is "use assertive behaviors."\nAssertive behavior is not the same as aggressive behavior. Being assertive means expressing yourself in a strong clear way while still being respectful. When you are assertive you are in control. When you are aggressive, you are not respectful and can act in ways that are mean or hurtful to others.'},
 {t:'list',kicker:'Step 3: Use assertive behaviors',title:'Assertive body language',items:['Standing or sitting tall','Holding your head up','Keeping eye contact','Using a strong and clear tone','Using words that mean “stop”','Labeling the behavior'],notes:'Assertive body language can help reinforce the meaning of your words.\nLet\'s practice sitting tall right now and holding your head high. ? How does that show assertiveness? (it shows that you are confident and serious)\n? What else could you say that means "stop"? (quit it, knock it off, don\'t do that)\n? What are some ways to describe bullying behavior? (that\'s bullying, that\'s wrong, that\'s mean)'},
 {t:'list',kicker:'When to report bullying',title:'Report immediately when:',items:['It is not safe to refuse','Someone is in danger','Someone is doing something inappropriate','Your refusing did not work'],foot:'Even if you refuse safely, report later. You are never tattling when you are trying to keep someone safe.',notes:'Now we are going to talk about how to report bullying. Read through.\nRemember that even if you decide it\'s safe to refuse by speaking out, you should try to report it to an adult later. Make sure to tell the adult that you refused the bullying and how it worked.'},
 {t:'steps',kicker:'Four Ws of reporting',title:'Adults need four details',steps:[['Who','was involved?'],['What','happened?'],['When','did it happen?'],['Where','did it happen?']],foot:'These help adults understand the situation so they can stop the bullying.',notes:'Read through.'},
 {t:'questions',kicker:'Let’s practice reporting',title:'Report it with the 4 Ws',scenario:'Jeremy and Paul tell Ronny, “If you don’t give us the homework, you’re going to have to watch your back,” at recess, and laugh while holding scissors.',qs:['Who?','What?','When?','Where?'],notes:'Have students practice the report using who, what, when, where.'},
 {t:'questions',kicker:'Let’s practice an unsafe situation',title:'What do you do?',scenario:'Walking home, three older students jump out and demand money.',qs:['Is it safe to refuse?','What should you do?'],answers:['No, it is not safe to refuse.','Stay calm','Go along until escape is possible','Make an excuse','Call for help if others are around','Ask an observer to get help','Report ASAP'],notes:'? Is it safe to refuse? (No)\n? What should you do? Stay calm, go along until escape is possible, make an excuse, call for help if others are around, ask an observer to get help, report ASAP.'},
 {t:'game',kicker:'Game time',title:'Refuse or report? Relay',choices:['Refuse','Report'],rules:['We will play in teams','I will read a bullying scenario','Teams hold up a card: red “Refuse” or blue “Report”','Correct answer earns 1 point'],rounds:[['Two classmates block the bathroom door every time you try to go in.',null],['A classmate whispers mean things about you when the teacher isn’t looking.',null],['Two students threaten to cut a classmate’s clothes with scissors at recess.',null],['A classmate keeps calling you a mean name every time you walk by.',null],['Someone pokes you every day when you walk by, and today they hit you instead.',null],['During soccer practice, two teammates elbow you on purpose and call you “slowpoke.”',null],['A student tries to write on your arm with markers.',null],['A student tells you they won’t be your friend anymore if you hang out with someone else.',null],['Three older students jump out from behind a bush and demand your money.',null]],notes:'Materials: blue and red cardstock for each team. Press → for each scenario, then → again for the discussion prompt.\nThe original deck lists these scenarios without an answer key, so the reveal asks the class to check: Is it safe to refuse? Is anyone in danger? Did refusing already fail? Score the answers you decide are correct with the + buttons.'},
 {t:'activity',kicker:'Game time',title:'Assertive or not?',items:['I will read some phrases.','Move to the ASSERTIVE or NOT ASSERTIVE side of the room.'],notes:'Read phrases aloud and have students move to the assertive or not assertive side of the room. (The original deck doesn\'t include the phrase list.)'},
 {t:'end',notes:'Thank the class.'}]},

7:{n:7,title:'Bystanders can help',scenes:[
 {t:'title',notes:'Introduce yourself.'},
 {t:'map',notes:"Last week, we talked about refusing and reporting.\n? Can anyone tell me something they remember about last week's lesson? (wait for responses)\nAs you can see, this week we will dive into the role of bystanders and how we can help mitigate conflicts and bullying."},
 {t:'objectives',title:'Bystanders can help',items:['Define bystander','Understand bystanders’ responsibility to help stop bullying','Recognize feelings that indicate discomfort with a situation','Evaluate the safety of a bullying situation from a bystander’s perspective','Identify ways to help people who have been bullied'],notes:'Today, we\'re diving into the important role of bystanders in situations involving bullying.\nBy the end of our lesson, you will have a clear understanding of what a bystander is, and the critical responsibility bystanders have in helping to stop bullying.\nWe\'ll explore the feelings and signals that may indicate discomfort when observing a bullying situation, evaluate how safe a situation is from a bystander\'s perspective, and discuss practical ways bystanders can help.'},
 {t:'def',kicker:'What is a bystander?',word:'bystander',prompt:'Who is a bystander?',def:'Anyone who knows bullying is happening (not just someone physically present). Bystanders can choose to help stop bullying.',extras:['Why their role matters: it makes bullying harder to succeed','It shows the target they’re not alone','It sends a message that bullying isn’t acceptable'],notes:'A bystander isn\'t just someone physically present during a bullying incident. A bystander is anyone who is aware that bullying is happening.\nWhy does the role of the bystander matter? First, when bystanders intervene, they make it significantly harder for bullying to succeed. Second, bystanders show the target that they\'re not alone. Finally, the actions of bystanders send a powerful message that bullying is unacceptable in our community.'},
 {t:'compare',kicker:'Recognizing feelings and body signals',title:'When you witness bullying',cols:[['Feelings',['Sad','Angry','Scared','Uncomfortable']],['Body signs',['Stomachache','Nervousness','Tense or shaky feelings']]],foot:'How do you feel when you see something wrong and do nothing? How do you feel when you do something to help?',notes:'When we witness bullying, our bodies often give us signals that something is wrong. Common feelings include sadness, anger, fear, and discomfort. These emotions are your mind\'s way of telling you that the situation is not okay.\nOur bodies give us physical signals too: a stomachache, nervousness, tense or shaky muscles.\nConsider how different it feels when you decide to do something to help. Taking action can transform those uneasy feelings into relief and empowerment.\nRecognizing these feelings and body signals is the first step in deciding how to respond as a bystander.'},
 {t:'story',kicker:'Scenario 1',title:'Diego and Adrian',place:'hall',cast:[['Diego','#3AE0FF'],['Adrian','#FFD23F']],lines:[['','Diego sees boys teasing Adrian. Adrian is from another class.'],['','Diego has seen the boys being mean to Adrian before. They are taking his coat, laughing at him, and calling him a crybaby.'],['','Diego sees that Adrian is upset.']],qs:['What is the problem?','Is this fair?','How do you think Adrian feels?','How does Diego know this is wrong?','How can Diego decide if it is safe to speak out?','What should Diego do?'],take:'Bullying is unfair and disrespectful. It’s everyone’s responsibility to keep people safe.',notes:'Read the scenario, then discuss each question.'},
 {t:'compare',kicker:'Ways bystanders can support',title:'Support · Evaluate · Act',cols:[['Support',['Talk privately with the person who was bullied','Be a “big brother/sister” figure','Encourage other bystanders to take action','Show kindness and presence']],['Evaluate',['Is it safe?','Is it fair?','How will the bullied person feel?']],['Take action',['Speak out assertively','Report to an adult','What are some possible things you can say?']]],notes:'One of the simplest yet impactful ways is to talk privately with the person who was bullied. This shows them they are not alone.\nAnother approach is to become a "big brother" or "big sister" figure: ongoing support and a positive role model.\nEncouraging other bystanders to take action can amplify the impact. Showing kindness and being present can be incredibly powerful.\nBefore taking action, evaluate: Is it safe? Is it fair? How will the bullied person feel?\nAction can take many forms, such as speaking out assertively or reporting the incident to an adult.\n? What might you say to help? Practice phrases that assertively express support and disapproval of bullying.'},
 {t:'story',kicker:'Scenario 2',title:'Sophie, Felicia, and Angela',mode:'chat',place:'hall',cast:[['Sophie','#FF5C8A'],['Felicia','#FFD23F'],['Angela','#7CF56B']],lines:[['','Angela, Sophie, and Felicia have been friends since kindergarten.'],['','Sophie doesn’t like another girl in their class. Now she is trying to talk Felicia and Angela into spreading rumors about her.'],['','Sophie wants to post something mean on Snapchat/Instagram about the girl.'],['','Felicia seems to be okay with it. Angela feels uncomfortable.']],qs:['What is the problem?','Is this fair?','How do you think Angela feels?','How does Angela know this is wrong?','How can Angela decide if it is safe to speak out?','What should Angela do?'],take:'Bystanders must still act, even with friends.',notes:'It can be harder to refuse bullying when the person is a friend. Doing nothing allows bullying to continue.\n? What would happen if Angela didn\'t do anything?'},
 {t:'activity',kicker:'Tips for assertive speaking',title:'Role play',items:['Stand tall','Make eye contact','Speak calmly, firmly, respectfully'],roles:['The bully','The person being bullied','The bystander'],notes:'Three volunteers: one plays the bully, one the person being bullied, and one the bystander.\nStand tall: your posture can communicate confidence without being aggressive.\nMake eye contact: it shows you\'re sincere and focused.\nSpeak calmly, firmly, and respectfully: calm keeps it from escalating, firmness shows confidence, and respect keeps it positive.'},
 {t:'list',kicker:'Directions',title:'Group role plays',items:['Read your scenario.','Choose roles.','Discuss what the bystander feels and whether it’s safe to speak up.','Choose one helpful action: speak up assertively, get adult help, or support the student afterward.','Practice a 20–30 second scene.','Perform for the class.'],foot:'Safety and respect: no one may act out physical aggression. Keep language respectful; no slurs. Focus on assertiveness, safety checks, empathy, and reporting.',notes:'Read through/summarize.'},
 {t:'scenarios',kicker:'Scenarios',title:'Pick a scenario',cards:[['Lunchroom teasing','A student sits down at lunch with a homemade meal. The bully starts making fun of the food and saying it smells weird. The student looks embarrassed while other students watch. The bystander has to decide whether to speak up, ignore it, or change the situation.'],['Group project exclusion','During a group project, the bully tells another student they are “too dumb” to help and says they should just sit quietly. The student being bullied wants to participate but feels discouraged. The bystander notices what’s happening while the group is deciding who does each task.'],['Hallway name-calling','Between classes, the bully repeatedly calls another student a nickname they don’t like. The student being bullied asks them to stop, but the bully keeps going. The bystander hears the comments and sees the student getting upset.'],['Sports practice','At practice, the bully laughs when another player misses a shot and tells them they shouldn’t even be on the team. The student being bullied starts losing confidence. The bystander is a teammate who hears the comments.'],['Online group chat','In a class group chat, the bully sends messages making fun of a student’s picture and encourages others to laugh. The student being bullied sees the messages and feels hurt. The bystander is in the chat and decides whether to respond or stay silent.'],['Bus ride home','On the school bus, the bully keeps poking fun at another student’s clothes and telling others to move away from them. The student being bullied sits quietly and looks uncomfortable. The bystander sits nearby and hears everything.'],['Class presentation','A student is giving a presentation and makes a small mistake. The bully loudly whispers jokes and laughs to distract others. The student being bullied becomes nervous while presenting. The bystander notices the behavior and must decide what to do.'],['Locker room rumor','In the locker room after gym class, the bully starts spreading a rumor about another student and tells others not to trust them. The student being bullied hears the rumor and looks upset and confused. The bystander overhears the conversation and must decide whether to ignore it, tell the bully to stop, or support the student being talked about.']],notes:'Assign each group a scenario. Click a card to show it full size.'},
 {t:'list',kicker:'Key takeaways',title:'Bystanders can help',items:['Bystanders have real power to reduce bullying','Take action: refusing or reporting is part of the solution','Safety first: assess before stepping in','Support the person who was bullied'],notes:'Read through.'},
 {t:'end',notes:'Any questions? Thank the class.'}]},

8:{n:8,title:'Taking responsibility',scenes:[
 {t:'title',notes:'Introduce yourself.'},
 {t:'map',notes:"Last week, we talked about bystanders and what we could do to help if we ever get involved in bullying.\n? Can anyone tell me something they remember about last week's lesson? (wait for responses)\nAs you can see, this week we will dive a little deeper into responsibilities and what our roles are in school."},
 {t:'list',kicker:'Last week',title:'Bystanders can help',items:['How to recognize bullying','How to respond safely','Why it matters to speak up'],foot:'Let’s share some examples for each.',notes:'So far, we have talked about recognizing and responding safely to bullying. Last time, we explored how bystanders can be part of the solution.'},
 {t:'list',kicker:'Today’s topic',title:'Taking responsibility',items:['Stopping bullying is everyone’s responsibility','How can we be part of the solution','Setting a good example'],foot:'Remember: “Responsibility” doesn’t mean “getting involved in unsafe ways.”',notes:'Today we are going to talk about what it means when we say that everyone at our school needs to take responsibility for stopping bullying.'},
 {t:'objectives',title:'Taking responsibility',items:['Identify problem behaviors','Identify positive behaviors','Explain how taking responsibility helps stop bullying','Understand how older students influence others','Describe what you can do to help'],notes:'Go over objectives. Today we\'ll learn how our actions help create a safer school and how each of us plays a part.'},
 {t:'statement',kicker:'Mind movie activity',dark:true,text:'Close your eyes and imagine…',sub:'“You’ve moved to a new school where bullying happens a lot… and no one stops it.”',notes:'We are going to do a "mind movie" activity. You will each create a movie in your own mind about what it would be like if nobody did anything to stop bullying.\nClose your eyes and listen carefully as I read. Keep your eyes closed until I tell you to open them.\nImagine this: You have just moved to a new town and are attending a new school. You notice that bullying happens often, both at school and away from adults.\nAdults don\'t help at all. Kids don\'t care, so they don\'t do anything about it either. It\'s as if no one notices that bullying happens all the time.\nIn this town, bullying goes completely unchecked. Nobody does anything to stop it.'},
 {t:'list',kicker:'Mind movie',title:'Visualize…',dark:true,items:['What it’s like living there','How older kids treat younger ones','How kids act when adults aren’t around','How it feels to make friends'],notes:'Play the scene out in your mind and think about these things. Read through, and give students time to process.\nOkay, now you all can open your eyes.'},
 {t:'questions',kicker:'Mind movie reflection',title:'What did you see?',qs:['What was the school like?','How were younger kids treated?','How did YOU feel in your mind movie?','How did bullying affect everyone?'],notes:'Read through and lead discussion.'},
 {t:'activity',kicker:'Note card activity',title:'Two sides, two questions',items:['Side 1: Write 2–3 ways students can be part of the bullying problem.','Side 2: Write 2–3 things that might happen if students don’t take responsibility.','2 minutes per side. No names on cards.'],minutes:2,notes:'First write number 1 in a corner of your card. What are some things people do that are part of the bullying problem instead of part of the solution? Write 2-3 ideas.\nTurn your card over and write 2 in a corner. What might happen if no one takes responsibility for refusing and reporting bullying? Write 2-3 ideas.'},
 {t:'questions',kicker:'Share-out',title:'What did you write?',qs:['What are some things people do that are part of the bullying problem instead of part of the solution?','What might happen if no one takes responsibility for refusing and reporting bullying?'],chips:['Responsibility','Influence','Setting a good example','Safety for all students'],notes:'Lead discussion.\n1) Possible answers: ignore bullying that is happening to someone else; stand and watch; encourage the bully; urge the person being bullied to fight back; laugh or point at the person being bullied; pass on a rumor.\n2) Possible answers: someone could get hurt; someone could get into trouble; bullying will continue and might get worse; the bully may never learn better ways to get along; more students get bullied; someone could run away or drop out; people could be afraid to come to school; the person who bullies may get into trouble later in life; the person who was bullied may have trouble making friends.'},
 {t:'statement',kicker:'Remember',text:'You can make a big difference, even with small actions.',notes:'A place where bullying goes unchecked is probably an unhappy place to live, work, or go to school.\nThat is why it is so important for each of us to be a part of the solution to stop bullying. It\'s up to each of us to do what we can.\nStudents and adults have a responsibility to make our school a safe, respectful, and caring place.'},
 {t:'activity',kicker:'Group activity',title:'Discuss in your groups',items:['Why should everyone take responsibility for stopping bullying?','Why do older students have special responsibility?','What can older students do to decrease bullying?'],minutes:3,notes:'Get into groups. Give each person a chance to suggest ideas, listen and respond respectfully, and stay on the subject. Give students 3 minutes.\nQ1 possible answers: because bullying affects everyone; it\'s a big job; bullying is unfair and creates a climate of fear.\nQ2: younger students look up to older students; they learn from watching older students\' behavior; older students are responsible for setting good examples.\nQ3: older students can show younger students how to respond to bullying safely; protect younger students from bullying; be role models.'},
 {t:'activity',kicker:'Skill practice',title:'Setting a good example',items:['In pairs, practice one positive action from the Good Example cards.','Partner A: act out the positive behavior.','Partner B: respond respectfully.','Positive observers: walk around, look for positive behaviors, and record them on your cards.','When you are done, rotate roles.'],roles:['Partner A','Partner B','Observer'],minutes:3,notes:'Have student pairs act out the good example. Choose one observer to watch and think about what made the behavior respectful and how it helped someone else.'},
 {t:'activity',kicker:'Demonstrations',title:'Volunteers present!',items:['Pairs act out their positive action for the class.','Positive observers share feedback: what made it respectful? How did it help someone else?'],notes:'Have student pairs come up to act out the good example. Observers give positive feedback.'},
 {t:'list',kicker:'Wrap-up',title:'Taking responsibility',items:['Everyone has a responsibility','Older students influence younger ones','Small actions can stop bullying','You can set a good example every day'],foot:'Doing the right thing encourages others to follow.',notes:'Read through.'},
 {t:'end',notes:'Any questions? Thank the class.'}]},

9:{n:9,title:'Making it happen',scenes:[
 {t:'title',notes:'Introduce yourself.'},
 {t:'map',notes:'We have talked a lot about bullying and ways we can work together to stop it. Refusing by speaking out and reporting are two examples.\nWe have also talked about how older students have a unique responsibility to be role models for younger students.\n? Does anyone remember anything else?\nIf time allows, go through and review main points from each lesson.'},
 {t:'memory',kicker:'Icebreaker',title:'Memory game',rules:['You will see different types of memory challenges.','Pay close attention to the given information.','After a few seconds, a question will appear.','Try to answer correctly before the answer is revealed.'],rounds:[{kind:'objects',name:'Observation challenge',secs:5,q:'How many red objects were in the image?',a:'2'},{kind:'words',name:'Word sequence challenge',secs:5,items:['apple','banana','carrot','donut','elephant'],q:'What was the third word in the sequence?',a:'carrot'},{kind:'numbers',name:'Number memory challenge',secs:5,items:['4','7','9','2','1','6'],q:'What were the last two digits?',a:'1 and 6'},{kind:'shapes',name:'Shape memory challenge',secs:10,q:'What was the color of the triangle?',a:'Red'}],notes:'Before we begin we are going to start with this icebreaker.\nFor each challenge: press → to show it (a countdown runs), → again for the question, → again for the answer.\nAnswers: 2 red objects · carrot · 1 and 6 · red.'},
 {t:'objectives',title:'Making it happen',items:['Understand how to set personal goals','Develop a personal goal','Understand how to measure progress toward personal goals','Identify ways to cope with setbacks'],notes:'Go over objectives.\nToday we are going to talk more about how a person can set personal goals that help create the best environment here at school.'},
 {t:'statement',kicker:'Turning ideas into action',text:'Safe, respectful, caring, bully-free.',sub:'Who knows how to describe the school environment we all want to create?',notes:'Read through.'},
 {t:'activity',kicker:'Group activity',title:'Ways to show respect',items:['Group 1: others at recess','Group 2: others in class','Group 3: younger students','Group 4: family members','Be specific: “smile and say hi to people I see” instead of “be nice.”'],minutes:5,notes:'Divide students into groups 1–4 and hand out a poster with the topic for each list.\nAs you list your group\'s topic, try to come up with very specific behaviors instead of general things. For example, instead of "be nice to others" you could write: smile and say hi to people I see; compliment a different person each day; start a conversation with someone.\nGive students 5 minutes.'},
 {t:'compare',kicker:'Share-outs',title:'What did your group come up with?',cols:[['Recess',['Invite others to join','Share equipment','Take turns choosing','Play by the rules']],['Class',['Offer to help','Raise your hand','Listen when others speak','Work with different people']],['Younger students',['Help them learn something new','Invite them to play','Say hi','Share things']],['Family',['Ask before using things','Say kind things','Use a friendly voice','Help with chores']]],foot:'Is each idea stated positively? Is each one stated as a behavior?',notes:'Have each group share, then press → to show example ideas for each.\nRecess: invite others to join group activities, share recess equipment, encourage others, give compliments, take turns deciding what to play, play by the rules.\nClass: offer to help others, raise your hand, ask before using someone else\'s things, listen when others are speaking, compliment someone new, work with different people.\nYounger students: offer to help them learn something new, invite them to play (especially those left out), say hi, share things.\nFamily: ask first before using someone\'s things, say kind things, use a friendly voice, help with problems or chores, share, show interest in others\' activities.'},
 {t:'statement',kicker:'Creating a caring school',text:'Choose a behavior you would like to improve.',sub:'Think about the list of things we came up with. It can be something you do already but want to do more often.',notes:'Read through. Choose a behavior that you would like to improve. It can be something you do already but want to try to do more often.'},
 {t:'def',kicker:'Goal setting',word:'goal',prompt:'What does it mean to set a goal?',def:'You decide on a specific thing that you want to work toward.',extras:['Why do people set goals? People set goals when there is something they want or need to achieve.'],notes:'Read through both questions.'},
 {t:'statement',kicker:'Behavior goals',text:'One of the best ways to achieve a goal is to make a plan and keep track of your progress.',notes:'Deciding on a behavior you want to start using or use more often is setting a goal for yourself.\nOften, we think of goal setting as things related to academic or physical achievements, but starting with our behavior can be just as valuable.\nThat is what we are each going to do now, but first let\'s go over some criteria to help us.'},
 {t:'compare',kicker:'Setting a good goal and planning for success',title:'4 checks for a good goal',cols:[['Meaningful',['Why is this important to me?']],['Measurable',['What needs to happen and when?','How many resources do I need?']],['Realistic',['What resources can I use?','Can it be achieved in a certain amount of time?']],['Manageable',['What is the schedule for the steps?','What is first, second, third?']]],notes:'Read through and expand on each one.'},
 {t:'compare',kicker:'Example',title:'“I want to be nicer to my sibling and help them get better at a sport.”',cols:[['Meaningful',['I only have one sibling and we know each other the best.']],['Measurable',['I can help my sibling with sports by practicing with them once a week.']],['Realistic',['We can play at the field by my house and ask our parents to come with us.']],['Manageable',['First, choose a day we are all free. Next, help my sibling make the team at school.']]],notes:'Read through.'},
 {t:'steps',kicker:'Passport to my future',title:'Imagine yourself in ten years',steps:[['First stop','Draw yourself as you are today.'],['Second stop','What are some goals you want to achieve by the end of the year?'],['Third stop','What kind of person do you want to be in 10 years?'],['Visas','3 personality traits or actions that will help you get there.']],notes:'Go ahead and fill out your plans for yourself. Your goal needs to be a single behavior; keep it specific so it\'s easy to tell when you have done it.\nHand out the passport (Canva link in the original deck) and read through the instructions.\nGive students time to finish.'},
 {t:'statement',kicker:'Good luck!',text:'Good luck!',sub:'Go make it happen.',notes:'Goodbye and good luck remarks. Hand out evaluations/satisfaction forms.'},
 {t:'contact',items:[['Phone number','(201) 225-8849'],['Email address','info@nj4sbergen.org'],['Instagram','@NJ4S_BERGEN']],notes:'If you have any questions, here is how to reach NJ4S Bergen.'},
 {t:'end',notes:'Thank the class.'}]},

10:{n:10,title:'Safe, caring, respectful school',scenes:[
 {t:'title',notes:'Introduce yourself.'},
 {t:'map',notes:MAPNOTE(10)},
 {t:'objectives',title:'A safe, caring, respectful school community',items:['Define community','Explain why Steps to Respect is important','Identify skills that improve school climate','Apply perspective-taking skills'],notes:'Read through objectives.'},
 {t:'list',kicker:'Why this matters',title:'Communities rely on responsible members who share knowledge to help everyone succeed.',items:['Humans form communities to meet shared needs','We all contribute to a safe, caring school','Steps to Respect skills strengthen our community'],notes:'Read through.'},
 {t:'def',kicker:'What is community?',word:'community',prompt:'What is a community?',def:'A group linked by common interests, history, policy, concerns, or needs.',extras:['Community members work together for the community’s good.','Community members rely on respect, cooperation, and give-and-take.'],notes:'Read through.'},
 {t:'compare',kicker:'Why we studied Steps to Respect',title:'What it gives us',cols:[['Why it matters',['Builds a respectful school culture','Helps to prevent bullying','Offers tools for solving social problems']],['Helpful behaviors',['Using friendship skills','Reporting bullying safely','Including others','Standing up for fairness']]],notes:'Read through.'},
 {t:'compare',kicker:'Activity · Tri-fold pamphlet project',title:'Teach one key part of Steps to Respect',cols:[['Content ideas',['Bullying prevention tips','Friendship skills','What to do if you see bullying','How to report','Simple activity (word search or message)']],['Pamphlet structure',['Cover: title + name + art','Key concept #1','Key concept #2','Key concept #3','Activity or message','Closing: the most important thing']]],foot:'Keep ideas simple and clear.',notes:'Create a tri-fold pamphlet to teach one key aspect of Steps to Respect. Keep ideas simple and clear.'},
 {t:'timer',kicker:'Pamphlet time',title:'Make your pamphlet',minutes:15,notes:'Give students time to work on their pamphlets.'},
 {t:'questions',kicker:'Share and reflect',title:'Closing thoughts',qs:['What went well?','What did you enjoy?','How else can you share what you learned?'],answers:['Being part of a community means sharing what we know to keep our school safe, caring, and respectful.'],notes:'Discuss, then press → for the closing thought.'},
 {t:'end',notes:'Any questions? Thank the class. This is the last lesson of the program.'}]}

const fxc=$('#fx'),ctx=fxc.getContext('2d');let parts=[],raf=0;
function confetti(x,y,n){if(reduce)return;const cols=['#F7B6CF','#0A84FF','#F04728','#FFDD66','#37E0AB','#C3ABFF'];for(let k=0;k<n;k++){const a=Math.random()*6.28,v=5+Math.random()*13;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-7,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,w:10+Math.random()*12,h:6+Math.random()*8,c:cols[k%6],o:Math.random()<.3,l:0})}if(!raf)raf=requestAnimationFrame(tick)}
function tick(){ctx.clearRect(0,0,1600,900);parts=parts.filter(p=>p.l<150&&p.y<960);parts.forEach(p=>{p.l++;p.vy+=.42;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.globalAlpha=Math.min(1,(150-p.l)/30);if(p.o){ctx.beginPath();ctx.arc(0,0,p.h*.7,0,6.28);ctx.fill()}else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});raf=parts.length?requestAnimationFrame(tick):0}

function memArt(r){
  if(r.kind==='words')return `<div style="display:flex;flex-wrap:wrap;gap:20px;justify-content:center">${r.items.map((w,k)=>`<span style="background:${CC[k%6]};border-radius:22px;padding:22px 34px;font:800 64px var(--display)">${w}</span>`).join('')}</div>`;
  if(r.kind==='numbers')return `<div style="display:grid;grid-template-columns:repeat(3,150px);gap:20px">${r.items.map(w=>`<span style="background:#FFDD66;border-radius:30px;padding:16px;font:800 100px/1 var(--display);text-align:center">${w}</span>`).join('')}</div>`;
  if(r.kind==='shapes')return `<svg viewBox="0 0 600 300" width="1000" height="420" aria-label="Shapes"><circle cx="90" cy="80" r="60" fill="#3DBE4F"/><path d="M270 20h60v60h60v60h-60v60h-60v-60h-60v-60h60z" fill="#FFD23F" transform="scale(.75) translate(110 0)"/><rect x="450" y="20" width="120" height="120" rx="12" fill="#3AB0B8"/><ellipse cx="200" cy="230" rx="100" ry="55" fill="#9B6BD6"/><path d="M420 290 L490 170 L560 290 Z" fill="#E8232B"/></svg>`;
  return `<svg viewBox="0 0 700 300" width="1100" height="440" aria-label="Picture of objects"><rect x="0" y="230" width="700" height="70" rx="10" fill="#C9A27A"/><circle cx="80" cy="190" r="40" fill="#E8232B"/><rect x="150" y="120" width="70" height="110" rx="12" fill="#3A5BD9"/><circle cx="290" cy="195" r="35" fill="#FFD23F"/><path d="M350 230 L390 130 L430 230Z" fill="#3DBE4F"/><rect x="460" y="150" width="80" height="80" rx="10" fill="#E8232B"/><ellipse cx="620" cy="200" rx="45" ry="30" fill="#FF9D3C"/><circle cx="560" cy="60" r="28" fill="#fff" stroke="#ddd" stroke-width="3"/></svg>`}

L.scenes.filter(x=>x.t==='statement').forEach((x,i)=>x._i=i);
const BUILT=L.scenes.map(s=>({s,r:R[s.t](s)}));
function go(i){if(i<0||i>=BUILT.length)return;clearAll();cur=i;stepI=0;const b=BUILT[cur];
  stage.style.background=b.r.bg||BG[L.n];side.style.color='';rside.style.color='';rside.onclick=null;
  full.classList.toggle('on',!!b.r.full);full.innerHTML='';$('#phone').classList.toggle('away',!!b.r.full);side.style.display=rside.style.display=b.r.full?'none':'';
  b.r.enter&&b.r.enter();if(!b.r.full&&$('h1',side))fitSide();const dark=b.r.bg==='#1E1E1E';$('#ctr').textContent=String(cur+1).padStart(2,'0')+' / '+BUILT.length;$('#ctr').style.color=dark?'#fff':'';$('#help').style.color=dark?'#fff':'';
  $('#notesH').textContent=`Speaker notes · screen ${cur+1} · ${b.s.t} · press N to hide`;$('#notesB').innerHTML=notesHTML(b.s.notes);
  try{history.replaceState(null,'','#s'+(cur+1))}catch(e){}}
function next(){const b=BUILT[cur];if(b.r.steps&&stepI<b.r.steps.length){b.r.steps[stepI++]();return}go(cur+1)}
function prev(){if(stepI>0){go(cur);return}go(cur-1)}
addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(e.target.closest('button,a')&&(e.key===' '||e.key==='Enter'))return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev()}
  else if(e.key==='n'||e.key==='N')$('#notes').classList.toggle('open');else if(e.key==='f'||e.key==='F'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(err){}}});
stage.addEventListener('click',e=>{if(e.target.closest('button,a,.pollb,#rside,.zm,#scr'))return;next()});
const m=location.hash.match(/^#s(\d+)$/);go(m?Math.min(+m[1]-1,BUILT.length-1):0);
