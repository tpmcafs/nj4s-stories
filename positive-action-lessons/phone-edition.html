button:focus-visible{outline:4px solid var(--blue);outline-offset:4px;border-radius:16px}
#vp{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(.3);transform-origin:center;border-radius:64px;overflow:hidden;overflow:clip;background:#05050A;box-shadow:0 0 0 14px #111,0 0 0 16px #2a2a2e}
.wall{position:absolute;inset:-6%;background:radial-gradient(60% 70% at 15% 15%,var(--c) 0,transparent 60%),radial-gradient(55% 65% at 90% 85%,var(--c2) 0,transparent 62%),radial-gradient(40% 50% at 85% 10%,color-mix(in srgb,var(--c) 50%,#fff 0%) 0,transparent 60%),#0A0A12;transition:background .8s;filter:saturate(1.15)}
.wall::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 120%,rgba(0,0,0,.55),transparent 60%)}
.slide-on .wall{animation:wdrift 22s ease-in-out infinite alternate}
@keyframes wdrift{to{transform:translate(2%,-2%) scale(1.05)}}

/* status bar + island + home indicator */
#status{position:absolute;left:0;right:0;top:0;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 70px;z-index:50;font-weight:600;font-size:26px;pointer-events:none}
#status .r{display:flex;align-items:center;gap:14px;pointer-events:auto}
.sig{display:flex;align-items:flex-end;gap:4px;height:20px}.sig i{width:6px;background:#fff;border-radius:2px}
.bat{display:flex;align-items:center;gap:8px;font-size:21px}
.bat .b{position:relative;width:52px;height:24px;border:2.5px solid rgba(255,255,255,.55);border-radius:8px;padding:2px}
.bat .b::after{content:"";position:absolute;right:-7px;top:6px;width:4px;height:9px;border-radius:0 3px 3px 0;background:rgba(255,255,255,.55)}
.bat .b i{display:block;height:100%;border-radius:4px;background:var(--green);transition:width .6s var(--ease)}
#island{position:absolute;left:50%;top:16px;transform:translateX(-50%);height:54px;min-width:250px;padding:0 26px;border-radius:999px;background:#000;z-index:60;display:flex;align-items:center;justify-content:center;gap:14px;font-size:22px;font-weight:600;white-space:nowrap;transition:min-width .5s var(--spring),height .5s var(--spring),border-radius .5s;box-shadow:0 0 0 1px rgba(255,255,255,.06)}
#island .dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
#island .t2{display:none;font-size:20px;color:var(--dim);font-weight:500}
#island.big{min-width:620px;height:84px;border-radius:44px}
#island.big .t2{display:inline}
#homebar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:300px;height:10px;border-radius:9px;background:rgba(255,255,255,.85);z-index:60;cursor:pointer}
#homebar::before{content:"";position:absolute;inset:-22px -40px}
#dots{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);display:flex;gap:9px;z-index:55;pointer-events:none}
#dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .3s}
#dots i.on{width:30px;border-radius:6px;background:#fff}
#dots i.seen{background:rgba(255,255,255,.6)}
.edge{position:absolute;top:120px;bottom:120px;width:70px;z-index:45;display:grid;place-items:center;opacity:0;transition:opacity .3s;font-size:54px;color:rgba(255,255,255,.7)}
.edge.l{left:0}.edge.r{right:0}
#stage:hover .edge{opacity:.6}.edge:hover{opacity:1!important}

/* ===== home screen ===== */
#home{position:absolute;inset:0;z-index:5;display:grid;grid-template-columns:640px 1fr;gap:70px;padding:120px 110px 170px;transition:opacity .4s,transform .5s var(--ease)}
#home.away{opacity:0;transform:scale(1.12);pointer-events:none}
.w-clock .tm{font-size:190px;font-weight:200;letter-spacing:-6px;line-height:.9}
.w-clock .dt{font-size:34px;font-weight:600;color:var(--dim);margin:10px 0 0 8px}
.widget{background:var(--glass);border:1.5px solid var(--line);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);border-radius:44px;padding:30px 34px}
.w-title{margin-top:40px}
.w-title .k{font-size:22px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.w-title h1{font-size:76px;font-weight:800;letter-spacing:-2px;line-height:1;margin:10px 0 8px}
.w-title p{font-size:28px;color:var(--dim);font-weight:500}
.w-next{margin-top:26px;display:flex;align-items:center;gap:24px;text-align:left;width:100%}
.w-next .ic{width:96px;height:96px;flex:none}.w-next .ic .e{font-size:54px}.w-next .ic .n{display:none}
.w-next b{display:block;font-size:20px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
.w-next span{font-size:32px;font-weight:700;line-height:1.15}
.w-next .go{margin-left:auto;width:64px;height:64px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-size:30px;flex:none}
.grid-apps{display:grid;grid-template-columns:repeat(3,1fr);gap:60px 40px;align-content:center}
.app{display:flex;flex-direction:column;align-items:center;gap:18px;position:relative}
.app .ic{width:220px;height:220px}
.app .lb{font-size:27px;font-weight:600;text-align:center;line-height:1.2;max-width:290px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.app .lb small{display:block;font-size:20px;color:var(--dim);font-weight:500}
.app:active .ic{transform:scale(.92)}
.ic{position:relative;border-radius:24%;display:grid;place-items:center;background:linear-gradient(145deg,var(--a1),var(--a2));box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .2s var(--spring)}
.ic .e{font-size:110px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.ic .n{position:absolute;left:20px;top:14px;font-size:30px;font-weight:800;opacity:.9}
.badge{position:absolute;right:-12px;top:-12px;min-width:56px;height:56px;padding:0 14px;border-radius:999px;background:var(--red);font-size:28px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 5px rgba(0,0,0,.25)}
.badge.done{background:var(--green)}
.app.jiggle .ic{animation:jig .35s ease-in-out 2}
@keyframes jig{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
#dock{position:absolute;left:1315px;bottom:58px;transform:translateX(-50%);display:flex;gap:34px;padding:22px 34px;border-radius:52px;z-index:6;transition:opacity .3s}
#dock .ic{width:112px;height:112px}
#dock .ic .e{font-size:58px}
#dock.hide,#dots.hide{opacity:0;pointer-events:none}
.home-anim .grid-apps .app{animation:appin .7s var(--spring) both}
@keyframes appin{from{opacity:0;transform:scale(.5) translateY(60px)}}

/* ===== lesson screens ===== */
#lesson{position:absolute;inset:0;z-index:10;visibility:hidden}
#lesson.on{visibility:visible}
.scr{position:absolute;inset:0;padding:96px 110px 120px;display:flex;flex-direction:column;visibility:hidden;transform:translateX(100%);transition:transform .55s var(--ease),visibility 0s .55s}
.scr.on{visibility:visible;transform:none;transition:transform .55s var(--ease)}
.scr.left{transform:translateX(-30%);opacity:.0;transition:transform .55s var(--ease),opacity .4s,visibility 0s .55s}
.appbar{display:flex;align-items:center;gap:20px;height:64px;font-size:28px;font-weight:600}
.appbar .back{color:#fff;display:flex;align-items:center;gap:6px;opacity:.9}
.appbar .back b{font-size:46px;font-weight:300;line-height:0;margin-top:-4px}
.appbar .an{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--dim);font-size:24px;padding:10px 20px;border-radius:999px;background:var(--glass)}
.lt{font-size:84px;font-weight:800;letter-spacing:-2.5px;line-height:1;margin:14px 0 30px;max-width:1650px;text-wrap:balance}
.lt.sm{font-size:68px}
.kick2{font-size:26px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:-14px 0 22px}
.body{flex:1;min-height:0;display:flex;flex-direction:column}
.scr.on .rise{animation:rise .65s var(--spring) both;animation-delay:calc(var(--d,0)*80ms + 150ms)}
@keyframes rise{from{opacity:0;transform:translateY(50px) scale(.97)}}
.glass{background:var(--glass);border:1.5px solid var(--line);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);border-radius:40px}
.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:60px;flex:1;min-height:0;align-items:center}
.p{font-size:40px;font-weight:500;line-height:1.35;color:#fff;text-wrap:pretty}
.ul{list-style:none;display:flex;flex-direction:column;gap:16px}
.ul li{font-size:36px;font-weight:600;display:flex;gap:18px;align-items:flex-start}
.ul li::before{content:"";flex:none;width:16px;height:16px;border-radius:50%;background:var(--c);margin-top:16px;box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 30%,transparent)}
.ol{counter-reset:o;list-style:none;display:flex;flex-direction:column;gap:18px}
.ol li{counter-increment:o;font-size:36px;font-weight:600;display:flex;gap:22px;align-items:flex-start;line-height:1.3}
.ol li::before{content:counter(o);flex:none;width:58px;height:58px;border-radius:18px;background:#fff;color:#000;display:grid;place-items:center;font-weight:800;font-size:30px}
.kick{font-size:24px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:16px}
.cap{margin-top:auto;padding-top:24px;font-size:30px;font-weight:600;color:var(--dim);text-align:center}
.cap b{color:#fff}
.btn{display:inline-flex;align-items:center;gap:12px;height:76px;padding:0 36px;border-radius:999px;background:#fff;color:#000;font-size:28px;font-weight:700;transition:transform .15s var(--spring)}
.btn:active{transform:scale(.94)}
.btn.ghost{background:var(--glass2);color:#fff}
.btn.acc{background:var(--c);color:#fff}
.btn.sm{height:60px;padding:0 26px;font-size:24px}
.hint{font-size:22px;font-weight:600;color:var(--dim);display:flex;gap:10px;align-items:center}
.hint::before{content:"👆"}

/* bubbles / chat */
.av{flex:none;width:76px;height:76px;border-radius:50%;overflow:hidden;background:color-mix(in srgb,var(--avc,#888) 60%,#fff 0%);box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.av svg{width:100%;height:100%;display:block}
.bub{max-width:1100px;font-size:40px;font-weight:600;line-height:1.3;padding:22px 32px;border-radius:40px;background:rgba(255,255,255,.16);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.bub.me{background:var(--blue)}
.bub.acc{background:var(--c)}
.msg{display:flex;gap:18px;align-items:flex-end}
.msg .who{font-size:20px;font-weight:600;color:var(--dim);margin:0 0 6px 30px}
.msg.r{flex-direction:row-reverse}
.msg.r .who{text-align:right;margin:0 30px 6px 0}
.msg.in{animation:msgin .5s var(--spring) both}
@keyframes msgin{from{opacity:0;transform:translateY(40px) scale(.9)}}
.typing{display:inline-flex;gap:10px;padding:28px 34px;border-radius:40px;background:rgba(255,255,255,.16)}
.typing i{width:16px;height:16px;border-radius:50%;background:#fff;opacity:.5;animation:tdot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{30%{opacity:1;transform:translateY(-8px)}}
.thread{flex:1;min-height:0;display:flex;flex-direction:column;gap:26px;justify-content:flex-end;padding:10px 0}
.pin{display:flex;align-items:center;gap:20px;padding:22px 30px;border-radius:30px;background:rgba(255,214,10,.16);border:2px solid rgba(255,214,10,.5);font-size:34px;font-weight:700;line-height:1.3}
.pin::before{content:"📌";font-size:40px}
.pin.hide{display:none}
.pin.show{display:flex;animation:msgin .5s var(--spring) both}
.chathead{display:flex;align-items:center;gap:16px;padding:12px 24px 12px 12px;border-radius:999px;background:var(--glass);align-self:flex-start;font-size:24px;font-weight:600}
.stack{display:flex}.stack .av{width:52px;height:52px;margin-left:-14px;box-shadow:0 0 0 3px #222}.stack .av:first-child{margin-left:0}
.ctl{display:flex;gap:16px;align-items:center;margin-top:20px}

/* notes */
.notes{background:#1C1C1E;border-radius:44px;padding:40px 54px;box-shadow:0 30px 80px rgba(0,0,0,.45);border:1.5px solid rgba(255,255,255,.08)}
.notes .nh{display:flex;align-items:center;gap:14px;color:var(--yellow);font-size:26px;font-weight:700;margin-bottom:18px}
.chk{display:flex;align-items:center;gap:26px;width:100%;text-align:left;padding:20px 6px;border-bottom:1.5px solid rgba(255,255,255,.08);font-size:42px;font-weight:600;transition:color .3s}
.chk:last-of-type{border-bottom:0}
.chk .c{flex:none;width:58px;height:58px;border-radius:50%;border:4px solid rgba(255,255,255,.4);display:grid;place-items:center;transition:all .35s var(--spring)}
.chk .c svg{width:30px;height:30px;opacity:0;transform:scale(.3);transition:all .35s var(--spring)}
.chk.on{color:rgba(255,255,255,.5)}
.chk.on .c{background:var(--yellow);border-color:var(--yellow);transform:scale(1.08)}
.chk.on .c svg{opacity:1;transform:none}
.chk.on .tx{text-decoration:line-through;text-decoration-thickness:3px}
.prog{display:flex;gap:10px;align-items:center;margin-top:22px}
.prog i{flex:1;height:12px;border-radius:9px;background:rgba(255,255,255,.12);transition:background .4s}
.prog i.on{background:var(--yellow)}
.prog .st{font-size:46px;filter:grayscale(1);opacity:.4;transition:all .5s var(--spring)}
.prog.all .st{filter:none;opacity:1;transform:scale(1.4) rotate(18deg)}

/* calendar */
.cal{display:grid;gap:20px;flex:1;min-height:0;align-items:stretch}
.day{position:relative;text-align:left;padding:28px;border-radius:36px;display:flex;flex-direction:column;gap:14px;transition:transform .2s var(--spring)}
.day:hover{transform:translateY(-6px)}
.day .dn{font-size:22px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
.day .dd{font-size:64px;font-weight:300;line-height:1}
.day .dtp{font-size:30px;font-weight:700;line-height:1.2;margin-top:auto}
.day.now{background:#fff;color:#000}.day.now .dn{padding-right:84px}
.day.now .dn{color:var(--c)}
.day.now::after{content:"TODAY";position:absolute;right:22px;top:22px;font-size:18px;font-weight:800;letter-spacing:1px;background:var(--c);color:#fff;padding:6px 12px;border-radius:10px}
.meet{font-size:28px;font-weight:600;color:var(--dim);margin:-10px 0 22px}

/* cards (flip notifications) */
.cards{display:grid;gap:26px;flex:1;min-height:0;align-content:center}
.fc{display:block;width:100%;perspective:1600px;height:440px}
.fc.small{height:340px}.fc.tall{height:560px}
.fc .in{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s var(--spring)}
.fc.open .in{transform:rotateY(180deg)}
.fc .fa{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:44px;padding:36px;display:flex;flex-direction:column;text-align:left}
.fc .fa.f{background:var(--glass);border:1.5px solid var(--line);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.fc .fa.b{transform:rotateY(180deg);background:#fff;color:#000;justify-content:center}
.fc .em{font-size:110px;line-height:1}
.fc .ft{font-size:38px;font-weight:800;line-height:1.15;margin-top:auto}
.fc .tp{font-size:22px;font-weight:600;color:var(--dim);margin-top:12px}
.fc .bt{font-size:40px;font-weight:700;line-height:1.3}
.fc.small .em{font-size:96px}.fc.small .bt{font-size:38px}
.fc .bt small{display:block;font-size:22px;color:var(--c);font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px}
.fc .fa.b .bem{font-size:60px;margin-bottom:14px}
.headrow{display:grid;grid-template-columns:1fr 1fr;gap:30px;font-size:30px;font-weight:700;color:var(--dim);margin-bottom:20px}
.plant{width:360px;height:440px}


/* swap rows: behavior -> better choice */
.swap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px}
.xh{display:grid;grid-template-columns:1fr 130px 1fr;font-size:30px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px}
.xr{display:grid;grid-template-columns:1fr 130px 1fr;align-items:stretch;width:100%;text-align:left}
.xb,.xg{min-height:150px;border-radius:40px;padding:26px 36px;display:flex;align-items:center;gap:24px;font-size:52px;font-weight:800;line-height:1.1;letter-spacing:-1px}
.xb{justify-content:flex-start;background:#fff;color:#C1121F;box-shadow:0 18px 40px rgba(0,0,0,.3)}
.xb .e,.xg .e{font-size:64px;flex:none}
.xb s{text-decoration-thickness:6px;text-decoration-color:transparent;transition:text-decoration-color .4s}
.xa{display:grid;place-items:center}
.xa i{width:84px;height:84px;border-radius:50%;background:var(--glass2);display:grid;place-items:center;font-size:44px;font-style:normal;transition:all .4s var(--spring)}
.xg{position:relative;border:4px dashed rgba(255,255,255,.35);color:var(--dim);font-size:30px;font-weight:700;justify-content:center;transition:all .5s var(--spring)}
.xg .tx{display:none}
.xr.on .xb s{text-decoration-color:#C1121F}
.xr.on .xb{opacity:.85}
.xr.on .xa i{background:var(--green);transform:rotate(360deg) scale(1.1)}
.xr.on .xg{border:0;background:var(--green);color:#04210d;font-size:52px;font-weight:800;justify-content:flex-start;box-shadow:0 18px 40px rgba(48,209,88,.35);animation:pop .5s var(--spring)}
.xr.on .xg .tx{display:inline}.xr.on .xg .ph3{display:none}
/* quote */
.qwrap{flex:1;display:grid;grid-template-columns:1fr auto;gap:70px;align-items:center}
.qt{font-size:96px;font-weight:800;line-height:1.05;letter-spacing:-3px;text-wrap:balance}
.qt .q2{display:block;color:transparent;background:linear-gradient(90deg,#fff,color-mix(in srgb,var(--c) 60%,#fff));-webkit-background-clip:text;background-clip:text;margin-top:18px;font-size:.62em;letter-spacing:-1px;line-height:1.15}
.smiley{width:380px;height:380px;border-radius:50%;display:grid;place-items:center;font-size:250px;cursor:pointer;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.3),transparent 60%),var(--glass)}
.scr.on .smiley{animation:smile 3s var(--spring) infinite}
@keyframes smile{0%,100%{transform:rotate(0)}10%{transform:rotate(-12deg) scale(1.08)}20%{transform:rotate(10deg)}30%{transform:none}}

/* rings */
.rings{flex:1;display:grid;grid-template-columns:auto 1fr;gap:70px;align-items:center;min-height:0}
.dial{position:relative;width:660px;height:660px;zoom:.8}
.dial svg{width:100%;height:100%;overflow:visible}
.dial .node{position:absolute;transform:translate(-50%,-50%);padding:16px 28px;border-radius:999px;font-size:30px;font-weight:800;background:#1C1C1E;border:3px solid rgba(255,255,255,.2);transition:all .4s var(--spring);white-space:nowrap}
.dial .node.on{background:var(--c);border-color:#fff;transform:translate(-50%,-50%) scale(1.15);box-shadow:0 0 40px var(--c)}
.dial .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:230px;height:230px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;text-align:center;font-size:34px;font-weight:800;line-height:1.1;box-shadow:0 0 0 14px rgba(255,255,255,.1)}
.scr.on .dial .spin{animation:spin 14s linear infinite;transform-origin:330px 330px}
@keyframes spin{to{transform:rotate(360deg)}}
.neg .dial .ctr{background:var(--red);color:#fff}
.row{display:flex;gap:20px;align-items:baseline;padding:20px 28px;border-radius:30px;font-size:34px;line-height:1.3;opacity:.25;transition:all .4s;border-left:8px solid transparent}
.row b{flex:none;width:170px;font-weight:800}
.row.on{opacity:1;background:var(--glass);border-left-color:var(--c)}
.seg{display:inline-flex;padding:6px;border-radius:999px;background:rgba(255,255,255,.12);margin-bottom:18px}
.seg button{height:62px;padding:0 30px;border-radius:999px;font-size:24px;font-weight:700;color:var(--dim)}
.seg button.on{background:#fff;color:#000}

/* tags */
.tags{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-content:center;flex:1;max-width:1500px;margin:0 auto}
.tag{height:110px;padding:0 50px;border-radius:999px;font-size:46px;font-weight:700;background:var(--glass);border:2px solid var(--line);transition:all .35s var(--spring)}
.tag.on{background:#fff;color:#000;transform:scale(1.06)}
.tag.sp{border-style:dashed}
.tag.sp.x{background:var(--red);color:#fff;text-decoration:line-through;animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-14px)}40%,80%{transform:translateX(14px)}}
.toast{position:absolute;left:50%;bottom:170px;max-width:1100px;line-height:1.3;transform:translate(-50%,420px);z-index:70;padding:22px 36px;border-radius:30px;background:rgba(30,30,32,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);font-size:30px;font-weight:700;display:flex;gap:16px;align-items:center;box-shadow:0 20px 50px rgba(0,0,0,.5);transition:transform .5s var(--spring)}
.toast.show{transform:translate(-50%,0)}

/* profiles */
.pros{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;flex:1;align-content:center}
.pro{padding:40px 24px;border-radius:44px;display:flex;flex-direction:column;align-items:center;gap:22px;transition:transform .25s var(--spring),background .3s}
.pro .av{width:200px;height:200px;box-shadow:0 0 0 6px rgba(255,255,255,.2)}
.pro .nm{font-size:44px;font-weight:800}
.pro .tp2{font-size:22px;color:var(--dim);font-weight:600}
.pro.on{background:#fff;color:#000;transform:translateY(-10px)}
.pro.on .tp2{color:var(--c)}
.sheet{margin-top:26px;padding:34px 44px;border-radius:40px;background:#fff;color:#000;font-size:38px;font-weight:600;line-height:1.35;display:flex;gap:30px;align-items:center;min-height:170px}
.sheet b{font-size:24px;letter-spacing:2px;text-transform:uppercase;color:var(--c);display:block;margin-bottom:6px}
.sheet.empty{background:var(--glass);color:var(--dim);font-size:30px;justify-content:center}
.ringpro{position:relative;width:700px;height:700px;flex:none;zoom:.8}
.ringpro .pro{position:absolute;transform:translate(-50%,-50%);width:250px;padding:20px 10px;gap:10px}
.ringpro .pro .av{width:130px;height:130px}
.ringpro .pro .nm{font-size:28px;text-align:center;line-height:1.1}

/* scn */
.scn{flex:1;display:grid;grid-template-columns:420px 1fr;gap:56px;min-height:0;align-items:center}
.reel{height:520px;border-radius:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:30px}
.reel .win{width:300px;height:250px;border-radius:36px;background:#000;overflow:hidden;position:relative;box-shadow:inset 0 0 0 4px rgba(255,255,255,.15)}
.reel .strip{position:absolute;left:0;right:0;top:0;transition:transform 2.2s cubic-bezier(.15,.8,.15,1)}
.reel .strip div{height:250px;display:grid;place-items:center;font-size:150px;font-weight:800;text-transform:uppercase}
.scnlist{display:grid;gap:14px}
.sc{display:flex;gap:22px;align-items:center;padding:16px 26px;border-radius:32px;text-align:left;transition:all .4s var(--spring)}
.sc .l{flex:none;width:66px;height:66px;border-radius:22px;background:#fff;color:#000;display:grid;place-items:center;font-size:40px;font-weight:800;text-transform:uppercase}
.sc .tx{font-size:36px;font-weight:700;line-height:1.25}
.sc .tx small{display:block;font-size:26px;font-weight:500;color:var(--dim);margin-top:6px;line-height:1.35}
.sc.pick{background:#fff;color:#000;transform:scale(1.03)}
.sc.pick .l{background:var(--c);color:#fff}
.sc.pick .tx small{color:#333}
.sc.dim{opacity:.4}
.lights{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:22px}
.lg{display:flex;gap:18px;align-items:center;padding:20px 24px;border-radius:30px;font-size:27px;font-weight:600;line-height:1.25;text-align:left;opacity:.45;transition:all .4s}
.lg .bulb{flex:none;width:54px;height:54px;border-radius:50%;background:#333;box-shadow:inset 0 0 0 4px rgba(255,255,255,.2)}
.lg.on{opacity:1}
.lg.on.s1 .bulb{background:var(--red);box-shadow:0 0 30px var(--red)}.lg.on.s2 .bulb{background:var(--yellow);box-shadow:0 0 30px var(--yellow)}.lg.on.s3 .bulb{background:var(--green);box-shadow:0 0 30px var(--green)}

/* widgets */
.wid{border-radius:48px;padding:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:520px}
.bignum{font-size:200px;font-weight:200;line-height:1;font-variant-numeric:tabular-nums}
.wl{font-size:30px;font-weight:700;color:var(--dim)}
.pips{display:flex;gap:12px}.pips i{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);transition:all .3s var(--spring)}.pips i.on{background:var(--green);transform:scale(1.15)}
.round{width:110px;height:110px;border-radius:50%;background:#fff;color:#000;font-size:56px;font-weight:300;display:grid;place-items:center;transition:transform .15s var(--spring)}
.round:active{transform:scale(.88)}
.round.ghost{background:var(--glass2);color:#fff}
.heartbtn{width:220px;height:220px;border-radius:50%;background:var(--pink);font-size:120px;display:grid;place-items:center;box-shadow:0 20px 50px color-mix(in srgb,var(--pink) 50%,transparent);transition:transform .12s var(--spring)}
.heartbtn:active{transform:scale(.88)}
.flyup{position:absolute;font-size:80px;pointer-events:none;animation:fly 1.6s ease-out forwards;z-index:80}
@keyframes fly{to{transform:translate(var(--dx),-500px) scale(1.4) rotate(var(--r));opacity:0}}
.appgrid{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:40px 34px;justify-items:center}
.mapp{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:240px;text-align:center}
.mapp .ic{width:170px;height:170px;--a1:color-mix(in srgb,var(--c) 85%,#fff);--a2:var(--c2)}
.mapp .ic .e{font-size:92px}
.mapp .lb{font-size:28px;font-weight:700;line-height:1.2}
.mapp.on .ic{animation:pop .5s var(--spring)}
@keyframes pop{40%{transform:scale(1.18) rotate(-6deg)}}
.mapp .go{font-size:20px;color:var(--dim);font-weight:600}
.emobub{position:relative;width:640px;height:560px}
.emobub button{position:absolute;width:190px;height:190px;border-radius:50%;font-size:110px;display:grid;place-items:center;background:var(--glass);border:1.5px solid var(--line)}
.scr.on .emobub button{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-24px)}}
.emobub button.popd{animation:popd .5s forwards!important}
@keyframes popd{50%{transform:scale(1.3)}100%{transform:scale(0);opacity:0}}
.breath{width:460px;height:460px;position:relative;display:grid;place-items:center;cursor:pointer}
.breath i{position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(64,200,224,.9),rgba(48,209,88,.5));mix-blend-mode:screen;transform-origin:50% 50%}
.scr.on .breath.go i{animation:petal 8s ease-in-out infinite}
@keyframes petal{0%,100%{transform:rotate(var(--a)) translateY(0) scale(.45)}50%{transform:rotate(var(--a)) translateY(-90px) scale(1)}}
.breath .bt2{position:relative;font-size:40px;font-weight:800;z-index:2;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.seats{position:relative;width:560px;height:560px}
.seat{position:absolute;width:104px;height:104px;transform:translate(-50%,-50%);border-radius:50%;border:4px dashed rgba(255,255,255,.3);transition:all .4s var(--spring)}
.seat.on{border:0}
.seat .av{width:104px;height:104px}
.seats .cc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}
.mirror{width:520px;height:700px;border-radius:60px;background:linear-gradient(160deg,#2a2a35,#111);position:relative;overflow:hidden;box-shadow:inset 0 0 0 4px rgba(255,255,255,.12)}
.mirror .avbig{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:460px;height:520px}
.mirror .fl{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;gap:16px}
.mirror .fl button{height:56px;padding:0 22px;border-radius:999px;background:rgba(0,0,0,.5);font-size:22px;font-weight:700}
.mirror .fl button.on{background:var(--yellow);color:#000}
.mirror .shine{position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);background-size:250% 100%;animation:shine 4s ease-in-out infinite}
@keyframes shine{0%,100%{background-position:120% 0}50%{background-position:-20% 0}}
.mirror.filt .avbig{filter:hue-rotate(160deg) saturate(2) blur(1px)}
.mirror .lbl{position:absolute;top:26px;left:50%;transform:translateX(-50%);font-size:20px;font-weight:700;background:rgba(0,0,0,.5);padding:8px 16px;border-radius:999px}

/* poll */
.poll{max-width:1300px;width:100%;margin:0 auto;padding:44px 54px;border-radius:48px;background:#fff;color:#000;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.poll .pq{font-size:44px;font-weight:800;line-height:1.2;margin-bottom:30px}
.popt{position:relative;width:100%;height:96px;border-radius:26px;background:#EFEFF4;margin-bottom:16px;overflow:hidden;display:flex;align-items:center;gap:20px;padding:0 30px;font-size:36px;font-weight:700;text-align:left}
.popt i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--c),var(--c2));opacity:.25;transition:width .6s var(--spring)}
.popt span,.popt em,.popt b{position:relative}
.popt em{font-style:normal;font-size:44px}
.popt b{margin-left:auto;font-size:32px;color:#555;font-variant-numeric:tabular-nums}

/* balance */
.bal{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:stretch}
.balc{border-radius:48px;padding:40px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;transition:all .4s}
.balc h3{font-size:46px;font-weight:800}
.balc p{font-size:34px;font-weight:600;color:var(--dim)}
.balloon{width:200px;height:240px;border-radius:50% 50% 48% 48%;transition:transform 2.4s cubic-bezier(.3,0,.7,1),opacity .2s;margin:auto 0;position:relative}
.balloon::after{content:"";position:absolute;left:50%;bottom:-60px;width:3px;height:60px;background:rgba(255,255,255,.5)}
.balc.a .balloon{background:radial-gradient(circle at 35% 30%,#ff9b8f,var(--red))}
.balc.b .balloon{background:radial-gradient(circle at 35% 30%,#9ef0b3,var(--green))}
.balc.a.go .balloon{transform:scale(1.9)}
.balc.a.pop .balloon{opacity:0}
.balc.b.go .balloon{transform:scale(.85) translateY(-20px)}
.boom{font-size:180px;position:absolute;opacity:0}
.balc.a.pop .boom{animation:boom .8s forwards}
@keyframes boom{0%{opacity:1;transform:scale(.3)}60%{transform:scale(1.4)}100%{opacity:0;transform:scale(1.6)}}
.balc .res{font-size:36px;font-weight:800;opacity:0;transition:opacity .5s}
.balc.done .res{opacity:1}

/* qa */
.qa{flex:1;display:grid;grid-template-columns:.85fr 1.15fr;gap:60px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:18px;margin-top:30px}
.chip{height:90px;padding:0 34px;border-radius:999px;display:flex;gap:14px;align-items:center;font-size:34px;font-weight:700;background:var(--glass);border:2px solid var(--line);transition:all .3s var(--spring)}
.chip.on{background:#fff;color:#000;transform:scale(1.05)}

/* group */
.grp{position:relative;width:620px;height:620px;flex:none;margin:auto}
.grp .ringbg{position:absolute;left:50%;top:50%;width:420px;height:420px;transform:translate(-50%,-50%);border-radius:50%;background:var(--glass);border:2px solid var(--line)}
.grp .gm{position:absolute;width:150px;height:150px;transform:translate(-50%,-50%);transition:left 1s var(--spring),top 1s var(--spring),filter .6s,opacity .6s}
.grp .gm .av{width:150px;height:150px}
.grp .gm.out{filter:grayscale(1);opacity:.55}
.grp .gname{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:800;text-align:center}
.grp .gname small{display:block;font-size:20px;color:var(--dim);font-weight:600}
.sysmsg{text-align:center;font-size:24px;font-weight:600;color:var(--dim);margin-top:10px;min-height:34px}
.take{display:flex;gap:16px;align-items:center;padding:24px 30px;border-radius:30px;background:#fff;color:#000;font-size:36px;font-weight:800;line-height:1.25}
.take.step{opacity:0;transform:translateY(20px);transition:all .5s var(--spring);pointer-events:none}
.take.step.show{opacity:1;transform:none}
.qb{display:flex;gap:18px;align-items:flex-end}
.qb .bub{font-size:36px}
.stackl{display:flex;flex-direction:column;gap:26px}

/* player */
.player{display:grid;grid-template-columns:auto 1fr;gap:60px;align-items:center;flex:1}
.cover{width:520px;height:520px;border-radius:40px;background:linear-gradient(140deg,var(--c),var(--c2));display:flex;flex-direction:column;justify-content:flex-end;padding:40px;box-shadow:0 40px 80px rgba(0,0,0,.45);position:relative;overflow:hidden}
.cover .be{position:absolute;right:30px;top:30px;font-size:150px;opacity:.9}
.cover h3{font-size:52px;font-weight:800;line-height:1.05}
.cover p{font-size:24px;font-weight:600;opacity:.8;margin-top:10px}
.pbar{height:12px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden;margin:26px 0 12px}
.pbar i{display:block;height:100%;width:0;background:#fff;transition:width .5s linear}
.ptime{display:flex;justify-content:space-between;font-size:22px;color:var(--dim);font-weight:600}
.pctl{display:flex;gap:40px;align-items:center;justify-content:center;margin-top:20px}
.pctl .pp{width:120px;height:120px;border-radius:50%;background:#fff;color:#000;font-size:52px;display:grid;place-items:center}
.eq{display:flex;gap:6px;align-items:flex-end;height:50px}
.eq i{width:10px;background:#fff;border-radius:4px;height:20%}
.playing .eq i{animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{to{height:100%}}
.tally{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:30px}
.tl{padding:26px;border-radius:36px;display:flex;flex-direction:column;align-items:center;gap:12px}
.tl .tn{font-size:96px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.tl .tt{font-size:28px;font-weight:700}
.tl .tb{display:flex;gap:12px}

/* sign */
.sigpad{position:relative;height:560px;border-radius:44px;background:#FFFDF5;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.sigpad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.sigpad .ln{position:absolute;left:60px;right:60px;bottom:120px;border-bottom:3px dashed #bbb;pointer-events:none}
.sigpad .ph2{position:absolute;left:60px;bottom:70px;font-size:24px;color:#999;font-weight:600;pointer-events:none}
.sigpad .clr{position:absolute;right:24px;top:24px;height:56px;padding:0 22px;border-radius:999px;background:#eee;color:#000;font-size:22px;font-weight:700}
.sigpad .tt3{position:absolute;left:60px;top:44px;font-size:28px;font-weight:800;color:#C08A00}

/* rumor */
.rum{flex:1;position:relative;min-height:0}
.rp{position:absolute;display:flex;flex-direction:column;align-items:center;gap:10px;transform:translate(-50%,-50%);transition:opacity .4s}
.rp .av{width:130px;height:130px}
.rp .seen{font-size:20px;font-weight:700;color:var(--dim)}
.rp.lit .av{box-shadow:0 0 0 6px var(--red),0 0 40px var(--red)}
.rbub{position:absolute;max-width:560px;font-size:34px;font-weight:700;padding:20px 28px;border-radius:32px;background:#fff;color:#000;transform:translate(-50%,-100%);transition:left 1s var(--ease),top 1s var(--ease),filter .6s}
.rbub small{display:block;font-size:18px;font-weight:700;color:var(--red);font-style:italic;margin-bottom:4px}
.counter2{position:absolute;right:0;bottom:0;text-align:right}
.counter2 b{display:block;font-size:110px;font-weight:200;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.counter2 span{font-size:24px;font-weight:700;color:var(--dim)}

/* swipe */
.sw{flex:1;display:grid;grid-template-columns:1fr 640px 1fr;gap:40px;align-items:center;min-height:0}
.bin{height:100%;max-height:640px;border-radius:44px;padding:30px;display:flex;flex-direction:column;gap:12px}
.bin h3{font-size:38px;font-weight:800}
.bin .sb{font-size:22px;font-weight:700;color:var(--dim);margin-bottom:10px}
.bin .it{font-size:26px;font-weight:700;padding:14px 20px;border-radius:20px;background:rgba(255,255,255,.12);animation:msgin .4s var(--spring)}
.bin.l .it{border-left:6px solid var(--red)}.bin.r .it{border-left:6px solid var(--green)}
.swst{position:relative;height:420px}
.swc{position:absolute;inset:0;border-radius:44px;background:#fff;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-size:56px;font-weight:800;text-align:center;padding:40px;box-shadow:0 30px 70px rgba(0,0,0,.4);touch-action:none;cursor:grab;transition:transform .45s var(--ease),opacity .45s}
.swc small{font-size:24px;color:#888;font-weight:700}
.swc:nth-last-child(2){transform:translateY(20px) scale(.95)}
.swc:nth-last-child(3){transform:translateY(40px) scale(.9)}
.swb{display:flex;justify-content:center;gap:30px;margin-top:40px}
.fb{text-align:center;font-size:32px;font-weight:700;min-height:44px;margin-top:20px}

/* stopgo */
.sg{flex:1;display:grid;grid-template-columns:auto 1fr;gap:70px;align-items:center}
.tlight{width:260px;padding:30px;border-radius:70px;background:#111;display:flex;flex-direction:column;gap:26px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.1),0 30px 60px rgba(0,0,0,.5)}
.tlight i{width:200px;height:200px;border-radius:50%;background:#2a2a2a;transition:all .4s}
.tlight i.on.s1{background:var(--red);box-shadow:0 0 80px var(--red)}.tlight i.on.s2{background:var(--yellow);box-shadow:0 0 80px var(--yellow)}.tlight i.on.s3{background:var(--green);box-shadow:0 0 80px var(--green)}
.sgr{display:flex;flex-direction:column;gap:26px}
.sgr .lg{font-size:44px;padding:30px 36px}
.sgr .lg b{font-weight:900;letter-spacing:2px}

/* target / maps / stairs / timer */
.tgt{width:560px;height:560px;position:relative;cursor:pointer}
.tgt svg{width:100%;height:100%}
.dart{position:absolute;left:50%;top:50%;font-size:130px;transform:translate(300px,-400px) rotate(-30deg);opacity:0;transition:transform .5s cubic-bezier(.5,0,.9,.5),opacity .2s}
.tgt.hit .dart{transform:translate(-40%,-75%) rotate(-30deg);opacity:1}
.tgt.hit svg{animation:thud .4s .45s}
@keyframes thud{40%{transform:scale(.94)}}
.mapc{position:relative;height:640px;border-radius:48px;overflow:hidden;background:#E9F1E7}
.mapc svg{position:absolute;inset:0;width:100%;height:100%}
.pinl{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;opacity:0;transition:all .5s var(--spring)}
.pinl b{background:#fff;color:#000;font-size:26px;font-weight:800;padding:10px 18px;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,.25);white-space:nowrap}
.pinl i{width:26px;height:26px;border-radius:50%;background:var(--c);border:5px solid #fff;margin-top:6px;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.pinl.on{opacity:1}
.car{position:absolute;width:56px;height:56px;border-radius:50%;background:var(--blue);border:7px solid #fff;box-shadow:0 0 0 12px rgba(10,132,255,.25);transform:translate(-50%,-50%)}
.mapcard{position:absolute;left:30px;right:30px;bottom:30px;padding:24px 30px;border-radius:30px;background:#fff;color:#000;display:flex;align-items:center;gap:20px;font-size:30px;font-weight:800}
.mapcard small{display:block;font-size:20px;color:#666;font-weight:600}
.mapcard .btn{margin-left:auto;background:var(--blue);color:#fff}
.stairs{display:flex;align-items:flex-end;gap:14px;height:380px;position:relative;cursor:pointer}
.stairs i{flex:1;border-radius:18px 18px 0 0;background:linear-gradient(180deg,var(--c),var(--c2));opacity:.35;transition:opacity .4s}
.stairs i.on{opacity:1}
.climber{position:absolute;width:110px;height:120px;bottom:0;transition:left .5s var(--spring),bottom .5s var(--spring)}
.tclock{display:flex;flex-direction:column;align-items:center;gap:24px;padding:40px;border-radius:48px}
.tring{position:relative;width:440px;height:440px}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring .arc{transition:stroke-dashoffset 1s linear}
.tring .tv{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;font-weight:200;font-variant-numeric:tabular-nums}
.tring .rd{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:26px;font-weight:700;color:var(--orange)}
.tclock.done .tv{color:var(--red);animation:shake .5s 3}

/* lock + done */
.lock{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:10px}
.lock .tm{font-size:220px;font-weight:200;letter-spacing:-8px;line-height:.9}
.lock .dt{font-size:36px;font-weight:600;color:var(--dim);margin-top:6px}
.notif{display:flex;gap:22px;align-items:center;text-align:left;width:900px;padding:24px 30px;border-radius:40px;margin-top:40px}
.notif .av{width:84px;height:84px}

/* ---------- render + wire ---------- */
function render(el,s,l,i){
  el.innerHTML=(R[s.type]||R.lead)(s,l,i);
  $$('[data-home]',el).forEach(b=>b.onclick=showHome);
  $$('[data-next]',el).forEach(b=>b.onclick=next);
  $$('[data-open]',el).forEach(b=>b.onclick=e=>{e.stopPropagation();openLesson(+b.dataset.open,0,null)});
  $$('[data-go]',el).forEach(b=>b.addEventListener('click',()=>setTimeout(()=>show(+b.dataset.go-1),250)));
  $$('[data-party]',el).forEach(b=>b.onclick=()=>{confetti(500,500,150);confetti(1400,500,150);sfx.yay()});
  wireChecks(el);wireWidgets(el);wireReveal(el);
  $$('.fc',el).forEach(f=>f.onclick=()=>{f.classList.toggle('open');sfx.tap();if(f.classList.contains('open'))growPlant(el)});
  const W={swap:wireSwap,chat:wireChat,rings:wireRings,tags:wireTags,profiles:wireProfiles,scn:wireScn,poll:wirePoll,balance:wireBal,qa:wireQA,group:wireGroup,player:wirePlayer,sign:wireSign,rumor:wireRumor,swipe:wireSwipe,stopgo:wireSG,target:wireTgt,maps:wireMap,stairs:wireStairs,timer:wireTimer,quote:wireQuote,lead:()=>{}}[s.type];
  W&&W(el,s);
}
function growPlant(el){const p=$('[data-plant]',el);if(!p)return;const n=$$('.fc.open',el).length,tot=$$('.fc',el).length;$('.stem',p).style.strokeDashoffset=240-240*Math.min(1,n/tot+.2);$('.lf',p).style.transform=n>=1?'scale(1)':'scale(0)';$('.fl2',p).style.transform=n>=tot?'scale(1)':'scale(0)';if(n>=tot){burst(p,50);sfx.yay()}}
function wireChat(el,s){const th=$('[data-thread]',el),msgs=JSON.parse(th.dataset.thread);let k=0;const nb=$('[data-nextmsg]',el),pb=$('[data-pin]',el);
  const add=()=>{if(k>=msgs.length)return;const m=msgs[k++];const ty=document.createElement('div');ty.className='msg in'+(m.r?' r':'');ty.innerHTML=`${av(m.who,'smile')}<div class="typing"><i></i><i></i><i></i></div>`;th.appendChild(ty);
    setTimeout(()=>{ty.innerHTML=`${av(m.who,'smile')}<div><div class="who">${NAMES[m.who]}</div><div class="bub ${m.r?'acc':''}">${m.t}</div></div>`;sfx.msg();while(th.children.length>4)th.firstChild.remove()},reduce?50:700);
    if(k>=msgs.length){nb.style.display='none';if(pb)pb.style.display=''}};
  add();nb.onclick=add;if(pb)pb.onclick=()=>{$('.pin',el).classList.add('show');pb.style.display='none';sfx.pop()}}
function wireRings(el,s){const nodes=$$('.node',el);let k=-1;const set=()=>$('[data-set]:not([hidden])',el)||el;const go=n=>{k=n;nodes.forEach((x,j)=>x.classList.toggle('on',j===k));$$('.row',set()).forEach((r,j)=>r.classList.toggle('on',j<=k));sfx.tap()};
  nodes.forEach((x,j)=>x.onclick=()=>go(j));$('[data-ringnext]',el).onclick=()=>{go((k+1)%nodes.length);if(k===nodes.length-1){const t=$('[data-step]',el);if(t&&s.step)setTimeout(()=>t.classList.add('show'),400)}};
  $$('.seg button',el).forEach(b=>b.onclick=()=>{const m=b.dataset.mode;$$('.seg button',el).forEach(x=>x.classList.toggle('on',x===b));$$('[data-set]',el).forEach(d=>d.hidden=d.dataset.set!==m);$('.rings',el).classList.toggle('neg',m==='neg');$('[data-ctr]',el).innerHTML=m==='neg'?'Negative<br>Circle':'Positive<br>Circle';$('.dial svg',el).animate([{transform:'rotateY(0)'},{transform:'rotateY(360deg)'}],{duration:800});k=-1;go(0)})}
function wireTags(el,s){$$('.tag',el).forEach(t=>t.onclick=()=>{if(t.classList.contains('sp')){t.classList.add('x');sfx.no();setTimeout(()=>$('[data-step]',el).classList.add('show'),500)}else{t.classList.toggle('on');sfx.pop()}})}
function wireProfiles(el,s){const sh=$('[data-sheet]',el);$$('.pro',el).forEach(p=>p.onclick=()=>{$$('.pro',el).forEach(x=>x.classList.toggle('on',x===p));const [n,d]=s.roles[+p.dataset.k];sh.classList.remove('empty');sh.innerHTML=`<div><b>${n}</b>${d}</div>`;sh.animate([{transform:'translateY(30px)',opacity:0},{transform:'none',opacity:1}],{duration:400,easing:'cubic-bezier(.2,1.4,.35,1)'});sfx.pop()})}
function wireScn(el,s){const st=$('[data-strip]',el),n=s.labels.length;let pos=0;const pick=k=>{$$('.sc',el).forEach((c,j)=>{c.classList.toggle('pick',j===k);c.classList.toggle('dim',j!==k)})};
  $('[data-spin]',el).onclick=()=>{const k=Math.floor(Math.random()*n);pos=(Math.floor(pos/n)+3)*n+k;if(pos>=n*6-1)pos=n*2+k;st.style.transition='none';st.style.transform=`translateY(${-(pos%n)*250}px)`;void st.offsetWidth;st.style.transition='';st.style.transform=`translateY(${-(n*4+k)*250}px)`;let t=0;const iv=setInterval(()=>{sfx.tap();if(++t>14)clearInterval(iv)},140);setTimeout(()=>{pick(k);sfx.yay()},2200)};
  $$('.sc',el).forEach((c,j)=>c.onclick=()=>{pick(j);sfx.pop()});$$('.lg',el).forEach(g=>g.onclick=()=>{g.classList.toggle('on');sfx.tap()})}
function wirePoll(el,s){const v=s.opts.map(()=>0);const draw=()=>{const tot=v.reduce((a,b)=>a+b,0)||1;$$('.popt',el).forEach((o,k)=>{$('i',o).style.width=(v[k]/tot*100)+'%';$('b',o).textContent=v[k]?Math.round(v[k]/tot*100)+'% · '+v[k]:'0'})};$$('.popt',el).forEach((o,k)=>o.onclick=()=>{v[k]++;draw();sfx.tap()});$('[data-preset]',el).onclick=()=>{v.fill(0);draw()}}
function wireBal(el){$$('[data-bal]',el).forEach(b=>b.onclick=()=>{if(b.classList.contains('go'))return;b.classList.add('go');sfx.tap();if(b.dataset.bal==='a'){setTimeout(()=>{b.classList.add('pop','done');tone(90,.4,'sawtooth',.08);burst(b,40)},2300)}else setTimeout(()=>{b.classList.add('done');sfx.yay()},1400)})}
function wireQA(el){$$('.chip',el).forEach(c=>c.onclick=()=>{c.classList.toggle('on');sfx.pop()})}
function wireGroup(el,s){const g=$('[data-grp]',el),a=$('[data-amy]',g),b=$('[data-include]',el);b.onclick=()=>{$$('.gm',g).forEach((m,k)=>{const an=(-90+k*72)*Math.PI/180;m.style.left=(310+205*Math.cos(an))+'px';m.style.top=(310+205*Math.sin(an))+'px'});a.classList.remove('out');a.innerHTML=av('amy','grin');$('[data-sys]',el).textContent='Maya added Amy to the group 🎉';$('[data-gc]',el).textContent='5 members';b.style.display='none';sfx.yay();burst(a,60)}}
function wirePlayer(el){let on=false,t=0,iv=null;const pb=$('[data-play]',el),bar=$('[data-pb]',el),pt=$('[data-pt]',el),pl=$('.player',el);pb.onclick=()=>{on=!on;pb.textContent=on?'❚❚':'▶';pl.classList.toggle('playing',on);if(on)iv=setInterval(()=>{t++;bar.style.width=Math.min(100,t/6)+'%';pt.textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0')},1000);else clearInterval(iv)};
  $$('[data-tl]',el).forEach(w=>{let n=0;const num=$('.tn',w);$('[data-p]',w).onclick=()=>{n++;num.textContent=n;sfx.pop()};$('[data-m]',w).onclick=()=>{n=Math.max(0,n-1);num.textContent=n}})}
function wireSign(el){const pad=$('.sigpad',el),cvs=$('canvas',pad),c=cvs.getContext('2d');const size=()=>{const r=cvs.getBoundingClientRect();cvs.width=r.width/scale;cvs.height=r.height/scale;c.lineCap='round';c.lineJoin='round';c.lineWidth=7;c.strokeStyle='#151520'};setTimeout(size,700);let d=false,last;const pt=e=>{const r=cvs.getBoundingClientRect();return[(e.clientX-r.left)/scale,(e.clientY-r.top)/scale]};
  cvs.onpointerdown=e=>{d=true;last=pt(e);cvs.setPointerCapture(e.pointerId);$('.ph2',pad).style.opacity=0};cvs.onpointermove=e=>{if(!d)return;const p=pt(e);c.beginPath();c.moveTo(...last);c.lineTo(...p);c.stroke();last=p};cvs.onpointerup=()=>d=false;$('[data-clr]',pad).onclick=()=>{c.clearRect(0,0,cvs.width,cvs.height);$('.ph2',pad).style.opacity=1}}
function wireRumor(el,s){const box=$('[data-rumor]',el),lines=JSON.parse(box.dataset.rumor);const P=[[160,330],[560,180],[960,380],[1360,170]];const people=['amy','maya','jordan','brittany'];let k=0,seen=1;
  const build=()=>{k=0;seen=1;box.querySelectorAll('.rp,.rbub').forEach(x=>x.remove());people.forEach((w,j)=>{const p=document.createElement('div');p.className='rp'+(j===0?' lit':'');p.style.left=P[j][0]+'px';p.style.top=P[j][1]+120+'px';p.innerHTML=av(w,'meh')+`<span class="seen">${NAMES[w]}</span>`;box.appendChild(p)});const b=document.createElement('div');b.className='rbub';b.innerHTML=`<small>Original</small>${lines[0]}`;b.style.left=P[0][0]+'px';b.style.top=P[0][1]+40+'px';box.appendChild(b);$('[data-seen]',box).textContent=1;$('[data-rcap]',el).style.opacity=0};
  build();$('[data-fwd]',el).onclick=()=>{if(k>=people.length-1)return;k++;const b=$('.rbub',box);b.style.left=P[k][0]+'px';b.style.top=P[k][1]+40+'px';b.innerHTML=`<small>${'Forwarded '+'↪'.repeat(k)}${k>=2?' · forwarded many times':''}</small>${lines[k]}`;b.style.filter=`blur(${k*.3}px)`;$$('.rp',box)[k].classList.add('lit');seen=[1,4,23,187][k];const sv=$('[data-seen]',box);sv.animate([{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:400});sv.textContent=seen;sfx.msg();if(k===people.length-1){setTimeout(()=>$('[data-rcap]',el).style.opacity=1,600)}};$('[data-rreset]',el).onclick=build}
function wireSwipe(el,s){const st=$('[data-stack]',el),fb=$('[data-fb]',el);let q=s.items.slice();const binL=$('[data-binl]',el),binR=$('[data-binr]',el);
  const draw=()=>{st.innerHTML='';q.slice().reverse().forEach(([t])=>{const c=document.createElement('div');c.className='swc';c.innerHTML=`${t}<small>Swipe or tap a side</small>`;st.appendChild(c)});if(!q.length){st.innerHTML='<div class="swc" style="cursor:default">🎉<small>All sorted! Choices matter.</small></div>';confetti(960,500,150);sfx.yay()}bind()};
  const decide=side=>{if(!q.length)return;const [t,ok]=q[0];const c=st.lastElementChild;c.style.transform=`translateX(${side==='r'?700:-700}px) rotate(${side==='r'?25:-25}deg)`;c.style.opacity=0;const right=side===ok;fb.textContent=right?`✅ Right! ${ok==='r'?s.right[0]:s.left[0]} ${t.toLowerCase()}.`:`🤔 Hmm… that one belongs to ${ok==='r'?s.right[0]:s.left[0]}.`;right?sfx.pop():sfx.no();const it=document.createElement('div');it.className='it';it.textContent=(ok==='r'?'✔ ':'✘ ')+t;(ok==='r'?binR:binL).appendChild(it);q.shift();setTimeout(draw,400)};
  const bind=()=>{const c=st.lastElementChild;if(!c||!q.length)return;let sx=null,dx=0;c.onpointerdown=e=>{sx=e.clientX;c.setPointerCapture(e.pointerId);c.style.transition='none'};c.onpointermove=e=>{if(sx==null)return;dx=(e.clientX-sx)/scale;c.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`};c.onpointerup=()=>{if(sx==null)return;sx=null;c.style.transition='';if(Math.abs(dx)>160)decide(dx>0?'r':'l');else c.style.transform='';dx=0}};
  $('[data-sl]',el).onclick=()=>decide('l');$('[data-sr]',el).onclick=()=>decide('r');draw()}
function wireSG(el){const L3=$$('.tlight i',el);$$('.lg',el).forEach((g,k)=>g.onclick=()=>{const on=!g.classList.contains('on');$$('.lg',el).forEach(x=>x.classList.remove('on'));L3.forEach(x=>x.classList.remove('on'));if(on){g.classList.add('on');L3[k].classList.add('on');tone([300,500,700][k],.15,'triangle',.06)}})}
function wireTgt(el){const t=$('[data-tgt]',el);t.onclick=()=>{t.classList.remove('hit');void t.offsetWidth;t.classList.add('hit');setTimeout(()=>{tone(150,.2,'square',.06);burst(t,60);$('[data-step]',el).classList.add('show')},500)}}
function wireMap(el){const m=$('[data-map]',el),car=$('[data-car]',m),route=$('[data-route]',m);$('[data-drive]',m).onclick=()=>{route.style.strokeDashoffset=0;const path=m.querySelector('path[id^=route]'),len=path.getTotalLength(),t0=performance.now(),D=3000;const step=t=>{const k=Math.min(1,(t-t0)/D),p=path.getPointAtLength(len*k);car.style.left=p.x/9+'%';car.style.top=p.y/6.4+'%';$$('[data-pin]',m).forEach((pn,j)=>pn.classList.toggle('on',k>=[.33,.62,.97][j]));if(k<1)requestAnimationFrame(step);else{burst(car,60);sfx.yay()}};requestAnimationFrame(step);sfx.pop()}}
function wireStairs(el){const s=$('[data-stairs]',el),cl=$('[data-cl]',s),bars=$$('i',s);let k=-1;s.onclick=()=>{k=(k+1)%9;if(k===8){k=-1;bars.forEach(b=>b.classList.remove('on'));cl.style.left='0px';cl.style.bottom='0px';return}bars.forEach((b,j)=>b.classList.toggle('on',j<=k));const b=bars[k];cl.style.left=(b.offsetLeft+b.offsetWidth/2-55)+'px';cl.style.bottom=b.offsetHeight+'px';sfx.pop();if(k===7){burst(cl,60);sfx.yay()}}}
function wireTimer(el){const T=$('[data-timer]',el),base=+T.dataset.timer;let left=base,iv=null,rd=1;const tv=$('[data-tv]',T),arc=$('.arc',T),go=$('[data-tgo]',T);const draw=()=>{tv.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');arc.style.strokeDashoffset=276.5*(1-left/base);$('[data-rd]',T).textContent='Rotation '+rd};
  const stop=()=>{clearInterval(iv);iv=null;go.textContent='▶ Start'};go.onclick=()=>{if(iv){stop();return}if(left<=0)left=base;T.classList.remove('done');go.textContent='❚❚ Pause';iv=setInterval(()=>{left--;draw();if(left<=3&&left>0)tone(880,.1,'square',.05);if(left<=0){stop();T.classList.add('done');sfx.yay();toast('⏰ Time! Rotate to the next station')}},1000)};
  $('[data-tre]',T).onclick=()=>{stop();left=base;rd=1;T.classList.remove('done');draw()};$('[data-tnext]',T).onclick=()=>{stop();left=base;rd++;T.classList.remove('done');draw();sfx.pop()};draw()}
function wireSwap(el){const rows=$$('.xr',el);const on=r=>{if(r.classList.contains('on'))return;r.classList.add('on');sfx.pop();burst(r.querySelector('.xg'),30);if(rows.every(x=>x.classList.contains('on'))){setTimeout(()=>{confetti(960,500,140);sfx.yay()},400)}};rows.forEach(r=>r.onclick=()=>on(r))}
function wireQuote(el){const sm=$('[data-smile]',el);if(sm)sm.onclick=()=>{sm.animate([{transform:'rotate(0) scale(1)'},{transform:'rotate(360deg) scale(1.2)'},{transform:'rotate(360deg) scale(1)'}],{duration:800,easing:'cubic-bezier(.2,1.4,.35,1)'});burst(sm,40);sfx.yay()}}
/* ---------- tools (dock) ---------- */
function openTool(t){const sh=$('#toolsh');const close='<button class="btn ghost sm" data-close>Done</button>';
  if(t==='timer')sh.innerHTML=`<div class="grab"></div><h3>⏱️ Timer ${close}</h3><div class="tclock" data-timer="120" style="padding:0"><div class="tring" style="width:360px;height:360px"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="7"/><circle class="arc" cx="50" cy="50" r="44" fill="none" stroke="#FF9F0A" stroke-width="7" stroke-linecap="round" stroke-dasharray="276.5"/></svg><span class="rd" data-rd style="top:90px">Round 1</span><span class="tv" data-tv style="font-size:96px">2:00</span></div><div style="display:flex;gap:20px"><button class="btn" style="background:var(--green)" data-tgo>▶ Start</button><button class="btn ghost" data-tre>↺</button><button class="btn ghost" data-tnext>Next round ▸</button></div></div>`;
  if(t==='pick')sh.innerHTML=`<div class="grab"></div><h3>🎲 Random picker ${close}</h3><div style="display:flex;flex-direction:column;align-items:center;gap:30px"><div class="bignum" data-pv style="font-size:260px">?</div><div style="display:flex;gap:16px">${[4,6,8,10].map(n=>`<button class="btn ghost" data-pn="${n}">1–${n}</button>`).join('')}</div></div>`;
  if(t==='breathe')sh.innerHTML=`<div class="grab"></div><h3>🫁 Breathe ${close}</h3><div style="display:flex;flex-direction:column;align-items:center">${widget({w:'breathe'}).replace('rise','')}</div>`;
  if(t==='poll')sh.innerHTML=`<div class="grab"></div><h3>📊 Quick poll ${close}</h3>`+R.poll({q:'Thumbs up or thumbs down?',opts:[['👍','Thumbs up'],['🤷','Not sure'],['👎','Thumbs down']],t:''},{n:0},0).replace(/^[\s\S]*?<div class="body">/,'').replace(/<\/div>$/,'');
  $('#tool').classList.add('on');const scr=document.createElement('div');
  if(t==='timer')wireTimer(sh);if(t==='breathe')wireWidgets(sh);if(t==='poll')wirePoll(sh,{opts:[1,2,3]});
  if(t==='pick')$$('[data-pn]',sh).forEach(b=>b.onclick=()=>{const v=$('[data-pv]',sh);let k=0;const iv=setInterval(()=>{v.textContent=1+Math.floor(Math.random()*+b.dataset.pn);sfx.tap();if(++k>15){clearInterval(iv);sfx.yay();burst(v,50)}},70)});
  $('[data-close]',sh).onclick=()=>$('#tool').classList.remove('on')}
$('#tool').onclick=e=>{if(e.target.id==='tool')$('#tool').classList.remove('on')};
/* ---------- input ---------- */
$('#homebar').onclick=showHome;$('#edgeL').onclick=prev;$('#edgeR').onclick=next;$('#bHome').onclick=showHome;$('#bPrev').onclick=prev;$('#bNext').onclick=next;
const fs=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};$('#bFs').onclick=fs;
addEventListener('keydown',e=>{const k=e.key,onB=e.target.closest&&e.target.closest('button');if($('#tool').classList.contains('on')&&k==='Escape'){$('#tool').classList.remove('on');return}
  if(!cur){const n=+k;if(n>=1&&n<=6)openLesson(n,0,$$('.app .ic')[n-1]);if(k==='Enter'&&!onB)$('#contBtn').click();if(k==='f'||k==='F')fs();return}
  if(k==='ArrowRight'||k==='PageDown'||(k===' '&&!onB)){e.preventDefault();next()}else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev()}else if(k==='Escape'||k==='h'||k==='H')showHome();else if(k==='f'||k==='F')fs();else if(k==='Home')show(0);else if(k==='End')show(cur.slides.length-1)});
let tx=null,ty=null;stage.addEventListener('touchstart',e=>{if(e.target.closest('canvas,.swc'))return tx=null;tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy))(dx<0?next:prev)();else if(dy<-120&&cur&&cur.slides[idx].type==='lock')next();tx=null},{passive:true});
let idle;const wake=()=>{$('#bar').classList.remove('dim');clearTimeout(idle);idle=setTimeout(()=>$('#bar').classList.add('dim'),3000)};addEventListener('mousemove',wake);addEventListener('touchstart',wake,{passive:true});wake();
/* ---------- boot ---------- */
clock();const m=(location.hash||'').match(/^#l(\d)-(\d+)/);if(m){showHome();openLesson(+m[1],+m[2]-1,null)}else showHome();
window.__pa={show:i=>show(i),open:(n,i)=>openLesson(n,i,null),home:showHome};
})();
