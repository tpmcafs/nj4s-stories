<meta charset="utf-8">
<title>Kai's Week Corner Walk</title>
<style>
/* Layout: one projector "slide" (1280x720) scaled to fit any window, so nothing ever scrolls. HUD on top (wordmark, day pips, Class Bank), the round in the middle (scene + four corners on the left, Kai's jar + meters on the right), slim facilitator controls at the bottom. Same single dark streaming look as Kai's Mission File, so the season reads as one show. */
:root{
  --bg:#03111D; --panel:#0B2742; --panel-2:#0F4A73; --line:rgba(234,244,246,.14);
  --fg:#EAF4F6; --muted:#9FB3C2;
  --red:#FF6B5B; --red-deep:#E2564A; --gold:#F1DFC0; --gold-deep:#BFA57A;
  --green:#18A0AE; --green-deep:#0F6F7A; --teal:#8ec3d6; --violet:#b98cff; --orange:#ff9a3d; --pink:#ff6b81;
  --q1:#ff9a3d; --q2:#18A0AE; --q3:#b98cff; --q4:#ff6b81;
  --display:'Unbounded','Manrope',system-ui,sans-serif;
  --body:'Manrope','Segoe UI',system-ui,sans-serif;
  --label:'Manrope','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:#0E3B5C;background:radial-gradient(ellipse at 50% 60%,#15527F 0%,#0E3B5C 40%,#0A2C45 78%,#03111D 100%);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;overflow:hidden;margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}

.app{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;display:grid;grid-template-rows:44px minmax(0,1fr) 40px;gap:10px;padding:12px 26px}

/* HUD */
.hud{display:flex;align-items:center;gap:22px;min-width:0}
.wordmark{display:block;height:40px;width:auto;flex:none;margin:0 -6px 0 -10px}
.ep{font-family:var(--label);font-weight:700;font-size:12.6px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.pips{display:flex;gap:6px}
.pips span{font-family:var(--label);font-weight:700;font-size:11.7px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);white-space:nowrap}
.pips span.done{border-color:var(--green-deep);color:var(--fg)}
.pips span.on{border-color:var(--red);background:#FF6B5B22;color:var(--fg)}
.hud .grow{flex:1}
.vault{display:flex;align-items:center;gap:10px}
.coin{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFF6E6,var(--gold) 55%,var(--gold-deep));color:#03111D;font-family:var(--display);font-size:12px;font-weight:700;text-transform:uppercase}
.vault .k{font-family:var(--label);font-weight:700;font-size:10.8px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);line-height:1}
.vault .v{font-family:var(--display);font-size:18px;line-height:1.05;font-variant-numeric:tabular-nums;font-weight:700;text-transform:uppercase}
.vault.bump .v{animation:bump .6s ease-out}
@keyframes bump{40%{transform:scale(1.25);color:var(--gold)}}

main{min-height:0;position:relative}
.screen{height:100%;display:grid;gap:28px;animation:enter .35s ease-out;min-width:0}
@keyframes enter{from{opacity:.3}to{opacity:1}}
.cols{grid-template-columns:minmax(0,1fr) 404px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0}
.col.mid{justify-content:center}

.eyebrow{font-family:var(--label);font-weight:700;font-size:13.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.eyebrow b{color:var(--red);font-weight:700}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.02em;line-height:1.05;text-wrap:balance;margin:0;text-transform:uppercase}
h1{font-size:62.4px}
h1 em{font-style:normal;color:var(--gold)}
h2{font-size:38.4px}
h3{font-size:20.4px}
.lede{font-size:24px;line-height:1.35;margin:0;max-width:40ch;text-wrap:pretty}
.lede b{color:var(--gold);font-weight:600}
.note{margin:0;font-size:17px;color:var(--muted);max-width:60ch}
.tagline{font-family:var(--display);font-size:19.2px;letter-spacing:.02em;border-left:4px solid var(--red);padding-left:14px;margin:0;max-width:34ch;text-wrap:balance;font-weight:700;text-transform:uppercase}
.when{font-family:var(--label);font-weight:700;font-size:16.2px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}

/* Round */
.story{font-size:22px;line-height:1.34;margin:0;max-width:52ch;text-wrap:pretty}
.story b{color:var(--gold);font-weight:600}
.story .kai{font-family:var(--label);font-weight:700;letter-spacing:.12em;color:var(--red);font-size:16.2px;margin-right:6px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:84px;transition:border-color .2s,opacity .3s,background .2s}
.opt:hover:not(:disabled){border-color:var(--fg)}
.opt .l{display:grid;justify-items:center;gap:2px}
.opt .l b{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;color:var(--red);text-transform:uppercase}
.opt .l small{font-family:var(--label);font-weight:700;font-size:9.9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.opt .t{font-size:18px;font-weight:600;line-height:1.25;text-wrap:pretty}
.opt .tags{position:absolute;top:-11px;right:10px;display:flex;gap:6px}
.tg{font-family:var(--label);font-weight:700;font-size:11.7px;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:2px 10px;background:var(--bg);border:2px solid var(--qc,var(--line));color:var(--qc,var(--fg));white-space:nowrap}
.tg.money{--qc:var(--gold)}
.opt.shown{opacity:.6}
.opt.shown.best{opacity:1;border-color:var(--green)}
.opt.crowd{opacity:1;border-color:var(--gold);background:#F1DFC014}
.opt.crowd.best{border-color:var(--green);background:#18A0AE18}
.waiting{display:flex;align-items:center;gap:14px;border:1px dashed var(--line);border-radius:12px;padding:12px 16px}
.waiting .walk{font-family:var(--display);font-size:21.6px;line-height:1;color:var(--gold);letter-spacing:.02em;font-weight:700;text-transform:uppercase}
.waiting p{margin:0;font-size:18px;color:var(--muted)}
.waiting p b{color:var(--fg)}

.result{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.result .r{margin:0;font-size:20px;font-weight:600;line-height:1.3;text-wrap:pretty}
.result .r small{display:block;font-family:var(--label);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-size:12.6px;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--label);font-weight:700;font-size:13.5px;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:3px 12px;border:2px solid var(--mc,var(--line));color:var(--mc,var(--fg));white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.bad{--mc:#FF6B5B} .chip.gold{--mc:var(--gold);background:#F1DFC014} .chip.good{--mc:var(--green)}
.bonus{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:2px solid var(--gold);border-radius:12px;padding:10px 14px;background:#F1DFC010}
.bonus div{flex:1 1 100%}
.bonus .coin{display:none}

.bonus b{display:block;font-family:var(--label);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:11.7px;color:var(--gold)}
.bonus p{margin:0;font-size:17px}
.bonus .n{font-family:var(--display);font-size:18px;color:var(--gold);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;text-transform:uppercase}

/* Quadrant grid (Sort It) */
.qgrid{display:grid;grid-template-columns:30px 1fr 1fr;grid-template-rows:24px 1fr 1fr;gap:8px}
.qgrid .ax{font-family:var(--label);font-weight:700;font-size:11.7px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:grid;place-items:center}
.qgrid .ax.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.qc{position:relative;border:2px solid var(--qc);border-radius:12px;padding:10px 12px;display:grid;gap:2px;background:var(--panel);align-content:start;min-height:112px;transition:opacity .3s,background .3s}
.qc .cl{font-family:var(--display);font-size:26.4px;line-height:1.05;color:var(--fg);font-weight:700;text-transform:uppercase}
.qc .qn{font-family:var(--label);font-weight:700;font-size:11.7px;letter-spacing:.06em;text-transform:uppercase;color:var(--qc)}
.qc .nm{font-family:var(--display);font-size:14.4px;letter-spacing:.02em;color:var(--qc);line-height:1;font-weight:700;text-transform:uppercase}
.qc .crowd{position:absolute;top:8px;right:10px;font-family:var(--label);font-weight:700;font-size:10.8px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.qc.dim{opacity:.35}
button.qc{font:inherit;color:inherit;text-align:left}
.qc.click:hover{border-color:var(--fg)}
.qc.right{background:color-mix(in srgb,var(--qc) 18%,var(--panel))}
.qgrid.big .qc{min-height:150px}
.qgrid.big .qc .cl{font-size:36px}
.qgrid.big .qc .nm{font-size:18px}
.q1{--qc:var(--q1)} .q2{--qc:var(--q2)} .q3{--qc:var(--q3)} .q4{--qc:var(--q4)}
.scenario{font-size:34px;font-weight:600;line-height:1.22;margin:0;text-wrap:balance;max-width:28ch}
.whybox{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.whybox p{margin:0;font-size:20px;line-height:1.35}
.whybox b{font-family:var(--label);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green);font-size:13.5px;margin-right:6px}

/* Jar + meters */
.jarbox{display:grid;gap:6px}
.jarbox .k{font-family:var(--label);font-weight:700;font-size:11.7px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.jarbox .k b{color:var(--gold);font-variant-numeric:tabular-nums}
.jar{width:404px;height:300px;border-radius:10px;border:2px solid var(--line);background:var(--panel);overflow:hidden}
.jar svg{width:100%;height:100%;display:block}
.meters{display:grid;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.meter{display:grid;grid-template-columns:150px minmax(0,1fr) 26px;align-items:center;gap:10px}
.meter .nm{font-family:var(--label);font-weight:700;font-size:12.6px;letter-spacing:.12em;text-transform:uppercase;color:var(--mc);line-height:1.05}
.meter .nm small{display:block;font-weight:600;font-size:12px;letter-spacing:.08em;color:var(--muted)}
.meter .cells{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.meter .cells i{height:11px;border-radius:2px;background:var(--panel-2);transition:background .4s}
.meter .cells i.on{background:var(--mc)}
.meter .v{font-family:var(--display);font-size:14.4px;line-height:1;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;text-transform:uppercase}
.m-b{--mc:var(--green)} .m-g{--mc:#66abff} .m-s{--mc:#ffb84d}

/* Cards */
.card{border-radius:12px;padding:14px 18px;display:grid;gap:8px;background:var(--panel);border:1px solid var(--line)}
.card h4{margin:0;font-family:var(--label);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12.6px;color:var(--muted)}
.card p{margin:0;font-size:18px;line-height:1.35}
.mcard{background:#EAF4F6;color:#03111D;border-radius:6px;padding:16px 22px;display:grid;gap:6px;box-shadow:0 18px 50px #03111D77;transform:rotate(-1deg)}
.mcard .k{font-family:var(--display);color:#0E3B5C;letter-spacing:.02em;font-size:12px;font-weight:700;text-transform:uppercase}
.mcard .body{font-family:var(--display);font-size:18px;line-height:1.02;letter-spacing:.02em;text-wrap:balance;font-weight:700;text-transform:uppercase}
.mcard .body u{text-decoration:none;background:#F1DFC0;padding:0 4px}
.rocklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin:0;padding:0;list-style:none}
.rocklist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:17px;line-height:1.25}
.rocklist i{width:14px;height:14px;border-radius:4px;background:var(--rc);margin-top:4px}
.rocklist b{font-family:var(--label);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12.6px;color:var(--rc);display:block}
.rocklist span.from{display:block;font-size:14px;color:var(--muted)}

.btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:11px 20px;font-family:var(--label);font-weight:700;font-size:16.2px;letter-spacing:.12em;text-transform:uppercase}
.btn:hover:not(:disabled){border-color:var(--fg)}
.btn.primary{background:var(--red);border-color:var(--red);color:#03111D}
.btn.primary:hover{background:#E2564A}
.btn.big{font-size:22px;padding:13px 26px}
.btn.ghost{background:none}
.btn.sm{font-size:14px;padding:6px 12px}
.btn.warn{border-color:#FF6B5B;color:#FF6B5B}
.btn.lit{border-color:var(--gold);color:var(--gold)}
.btn.gold{border-color:var(--gold);color:var(--gold)}

/* Cut toggle */
.cut{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:max-content}
.cut button{border:0;background:none;padding:10px 16px;text-align:left;display:grid;gap:2px}
.cut button b{font-family:var(--label);font-weight:700;font-size:15.3px;letter-spacing:.12em;text-transform:uppercase}
.cut button span{font-size:14px;color:var(--muted)}
.cut button.on{background:var(--gold);color:#03111D}
.cut button.on span{color:#0E3B5C}

/* Rules + pay */
.rules{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:r}
.rules li{counter-increment:r;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:baseline;font-size:21px;line-height:1.3}
.rules li::before{content:counter(r);font-family:var(--display);font-size:20.4px;color:var(--gold);line-height:1;font-weight:700;text-transform:uppercase}
.rules li b{color:var(--gold);font-weight:600}
.paygrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.paygrid div{border:2px solid var(--qc);border-radius:10px;padding:8px 4px;display:grid;gap:2px;text-align:center}
.paygrid b{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.05;color:var(--qc);text-transform:uppercase}
.paygrid span{font-family:var(--label);font-weight:700;font-size:10.5px;letter-spacing:0;text-transform:none;color:var(--muted)}

/* Finale */
.tot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tot div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;gap:2px}
.tot span{font-family:var(--label);font-weight:700;font-size:11.7px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tot b{font-family:var(--display);font-weight:700;font-size:31.2px;line-height:1.05;color:var(--gold);font-variant-numeric:tabular-nums;text-transform:uppercase}
.tot div.wide{grid-column:1/-1}
.tot p{margin:0;font-size:15px;color:var(--muted)}
.qs{margin:0;padding-left:24px;display:grid;gap:8px;font-size:20px;line-height:1.3}
.charname{font-family:var(--display);font-size:55.2px;line-height:1.05;color:var(--qc);letter-spacing:.02em;font-weight:700;text-transform:uppercase}
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.counts div{border:2px solid var(--qc);border-radius:10px;padding:6px 10px;display:grid;gap:0}
.counts b{font-family:var(--display);font-weight:700;font-size:21.6px;line-height:1.05;color:var(--qc);text-transform:uppercase}
.counts span{font-family:var(--label);font-weight:700;font-size:10.8px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.counts div.win{background:color-mix(in srgb,var(--qc) 16%,var(--panel))}

/* Notes drawer */
.notes{position:absolute;z-index:5;left:0;right:0;bottom:6px;border:1px solid var(--gold);background:#0B2742;border-radius:10px;padding:10px 16px;display:grid;gap:4px;box-shadow:0 18px 50px #03111Daa}
.notes b{font-family:var(--label);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:11.7px;color:var(--gold)}
.notes p{margin:0;font-size:16px;line-height:1.4}

.controls{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:8px}
.controls .spacer{flex:1}
.keys{font-family:var(--label);font-weight:500;font-size:12.6px;letter-spacing:.06em;color:var(--muted)}
.keys kbd{font-family:var(--label);font-weight:700;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--fg)}

.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }


</style>

        <h1>Kai’s <em>Week</em></h1>
        <p class="lede">The Corner Walk. Kai has a mission now. This week, real life tries to knock the big rocks out of the jar. <b>You choose what Kai does by walking to a corner.</b></p>
        <div class="cut" role="group" aria-label="Length">${Object.entries(CUTS).map(([k, c]) => `<button data-act="cut" data-v="${k}" class="${state.cut === k ? 'on' : ''}" id="cut-${k}"><b>${c.label}</b><span>${c.sub}</span></button>`).join('')}</div>
        <div class="btns"><button class="btn primary big" data-act="start-full">Start in full screen</button><button class="btn big" data-act="next">Open in this window</button></div>
      </div>
      <div class="col mid">${jarBox(sim(), 'Kai’s jar on Sunday night')}</div>
    </section>`;
  }
  else if(it.t === 'how'){
    h = `<section class="screen cols">
      <div class="col mid">
        <div class="eyebrow"><span><b>How it works</b> · The Corner Walk</span></div>
        <ol class="rules">
          <li><span>Four corners: <b>A, B, C, D</b>. Every round has four choices, one per corner.</span></li>
          <li><span>Walk to the corner of what <b>you</b> would do. Not where your friends are going.</span></li>
          <li><span>The reveal shows which <b>character</b> each corner was, and what it pays.</span></li>
          <li><span>Write your corner’s H$ on your <b>Week Card</b>. The Banker pays at Checkout.</span></li>
          <li><span>The <b>biggest crowd</b> decides what Kai does. Watch the jar.</span></li>
          <li><span>Say a “no with a smile” line out loud for Kai: <b>H$1</b> from the Banker. Volunteers only.</span></li>
        </ol>
        ${nextBtn('Warm-up: Sort it')}
      </div>
      <div class="col mid">
        <div class="card"><h4>Every corner pays something</h4>
          <div class="paygrid">${[[2,4],[1,3],[3,2],[4,1]].map(([q, v]) => `<div class="${Q[q].cls}"><b>H$${v}</b><span>${Q[q].name.replace('The ','')}</span></div>`).join('')}</div>
          <p class="note" style="font-size:15px">Most days. The closer your corner is to the Prioritizer, the more it pays.</p>
        </div>
        <div class="card"><h4>Class Bank</h4><p><b style="color:var(--gold)">+H$5</b> every time the biggest crowd stands in the Prioritizer corner.</p><p><b style="color:var(--gold)">+H$2</b> for every warm-up the crowd gets right.</p></div>
      </div>
    </section>`;
  }
  else if(it.t === 'sortIntro'){
    h = `<section class="screen cols" style="grid-template-columns:minmax(0,1fr) 560px">
      <div class="col mid">
        <div class="eyebrow"><span><b>Warm-up</b> · Sort it</span></div>
        <h2>Which quadrant does it belong in?</h2>
        <p class="lede">For the warm-up, the corners <b>are</b> the quadrants. I read a situation. You walk to where it belongs right now.</p>
        <p class="note">Urgent means it’s due now or it’s buzzing at you. Important means it matters to your mission and your goals.</p>
        <div class="btns">${nextBtn('First situation')}</div>
      </div>
      <div class="col mid">${qgrid({big:true})}</div>
    </section>`;
  }
  else if(it.t === 'sort'){
    const sc = SORTS.find(x => x.id === it.id), L = state.sort[it.id], done = !!L;
    const n = S.filter(x => x.t === 'sort').findIndex(x => x.id === it.id) + 1;
    const right = done && sc.a.includes(SORT_CORNER[L]);
    h = `<section class="screen cols" style="grid-template-columns:minmax(0,1fr) 520px">
      <div class="col mid">
        <div class="eyebrow"><span><b>Sort it</b> · ${n} of ${t.sorts}</span></div>
        <p class="scenario">${esc(sc.t)}</p>
        ${done ? `<div class="whybox pop"><p><b>Why</b>${esc(sc.why)}</p></div>
          <div class="chips pop">${right ? '<span class="chip gold">Crowd got it · Class Bank +H$2</span>' : `<span class="chip">The crowd went to ${L}. The answer is lit up.</span>`}</div>
          <div class="btns">${nextBtn(n < t.sorts ? 'Next situation' : 'Kai’s week')}</div>`
        : `<div class="waiting"><span class="walk">Walk.</span><p>Go to the quadrant where it belongs. Then press the letter with <b>the biggest crowd</b>, or click its box.</p></div>`}
      </div>
      <div class="col mid">${qgrid({crowd:L, answer:done ? sc.a : null, click:!done})}</div>
    </section>`;
  }
  else if(it.t === 'week'){
    const first = S.find(x => x.t === 'day'), fd = DBY[first.id];
    h = `<section class="screen cols">
      <div class="col mid">
        <div class="eyebrow"><span><b>Previously on Habits Plus</b> · Sunday night</span></div>
        <div class="mcard"><span class="k">KAI’S MISSION · FROM EPISODE 3</span><span class="body">My mission is to be honest, brave and reliable, and to be someone my friends and family can <u>count on</u>.</span></div>
        <p class="lede" style="font-size:22px">Kai circled <b>count on</b>. Every big rock in the jar comes from that mission. Now the week happens.</p>
        <ul class="rocklist">${ROCKS.map(r => `<li style="--rc:${r.c}"><i></i><span><b>${r.role}</b>${esc(r.n)}<span class="from">${esc(r.from)}</span></span></li>`).join('')}</ul>
        <div class="btns">${nextBtn(fd.day + (state.cut === 'short' ? ', ' + fd.time : ''))}</div>
      </div>
      <div class="col mid">${jarBox(sim(), 'Kai’s jar: big rocks first')}</div>
    </section>`;
  }
  else if(it.t === 'day'){
    const d = DBY[it.id], s = sim(it.id), done = state.crowd[it.id] != null;
    const opts = s.opts, ord = order(d.id, s.vk);
    const lg = done ? s.log[it.id] : null;
    const pre = s.pre || snapshot(s);
    const cards = ord.map((oi, slot) => {
      const o = opts[oi], q = o[1], isCrowd = done && lg.slot === slot;
      const cls = done ? ` shown${q === 2 ? ' best' : ''}${isCrowd ? ' crowd' : ''}` : '';
      const tags = done ? `<span class="tags"><span class="tg ${Q[q].cls}">Q${q} · ${Q[q].name.replace('The ','')}</span><span class="tg money">H$${o[2]}</span></span>` : '';
      return `<button class="opt${cls}" data-act="crowd" data-slot="${slot}"${done ? ' disabled' : ''}><span class="l"><b>${L4[slot]}</b><small>Corner</small></span><span class="t">${esc(o[0])}</span>${tags}</button>`;
    }).join('');
    let after = '', bonusHTML = '';
    if(done){
      const fx = lg.fx, chips = [];
      chips.push(`<span class="chip ${Q[lg.o[1]].cls}" style="--mc:var(--qc)">Kai played ${Q[lg.o[1]].name}</span>`);
      for(const [k, n] of [['b','Battery'],['g','Grades'],['s','Squad']]) if(fx[k]) chips.push(`<span class="chip ${fx[k] > 0 ? 'good' : 'bad'}">${n} ${fx[k] > 0 ? '+' : '−'}${Math.abs(fx[k])}</span>`);
      if(lg.newLost) chips.push(`<span class="chip bad">Rock knocked out: ${RBY[lg.newLost].role}</span>`);
      if(lg.o[1] === 2) chips.push('<span class="chip gold">Class Bank +H$5</span>');
      after = `<div class="result pop"><p class="r"><small>The biggest crowd chose ${L4[lg.slot]}</small>${esc(lg.o[3])}</p><div class="chips">${chips.join('')}</div></div>`;
      if(d.smile){
        const n = state.smiles[it.id] || 0;
        bonusHTML = `<div class="bonus pop"><span class="coin">+1</span><div><b>Won’t power bonus</b><p>Say a “no with a smile” line for Kai, out loud. <b style="display:inline;color:var(--fg);letter-spacing:0;text-transform:none;font-family:var(--body);font-size:17px">H$1</b> from the Banker for each new line.</p></div><button class="btn sm ghost" data-act="smile" data-d="-1" aria-label="One fewer line">−</button><span class="n">${n}</span><button class="btn sm gold" data-act="smile" data-d="1">+1 line</button></div>`;
      }
      after += `<div class="btns">${nextBtn(nextDayLabel(it.id))}</div>`;
    } else {
      after = `<div class="waiting"><span class="walk">Walk.</span><p>Go to the corner of what <b>you</b> would do. Then press the letter with the biggest crowd.</p></div>`;
    }
    const retake = it.id === 'thu' && s.retake && s.retake.g ? `<span class="chip ${s.retake.g > 0 ? 'good' : 'bad'}" style="font-size:13px">Retake: Grades ${s.retake.g > 0 ? '+' : '−'}${Math.abs(s.retake.g)}</span>` : '';
    h = `<section class="screen cols">
      <div class="col">
        <div class="eyebrow"><span><b>Day ${dayIndex(it.id)}</b> of ${t.days}</span><span class="when">${esc(d.day)} · ${esc(d.time)}</span>${retake}</div>
        <p class="story"><span class="kai">KAI ·</span>${s.story}</p>
        <div class="opts">${cards}</div>
        ${after}
      </div>
      <div class="col">${jarBox(done ? {m:s.m, lost:s.lost} : pre)}${bonusHTML}</div>
    </section>`;
  }
  else if(it.t === 'final'){
    const s = t.sim, c = s.counts, played = [2,1,3,4].reduce((a, k) => c[k] > c[a] ? k : a, 2), kept = 6 - s.lost.length;
    h = `<section class="screen cols">
      <div class="col mid">
        <div class="eyebrow"><span><b>Who was Kai this week?</b></span><span>${kept} of 6 big rocks made it</span></div>
        <span class="charname ${Q[played].cls}">${Q[played].name}</span>
        <p class="lede" style="font-size:22px">${FINALE_LINES[played](kept)}</p>
        <p class="note">Where this quadrant leads: ${Q[played].leads}.</p>
        <div class="counts">${[2,1,3,4].map(k => `<div class="${Q[k].cls}${k === played ? ' win' : ''}"><b>${c[k]}</b><span>${Q[k].name.replace('The ','')}</span></div>`).join('')}</div>
        <ol class="qs">
          <li>Which day did a pebble almost knock out a big rock?</li>
          <li>Find a “no with a smile.” What did Kai say yes to instead?</li>
          <li>Look at the meters. Which one shows stress? Which shows relationships?</li>
          <li>Private: which big rock in <i>your</i> week keeps getting pushed out?</li>
        </ol>
        <div class="btns">${nextBtn('The bank')}</div>
      </div>
      <div class="col mid">${jarBox(s, 'Kai’s jar on Friday night')}</div>
    </section>`;
  }
  else if(it.t === 'wrap'){
    const interest = Math.floor(t.bank / 5);
    h = `<section class="screen cols" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
      <div class="col mid">
        <div class="eyebrow"><span><b>That’s a wrap</b> · The Corner Walk</span></div>
        <div class="tot">
          <div class="wide"><span>Class Bank earned</span><b>H$${t.bank}</b><p>${t.prio} Prioritizer crowd${t.prio === 1 ? '' : 's'} (H$${5 * t.prio}) + ${t.sortsRight} warm-up${t.sortsRight === 1 ? '' : 's'} sorted right (H$${2 * t.sortsRight}). At Checkout it earns H$1 for every H$5: about <b style="font-size:inherit;color:var(--fg);font-family:var(--body)">H$${interest}</b> more.</p></div>
          <div><span>Won’t power lines</span><b>${t.smiles}</b><p>H$1 each, paid by the Banker.</p></div>
          <div><span>Your Week Card</span><b>H$${t.days * 1}–${t.days * 4}</b><p>Add up your corners. Pay at Checkout.</p></div>
        </div>
        <p class="tagline">Habit 2 picks the big rocks. Habit 3 puts them in first.</p>
        <div class="btns"><button class="btn ghost" data-act="restart-now">Run it again</button></div>
      </div>
      <div class="col mid">
        <div class="eyebrow"><span><b>Up next</b> · The Won’t Power Wall</span></div>
        <h3>Friday at lunch, in Kai’s own words.</h3>
        <p class="lede" style="font-size:22px">“Skip 8th period with us. Nobody checks.” Write what Kai says on a sticky note:</p>
        <div class="paygrid" style="grid-template-columns:repeat(3,minmax(0,1fr))">
          <div class="q4"><b>No</b><span>Say it clearly</span></div>
          <div class="q1"><b>Why</b><span>Your big rock</span></div>
          <div class="q2"><b>Yes</b><span>A better offer</span></div>
        </div>
        <p class="note">No names. Stick it on the Wall.</p>
      </div>
    </section>`;
  }

  const n = NOTES[it.t];
  $('main').innerHTML = h + (showNotes && n ? `<aside class="notes pop" aria-label="Director's notes"><b>Director's notes</b><p>${esc(n)}</p></aside>` : '');
  if(it.t === 'final' && !state.fin){ state.fin = true; sfx.finale(); save(); }
}
function nextDayLabel(id){
  const S = seq(), k = S.findIndex(x => x.t === 'day' && x.id === id), nx = S[k + 1];
  if(nx && nx.t === 'day'){ const d = DBY[nx.id]; return d.id === 'wedn' ? 'Wednesday night' : d.day; }
  return 'Who was Kai this week?';
}

// ---------- Events ----------
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if(!el || el.disabled) return;
  if(el.tagName === 'BUTTON') el.blur();
  const a = el.dataset.act, wasConfirm = confirmRestart;
  if(a !== 'restart') confirmRestart = false;
  if(a === 'next') next();
  else if(a === 'start-full'){ fullscreen(); next(); }
  else if(a === 'back') back();
  else if(a === 'crowd') crowd(Number(el.dataset.slot));
  else if(a === 'smile') smile(Number(el.dataset.d));
  else if(a === 'cut'){ if(state.cut !== el.dataset.v){ state.cut = el.dataset.v; save(); render(); } }
  else if(a === 'notes'){ showNotes = !showNotes; render(); }
  else if(a === 'restart'){ if(!confirmRestart){ confirmRestart = true; render(); return; } stack = []; state = fresh(); go(); }
  else if(a === 'restart-now'){ const c = state.cut; stack = []; state = fresh(); state.cut = c; go(); }
  else if(a === 'sound'){ soundOn = !soundOn; render(); }
  else if(a === 'full') fullscreen();
  if(wasConfirm && a !== 'restart') render();
});
document.addEventListener('keydown', ev => {
  if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key.toLowerCase(), it = cur();
  if(k === 'n'){ showNotes = !showNotes; render(); return; }
  if(k === 'f'){ fullscreen(); return; }
  const waiting = (it.t === 'sort' && !state.sort[it.id]) || (it.t === 'day' && state.crowd[it.id] == null);
  if(waiting){
    const slot = {a:0, b:1, c:2, d:3, '1':0, '2':1, '3':2, '4':3}[k];
    if(slot != null){ ev.preventDefault(); crowd(slot); return; }
  }
  if(k === 'enter' || k === 'arrowright' || k === 'pagedown' || k === ' '){
    if(document.activeElement && document.activeElement.tagName === 'BUTTON' && (k === 'enter' || k === ' ')) return;
    ev.preventDefault(); next(); return;
  }
  if(k === 'z' || k === 'arrowleft' || k === 'pageup' || k === 'backspace'){ ev.preventDefault(); back(); }
});

function boot(data){
  const d = data && data.state ? data : load();
  if(d && d.state){ state = Object.assign(fresh(), d.state); stack = d.stack || []; if(state.i >= seq().length) state.i = 0; }
  render();
}
window.__hf = {get state(){ return state; }, totals, seq, sim, crowd, next, back, order};
try{ window.claude?.hot?.snapshot?.(() => ({state, stack})); }catch(e){}
const hot = window.claude?.hot;
if(hot?.ready) hot.ready(boot); else boot(hot?.data ?? {});
})();
</script>
