<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz: 7 Habits of Highly Effective Teens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#05086b; --navy-deep:#01022a; --navy-mid:#0a1597;
    --line:#ffffff; --cyan:#36b9f5;
    --green:#2fa84f; --green-deep:#1f7d38;
    --red:#d63a3a; --red-deep:#a32222;
    --cut:26px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:#fff;
    background:radial-gradient(ellipse at 50% 55%, #0b1aa8 0%, #050a6e 35%, #020338 70%, #01011c 100%);
    min-height:100vh; overflow-x:hidden;
    display:flex; flex-direction:column;
  }
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
  button:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}

  /* ---------- Hexagon (Millionaire-style) shapes ---------- */
  .hex{
    position:relative; display:flex; align-items:center;
    clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% 50%,calc(100% - var(--cut)) 100%,var(--cut) 100%,0 50%);
    background:var(--line);
    padding:0 calc(var(--cut) + 14px);
    z-index:1;
    transition:transform .15s ease;
  }
  .hex::before{
    content:""; position:absolute; inset:2px; z-index:-1;
    clip-path:polygon(calc(var(--cut) - 1px) 0,calc(100% - var(--cut) + 1px) 0,100% 50%,calc(100% - var(--cut) + 1px) 100%,calc(var(--cut) - 1px) 100%,0 50%);
    background:linear-gradient(180deg,#0a118a 0%,#05086b 55%,#03055a 100%);
    transition:background .2s ease;
  }
  .rail{position:relative;width:100%}
  .rail::before{
    content:""; position:absolute; left:0; right:0; top:50%; height:2px; background:var(--line);
    opacity:.85; transform:translateY(-1px);
  }

  /* ---------- Layout ---------- */
  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 24px 0; min-height:72px;
  }
  .brand img{height:52px;display:block}
  .tools{display:flex;gap:10px;align-items:center}
  .progress-text{font-size:14px;color:#b9c6ff;letter-spacing:.06em}
  .icon-btn{
    width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);
    display:grid;place-items:center;
  }
  .icon-btn:hover{background:rgba(255,255,255,.1)}
  .icon-btn svg{width:18px;height:18px}

  main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:12px 0 28px}
  .screen{display:none}
  .screen.active{display:block;animation:fadeIn .35s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* Start + end screens */
  .center{text-align:center;flex-direction:column;align-items:center}
  .screen.center.active{display:flex}
  .hero-logo{width:min(300px,70vw);margin-bottom:22px}
  h1{font-weight:500;letter-spacing:.12em;font-size:clamp(20px,3.4vw,34px);text-transform:uppercase}
  .sub{color:var(--cyan);margin-top:10px;font-size:clamp(14px,1.8vw,18px);letter-spacing:.04em}
  .start-rail{margin-top:48px}
  .start-rail::before{transform:rotate(-3deg)}
  .start-btn{
    margin:0 auto; height:76px; --cut:36px; justify-content:center;
    font-size:clamp(16px,2vw,22px); letter-spacing:.14em; text-transform:uppercase; padding:0 60px;
  }
  .start-btn:hover{transform:scale(1.04)}
  .start-btn:hover::before{background:linear-gradient(180deg,#1424b8,#0a118a)}
  .hint{margin-top:28px;font-size:13px;color:#8f9de0}
  kbd{font-family:inherit;border:1px solid rgba(255,255,255,.4);border-radius:4px;padding:0 6px;font-size:12px}

  /* Question screen */
  .q-rail{margin:0 0 34px}
  .question{
    width:min(860px,88vw); margin:0 auto; min-height:110px; --cut:40px; justify-content:center; text-align:center;
    font-size:clamp(18px,2.4vw,26px); font-weight:500; line-height:1.35; padding-top:18px; padding-bottom:18px;
  }
  .answers{
    width:100%; margin:0 auto;
    display:grid; grid-template-columns:1fr 1fr; grid-template-areas:"a c" "b d";
    row-gap:22px;
  }
  .ans-row{display:contents}
  .slot{position:relative;padding:0 10px}
  .slot::before{content:"";position:absolute;top:50%;height:2px;background:var(--line);opacity:.85;transform:translateY(-1px);left:0;right:0}
  .slot.a,.slot.b{padding:0 12px 0 max(24px,calc((100vw - 1000px)/2))}
  .slot.c,.slot.d{padding:0 max(24px,calc((100vw - 1000px)/2)) 0 12px}
  .slot.a{grid-area:a}.slot.b{grid-area:b}.slot.c{grid-area:c}.slot.d{grid-area:d}
  .answer{
    width:100%; min-height:62px; --cut:22px; text-align:left;
    font-size:clamp(15px,1.7vw,19px); gap:10px; padding-top:10px; padding-bottom:10px;
  }
  .answer .letter{color:var(--cyan);font-weight:600;flex:none}
  .answer:hover:not(.correct):not(.locked){transform:scale(1.02)}
  .answer:hover:not(.correct):not(.wrong):not(.locked)::before{background:linear-gradient(180deg,#1424b8,#0a118a)}
  .answer.wrong::before{background:linear-gradient(180deg,#e04848,var(--red-deep))}
  .answer.wrong .letter{color:#ffd5d5}
  .answer.wrong{animation:shake .4s ease}
  .answer.correct::before{background:linear-gradient(180deg,#3cc461,var(--green-deep))}
  .answer.correct .letter{color:#e5ffe9}
  .answer.correct{animation:pop .45s ease}
  .answer.locked{cursor:default}
  .answer.locked > span{opacity:.45}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}

  .after{
    margin:30px auto 0; width:min(860px,88vw); display:flex; flex-direction:column; align-items:center; gap:16px;
    min-height:60px;
  }
  .btn-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
  .pill{
    border-radius:999px; padding:10px 30px; font-weight:500; font-size:16px;
    background:var(--green); border:1.5px solid rgba(255,255,255,.75);
    box-shadow:0 4px 14px rgba(0,0,0,.3);
  }
  .pill:hover{background:#38bd5c}
  .pill.ghost{background:transparent;border-color:rgba(255,255,255,.5)}
  .pill.ghost:hover{background:rgba(255,255,255,.1)}
  .hidden{visibility:hidden}
  .gone{display:none!important}
  .why{
    background:rgba(5,10,90,.75); border:1px solid rgba(54,185,245,.5); border-radius:12px;
    padding:16px 20px; font-size:15px; line-height:1.55; color:#e3e9ff; text-align:left; width:100%;
    animation:fadeIn .3s ease;
  }
  .why strong{color:#7ee59a;font-weight:600}
  .why .session{display:block;margin-top:8px;font-size:13px;color:var(--cyan)}

  .dots{display:flex;gap:6px;justify-content:center;margin-top:26px}
  .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22)}
  .dot.done{background:var(--green)}
  .dot.now{background:#fff;transform:scale(1.3)}

  /* End screen */
  .well-done{font-size:clamp(40px,7vw,80px);font-weight:600;letter-spacing:.02em;
    background:linear-gradient(90deg,#fff,#9be7ff,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:pop .6s ease}
  .end-sub{margin-top:12px;color:#c9d3ff;font-size:clamp(15px,2vw,19px);max-width:620px;line-height:1.5}
  .end-actions{margin-top:36px}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

  @media (max-width:720px){
    :root{--cut:18px}
    .answers{grid-template-columns:1fr;grid-template-areas:"a" "b" "c" "d";row-gap:14px}
    .slot.a,.slot.b,.slot.c,.slot.d{padding:0 16px}
    .question{--cut:24px;min-height:96px}
    .brand img{height:40px}
    header{padding:12px 14px 0}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>

const QUESTIONS = [
  {q:"What are habits?",
   opts:{A:"Rules you live by",B:"How you see things",C:"Things we do repeatedly",D:"Goals for your future"}, ans:"C",
   why:"“You become what you repeatedly do.” Rules you live by = principles; how you see things = paradigms.",
   session:"Session 1: Introduction"},
  {q:"Which of these statements is proactive?",
   opts:{A:"“It’s not my fault”",B:"“Let’s look at our options”",C:"“There’s nothing I can do”",D:"“He made me do it”"}, ans:"B",
   why:"Proactive people think before they act and look for choices. The other three blame others or give up — that’s reactive.",
   session:"Session 2: Be Proactive (Buzzer Beater)"},
  {q:"Which tool helps you know right from wrong?",
   opts:{A:"Imagination",B:"Willpower",C:"Self-awareness",D:"Conscience"}, ans:"D",
   why:"Conscience: “I can listen to my inner voice to know right from wrong.” Self-awareness = observe your thoughts and actions; imagination = envision new possibilities; willpower = the power to choose.",
   session:"Session 2: Be Proactive (Just push pause)"},
  {q:"Habit 2, Begin with the End in Mind, means…",
   opts:{A:"Having a plan for your life",B:"Putting work before play",C:"Listening before you talk",D:"Taking charge of your life"}, ans:"A",
   why:"Decide where you want to go and draw a map to get there — like having the picture for the puzzle. The other answers are the mottos of Put First Things First, Seek First to Understand and Be Proactive.",
   session:"Sessions 1 and 3: Begin with the End in Mind"},
  {q:"A Personal Mission Statement…",
   opts:{A:"Must be a page long",B:"Can change over time",C:"Is written by others",D:"Must use only words"}, ans:"B",
   why:"It will change over time, just like you. It can be one word or a paragraph, only you should write it, and it can be expressed through art.",
   session:"Session 3: Personal Mission Statement"},
  {q:"Who starts an essay a week before it’s due?",
   opts:{A:"The Procrastinator",B:"The Slacker",C:"The Prioritizer",D:"The Yes-Man"}, ans:"C",
   why:"Quadrant 2 (important, not urgent): planning, goal setting, an essay due in a week. Procrastinator = urgent + important; Yes-Man = urgent, not important; Slacker = neither.",
   session:"Session 4: The Time Quadrants"},
  {q:"“Won’t power” is the strength to say NO to…",
   opts:{A:"Less important things",B:"Planning and goal setting",C:"Your top priorities",D:"Exercise and relaxation"}, ans:"A",
   why:"Willpower = the strength to say yes to your most important things. Won’t power = the strength to say no to the less important things.",

   why:"Deposits: keep promises, acts of kindness, be loyal, listen, apologize, set clear expectations. Gossip, broken promises and vague messages are withdrawals.",

  {q:"Think Win-Win is an attitude that says…",

   why:"Win-Win: “I can win, and so can you.” Win-lose = the Totem Pole, lose-win = the Door Mat, lose-lose = the Downward Spiral.",
   session:"Session 5: Think Win-Win"},
  {q:"How much of communication is in our words?",
   opts:{A:"93%",B:"7%",C:"40%",D:"53%"}, ans:"B",
   why:"Words are only 7%. Body language is 53% and tone and emotions are 40% — so listen with your eyes, heart and ears.",
   session:"Session 6: Seek First to Understand"},
  {q:"In genuine listening, “mirroring” means…",
   opts:{A:"Saying it in your own words",B:"Copying their exact words",C:"Giving them advice",D:"Judging what they say"}, ans:"A",
   why:"Mirroring = repeat back in your own words what the person is saying and feeling. Copying their exact words is mimicking (like a parrot).",

   session:"Session 7: Synergize"},

   opts:{A:"Wear yourself out",B:"Compete with everyone",C:"Renew yourself regularly",D:"Do everything perfectly"}, ans:"C",
   why:"Sharpen the Saw = renew yourself regularly and keep body, brain, heart and soul in balance (“Nothing overmuch”). “Wear yourself out” is the “highly defective” Habit 7.",
   session:"Sessions 1 and 8: Sharpen the Saw"}
];

const $ = id => document.getElementById(id);
const screens = {start:$("startScreen"), quiz:$("quizScreen"), end:$("endScreen")};
let idx = 0, solved = false, firstTry = 0, triedThisQ = false;

function show(name){
  Object.values(screens).forEach(s=>s.classList.remove("active"));
  screens[name].classList.add("active");
  $("brandSmall").style.visibility = name==="quiz" ? "visible" : "hidden";
  $("progressText").textContent = name==="quiz" ? `Question ${idx+1} of ${QUESTIONS.length}` : "";
}

function buildDots(){
  const d = $("dots"); d.innerHTML = "";
  QUESTIONS.forEach((_,i)=>{
    const s = document.createElement("span");
    s.className = "dot" + (i<idx ? " done" : i===idx ? " now" : "");
    d.appendChild(s);
  });
}

function render(){
  const item = QUESTIONS[idx];
  solved = false; triedThisQ = false;
  $("questionText").textContent = `${idx+1}. ${item.q}`;
  const wrap = $("answers"); wrap.innerHTML = "";
  ["A","B","C","D"].forEach(L=>{
    const slot = document.createElement("div");
    slot.className = "slot " + L.toLowerCase();
    const b = document.createElement("button");
    b.className = "hex answer"; b.dataset.letter = L;
    b.innerHTML = `<span class="letter">${L})</span><span class="txt"></span>`;
    b.querySelector(".txt").textContent = item.opts[L];
    b.addEventListener("click", ()=>choose(b));
    slot.appendChild(b); wrap.appendChild(slot);
  });
  $("nextBtn").classList.add("hidden");
  $("whyBtn").classList.add("hidden");
  $("whyBox").classList.add("gone");
  $("nextBtn").textContent = idx === QUESTIONS.length-1 ? "Finish" : "Next";
  buildDots();
  show("quiz");
}

function choose(btn){
  if (solved) return;
  const item = QUESTIONS[idx];
  const L = btn.dataset.letter;
  if (L === item.ans){
    solved = true;
    if (!triedThisQ) firstTry++;
    btn.classList.remove("wrong"); btn.classList.add("correct");
    document.querySelectorAll(".answer").forEach(b=>{ if(b!==btn) b.classList.add("locked"); });
    $("whyBtn").classList.remove("hidden");
    $("nextBtn").classList.remove("hidden");
    const box = $("whyBox");
    box.innerHTML = `<strong>Answer: ${item.ans}) </strong><span class="a"></span><br><span class="w"></span><span class="session"></span>`;
    box.querySelector(".a").textContent = item.opts[item.ans];
    box.querySelector(".w").textContent = item.why;
    box.querySelector(".session").textContent = "Taught in " + item.session;
    if (idx === QUESTIONS.length-1){ burst(); }
    else { miniBurst(btn); }
    $("nextBtn").focus({preventScroll:true});
  } else {
    triedThisQ = true;
    btn.classList.remove("wrong"); void btn.offsetWidth; // restart shake
    btn.classList.add("wrong");
  }
}

function next(){
  if (!solved) return;
  if (idx < QUESTIONS.length-1){ idx++; render(); }
  else finish();
}

function finish(){
  const n = QUESTIONS.length;
  $("endSub").textContent = `You found all ${n} answers — ${firstTry} on the first try. Keep practicing the 7 Habits!`;
  show("end");
  burst();
}

function start(){ idx = 0; firstTry = 0; render(); }

$("startBtn").addEventListener("click", start);
$("nextBtn").addEventListener("click", next);
$("againBtn").addEventListener("click", start);
$("confettiBtn").addEventListener("click", burst);
$("restartBtn").addEventListener("click", ()=>{ idx=0; firstTry=0; show("start"); });
$("whyBtn").addEventListener("click", ()=>{
  const box = $("whyBox"); box.classList.toggle("gone");
  $("whyBtn").textContent = box.classList.contains("gone") ? "Why?" : "Hide";
});
$("fsBtn").addEventListener("click", toggleFs);

function toggleFs(){
  try{
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen().catch(()=>{});
  }catch(e){}
}

document.addEventListener("keydown", e=>{
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (screens.start.classList.contains("active") && (k==="enter"||k===" ")) { e.preventDefault(); start(); return; }
  if (screens.quiz.classList.contains("active")){
    if (["a","b","c","d"].includes(k)){
      const b = document.querySelector(`.answer[data-letter="${k.toUpperCase()}"]`); if (b) choose(b);
    } else if ((k==="enter"||k==="arrowright"||k===" ") && solved){ e.preventDefault(); next(); }
    else if (k==="w" && solved){ $("whyBtn").click(); }
  }
  if (k==="f") toggleFs();
});

/* ---------- Confetti ---------- */
const cv = $("confetti"), cx = cv.getContext("2d");
let parts = [], running = false;
const COLORS = ["#36b9f5","#ffffff","#2fa84f","#ffd23f","#ff5d8f","#7b61ff","#ff9f1c"];
function resize(){ cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; }
addEventListener("resize", resize); resize();
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function spawn(x,y,count,spread,power){
  for(let i=0;i<count;i++){
    const ang = -Math.PI/2 + (Math.random()-.5)*spread;
    const v = power*(0.5+Math.random()*0.7);
    parts.push({x,y,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,
      w:6+Math.random()*7,h:4+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-.5)*0.3,
      c:COLORS[(Math.random()*COLORS.length)|0],life:0,max:160+Math.random()*90});
  }
  if(!running){running=true;requestAnimationFrame(tick);}
}
function burst(){
  if (reduced) return;
  const W = innerWidth, H = innerHeight;
  spawn(W*0.15,H,90,1.2,19); spawn(W*0.85,H,90,1.2,19);
  setTimeout(()=>spawn(W*0.5,H*0.9,120,2.2,17),250);
  setTimeout(()=>{ for(let i=0;i<120;i++) parts.push({x:Math.random()*W,y:-20-Math.random()*200,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,w:6+Math.random()*7,h:4+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-.5)*0.3,c:COLORS[(Math.random()*COLORS.length)|0],life:0,max:260}); },500);
}
function miniBurst(el){
  if (reduced) return;
  const r = el.getBoundingClientRect();
  spawn(r.left+r.width/2, r.top+r.height/2, 28, 2.6, 9);
}
function tick(){
  const d = devicePixelRatio;
  cx.clearRect(0,0,cv.width,cv.height);
  parts = parts.filter(p=>p.life<p.max && p.y<innerHeight+40);
  for(const p of parts){
    p.life++; p.vy += 0.32; p.vx *= 0.99; p.vy *= 0.99;
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    cx.save(); cx.translate(p.x*d,p.y*d); cx.rotate(p.rot);
    cx.globalAlpha = Math.max(0,1-p.life/p.max*0.6);
    cx.fillStyle = p.c; cx.fillRect(-p.w*d/2,-p.h*d/2,p.w*d,p.h*d*Math.abs(Math.cos(p.rot*1.7))+1);
    cx.restore();
  }
  if(parts.length) requestAnimationFrame(tick); else { running=false; cx.clearRect(0,0,cv.width,cv.height); }
}

show("start");
</script>
