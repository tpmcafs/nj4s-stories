<style>
/* Layout: one projector screen. Top HUD (wordmark, episode label, live meters), one central scene that holds its own Next button, a slim control bar. A single dark "streaming" look on purpose, shared with The Snooze Effect so the whole season reads as one show. */
:root{
  --bg:#0c0a0d;
  --panel:#17131a;
  --panel-2:#211b25;
  --line:#3a303d;
  --fg:#f6f0e9;
  --muted:#aba1a8;
  --red:#e5242c;
  --red-deep:#9e141a;
  --gold:#f2c14e;
  --gold-deep:#8a6a1c;
  --battery:#5ad491;
  --grades:#66abff;
  --squad:#ffb84d;
  --good:#5ad491;
  --warn:#ff9a3d;
  --bad:#ff6166;
  --violet:#b98cff;
  --teal:#8ec3d6;
  --display:'Bebas Neue','Oswald',Impact,'Arial Narrow',sans-serif;
  --body:'Barlow','Segoe UI',system-ui,sans-serif;
  --label:'Barlow Condensed','Arial Narrow',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;max-width:1480px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px}
.wordmark{font-family:var(--display);font-size:32px;letter-spacing:.04em;color:var(--red);line-height:1}
.ep{font-family:var(--label);font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.hud .grow{flex:1 1 40px}
.dots{display:flex;gap:4px;min-width:120px;max-width:300px;flex:1 1 160px}
.dots i{height:6px;border-radius:3px;background:var(--line);flex:1}
.dots i.done{background:var(--red-deep)}
.dots i.now{background:var(--red)}
.meters{display:flex;flex-wrap:wrap;gap:10px 22px}
.meter{display:grid;grid-template-columns:auto auto;align-items:center;gap:2px 10px}
.meter .name{font-family:var(--label);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--mc)}
.meter .val{font-family:var(--display);font-size:24px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.meter .cells{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:clamp(100px,10vw,160px)}
.meter .cells i{height:10px;border-radius:2px;background:var(--panel-2);transition:background .4s}
.meter .cells i.on{background:var(--mc)}
.meter.low .cells i.on{animation:blink 1.2s ease-in-out infinite}
.m-b{--mc:var(--battery)} .m-g{--mc:var(--grades)} .m-s{--mc:var(--squad)}
@keyframes blink{50%{opacity:.45}}

/* Stage */
main{min-height:0;overflow:auto;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding-block:8px;animation:enter .45s ease-out;min-width:0}
.screen.top{justify-content:flex-start}
@keyframes enter{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}
.eyebrow{font-family:var(--label);font-weight:600;font-size:clamp(14px,1.4vw,18px);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.eyebrow b{color:var(--red);font-weight:700}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;line-height:.92;text-wrap:balance;margin:0}
h1{font-size:clamp(56px,9.5vw,146px)}
h2{font-size:clamp(40px,6vw,88px)}
h3{font-size:clamp(28px,3vw,44px)}
.when{font-family:var(--label);font-weight:600;font-size:clamp(18px,2vw,26px);color:var(--squad);letter-spacing:.06em}
.lede{font-size:clamp(20px,2.3vw,32px);line-height:1.35;max-width:46ch;margin:0;text-wrap:pretty}
.lede.sm{font-size:clamp(17px,1.7vw,23px);color:var(--muted)}
.prompt{font-size:clamp(22px,2.6vw,36px);line-height:1.3;max-width:52ch;margin:0;text-wrap:pretty}
.tagline{font-family:var(--display);font-size:clamp(26px,3.2vw,44px);letter-spacing:.03em;border-left:4px solid var(--red);padding-left:16px;margin:0;max-width:32ch;text-wrap:balance}
.note{margin:0;font-size:clamp(16px,1.6vw,21px);color:var(--muted);max-width:62ch}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:36px;align-items:center}
.split.top{align-items:start}
.stack{display:grid;gap:18px;min-width:0}
.panel{display:grid;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;min-width:0}
.panel h4,.label{font-family:var(--label);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:15px;color:var(--muted);margin:0}
.panel ol,.panel ul{margin:0;padding-left:22px;display:grid;gap:8px;font-size:18px}
.legend{display:grid;gap:6px;font-size:15px;color:var(--muted)}
.legend span{font-family:var(--label);font-weight:700;letter-spacing:.1em;text-transform:uppercase}

/* Buttons */
.btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:12px 20px;font-family:var(--label);font-weight:700;font-size:18px;letter-spacing:.1em;text-transform:uppercase}
.btn:hover:not(:disabled){border-color:var(--fg)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover:not(:disabled){background:#f2333b}
.btn.big{font-size:clamp(18px,1.8vw,24px);padding:14px 28px}
.btn.ghost{background:none}
.btn.sm{font-size:14px;padding:6px 12px}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn.on{border-color:var(--squad);color:var(--squad)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1405}

/* Options (finger vote) */
.opts{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:start;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:clamp(14px,1.8vw,24px);transition:border-color .2s,transform .2s,background .2s}
.opt:hover:not(:disabled){border-color:var(--fg);transform:translateY(-2px)}
.opt .letter{grid-row:span 2;font-family:var(--display);font-size:clamp(44px,4.6vw,68px);line-height:.85;color:var(--red)}
.opt .choice{font-size:clamp(19px,2vw,28px);font-weight:600;line-height:1.25;text-wrap:pretty}
.opt .fingers{font-family:var(--label);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.opt:disabled{opacity:1;cursor:default}
.opt:disabled:hover{transform:none}
.opt.picked{border-color:var(--gold);background:#f2c14e14}
.opt.right{border-color:var(--good)}
.opt.wrong{opacity:.5}
.opt.right .fingers{color:var(--good)}
.opt .why{grid-column:2;font-size:clamp(15px,1.4vw,19px);color:var(--muted);margin-top:6px}
.vote-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.timer{font-family:var(--display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums;min-width:2ch;color:var(--squad)}
.timer-msg{font-family:var(--label);font-weight:600;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Result */
.chosen{font-size:clamp(17px,1.7vw,22px);color:var(--muted);margin:0;max-width:62ch}
.chosen b{color:var(--fg)}
.result{font-size:clamp(28px,3.6vw,52px);font-weight:600;line-height:1.2;max-width:30ch;margin:0;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-family:var(--label);font-weight:700;font-size:clamp(15px,1.5vw,21px);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:5px 15px;border:2px solid var(--mc,var(--line));color:var(--mc,var(--fg));font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.none{--mc:var(--muted)}
.chip.twist{--mc:var(--red);background:#e5242c1f}
.chip.pba-dep{--mc:var(--gold);background:#f2c14e14}
.chip.pba-wd{--mc:var(--violet)}
.pbabadge{display:grid;gap:2px;justify-items:end}
.pbabadge span{font-family:var(--label);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.pbabadge b{font-family:var(--display);font-size:30px;line-height:1;font-weight:400;font-variant-numeric:tabular-nums}
.chip.good{--mc:var(--good)} .chip.bad{--mc:var(--bad)} .chip.warn{--mc:var(--warn)} .chip.vio{--mc:var(--violet)} .chip.teal{--mc:var(--teal)}
.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}

/* Bank moment */
.bank{display:flex;gap:14px;align-items:flex-start;border:2px solid var(--gold);border-radius:12px;padding:14px 18px;background:#f2c14e12;max-width:70ch}
.bank .coin{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffe39a,var(--gold) 55%,var(--gold-deep));color:#2a1e05;font-family:var(--display);font-size:20px;box-shadow:0 0 0 3px #f2c14e33}
.bank b{display:block;font-family:var(--label);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:14px;color:var(--gold)}
.bank p{margin:2px 0 0;font-size:clamp(16px,1.5vw,20px)}

/* Season poster (carry-in) */
.poster{display:grid;gap:14px}
.steppers{display:flex;flex-wrap:wrap;gap:12px 26px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .name{font-family:var(--label);font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--mc);min-width:70px}
.stepper .v{font-family:var(--display);font-size:34px;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.stepper button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);font-size:20px;line-height:1}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tog{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 14px;font-family:var(--label);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tog.on{border-color:var(--red);color:var(--fg);background:#e5242c22}
.presets{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.preset{text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.preset b{font-family:var(--display);font-size:22px;font-weight:400;letter-spacing:.03em}
.preset span{font-size:13px;color:var(--muted)}
.preset.on{border-color:var(--red);background:#e5242c1a}
.posterline{font-family:var(--label);font-weight:600;font-size:17px;letter-spacing:.06em;display:flex;flex-wrap:wrap;gap:6px 16px}
.posterline span b{color:var(--gold);font-weight:700}

/* Controls */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.controls .spacer{flex:1}
.keys{font-family:var(--label);font-weight:500;font-size:14px;letter-spacing:.06em;color:var(--muted)}
.keys kbd{font-family:var(--label);font-weight:700;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--fg)}

.tag{font-family:var(--label);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border-radius:4px;padding:2px 7px;border:1px solid var(--mc,var(--line));color:var(--mc,var(--fg));white-space:nowrap}
.log{display:grid;gap:10px}
.log .pick{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline;font-size:16px}
.qs{margin:0;padding-left:24px;display:grid;gap:10px;font-size:clamp(17px,1.6vw,21px)}

@media (max-width:980px){ .opts.n3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:820px){
  .split,.split.top{grid-template-columns:1fr}
  .opts,.opts.n3{grid-template-columns:1fr}
  .keys{display:none}
  .wordmark{font-size:26px}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

.lots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.lot{position:relative;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:6px;align-content:start;min-height:122px;transition:transform .3s,border-color .3s,background .3s}
.lot .no{font-family:var(--display);font-size:30px;line-height:1;color:var(--red)}
.lot .nm{font-size:clamp(16px,1.5vw,21px);font-weight:600;line-height:1.2}
.lot .res{font-family:var(--label);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.lot.rock{border-color:var(--good);background:#5ad49114}
.lot.rock .res{color:var(--good)}
.lot.pebble{border-color:var(--squad);background:#ffb84d10}
.lot.pebble .res{color:var(--squad)}
.lot.sand{border-color:var(--line);opacity:.7}
.lot.sand .res{color:var(--muted)}
.lot.flip{animation:flip .6s ease-out}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:none}}
.lot.next{border-color:var(--fg);box-shadow:0 0 0 3px #f6f0e933}
.clock{font-family:var(--display);font-size:clamp(70px,9vw,130px);line-height:.9;color:var(--squad);font-variant-numeric:tabular-nums}
.hours{display:grid;gap:8px}
.hours .bar{display:grid;grid-template-columns:repeat(20,1fr);gap:4px}
.hours .bar i{height:26px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line)}
.hours .bar i.r{background:var(--good);border-color:var(--good)}
.hours .bar i.p{background:var(--squad);border-color:var(--squad);opacity:.7}
.hours .lbl{display:flex;justify-content:space-between;font-family:var(--label);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:15px;color:var(--muted)}
.big-reveal{display:grid;gap:12px;border:3px solid var(--rc);border-radius:16px;padding:clamp(20px,3vw,36px);background:var(--panel);max-width:760px;animation:flip .6s ease-out}
.big-reveal .k{font-family:var(--display);font-size:clamp(54px,7vw,104px);line-height:.9;color:var(--rc)}
.big-reveal .nm{font-size:clamp(24px,2.8vw,38px);font-weight:600;line-height:1.2}
.payout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.payout div{border:2px solid var(--gold);border-radius:12px;padding:16px;display:grid;gap:4px;background:#f2c14e10}
.payout b{font-family:var(--display);font-size:46px;font-weight:400;color:var(--gold);line-height:1}
.payout span{font-size:17px}
@media (max-width:980px){ .lots{grid-template-columns:repeat(3,minmax(0,1fr))} .payout{grid-template-columns:1fr} }
@media (max-width:620px){ .lots{grid-template-columns:repeat(2,minmax(0,1fr))} }
</style>

<script>
const HF = (() => {
  const LETTERS = ['A','B','C','D','E','F'];
  const clamp = (v, lo = 0, hi = 10) => Math.max(lo, Math.min(hi, v));
  const val = (x, s) => typeof x === 'function' ? x(s) : x;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function store(key){
    return {
      load(){ try{ const r = localStorage.getItem(key); return r ? JSON.parse(r) : null; }catch(e){ return null; } },
      save(v){ try{ localStorage.setItem(key, JSON.stringify(v)); }catch(e){} },
      clear(){ try{ localStorage.removeItem(key); }catch(e){} }
    };
  }

  // Fixed shuffle: the "best" choice moves around, but the order never changes between runs
  function order(seedNum, n){
    let seed = (seedNum * 97 + n * 31 + 7) % 233280;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const idx = Array.from({length:n}, (_, i) => i);
    for(let i = n - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    return idx;
  }

  // ---------- Sound (Web Audio, starts only after a click) ----------
  let ctx = null, soundOn = true;
  function ac(){ if(!soundOn) return null; try{ if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if(ctx.state === 'suspended') ctx.resume(); return ctx; }catch(e){ return null; } }
  function tone(f, d, type = 'sine', vol = .18, t0 = 0, slide = 0){
    const c = ac(); if(!c) return;
    const t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .02);
  }
  function noise(d, vol = .2, t0 = 0, hp = 800){
    const c = ac(); if(!c) return;
    const t = c.currentTime + t0, b = c.createBuffer(1, Math.floor(c.sampleRate * d), c.sampleRate), ch = b.getChannelData(0);
    for(let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    f.type = 'highpass'; f.frequency.value = hp; g.gain.value = vol; s.buffer = b; s.connect(f).connect(g).connect(c.destination); s.start(t);
  }
  const sfx = {
    ching(){ tone(1318, .12, 'triangle', .16); tone(1760, .5, 'triangle', .16, .08); noise(.18, .05, 0, 4000); },
    gavel(){ noise(.12, .5, 0, 200); tone(140, .18, 'square', .12); },
    unlock(){ tone(523, .12, 'triangle', .14); tone(659, .12, 'triangle', .14, .1); tone(784, .3, 'triangle', .16, .2); tone(1046, .5, 'triangle', .12, .32); },
    tick(){ tone(1200, .04, 'square', .05); },
    buzz(){ tone(180, .35, 'sawtooth', .08, 0, -60); },
    whoosh(){ noise(.35, .12, 0, 1500); },
    good(){ tone(660, .12, 'triangle', .14); tone(990, .25, 'triangle', .14, .1); },
    flip(){ tone(400, .08, 'triangle', .1, 0, 300); },
    bell(){ tone(880, 1.2, 'sine', .2); tone(1320, 1, 'sine', .08, .01); }
  };
  function setSound(on){ soundOn = on; }
  function soundState(){ return soundOn; }

  // ---------- Timer ----------
  function Timer(paint, onDone){
    const t = {id:null, left:0, total:0, done:false};
    t.start = sec => { t.stop(); t.total = sec; t.left = sec; t.done = false; paint(t);
      t.id = setInterval(() => { t.left--; if(t.left <= 5 && t.left > 0) sfx.tick(); if(t.left <= 0){ t.done = true; t.stop(true); sfx.buzz(); onDone && onDone(t); } paint(t); }, 1000); };
    t.stop = keep => { if(t.id){ clearInterval(t.id); t.id = null; } if(!keep){ t.left = 0; t.done = false; } };
    t.running = () => !!t.id;
    return t;
  }
  const mmss = s => `${Math.floor(Math.max(0,s) / 60)}:${String(Math.max(0,s) % 60).padStart(2, '0')}`;

  // ---------- Meters ----------
  const METERS = [['b','Battery','m-b'],['g','Grades','m-g'],['s','Squad','m-s']];
  function metersHTML(m){
    return METERS.map(([k,n,c]) => `<div class="meter ${c}${m[k] <= 3 ? ' low' : ''}" aria-label="${n} ${m[k]} of 10"><span class="name">${n}</span><span class="val">${m[k]}</span><div class="cells">${Array.from({length:10},(_,i)=>`<i class="${i < m[k] ? 'on' : ''}"></i>`).join('')}</div></div>`).join('');
  }
  function fxChips(fx){
    const out = [];
    for(const [k,n,c] of METERS) if(fx && fx[k]) out.push(`<span class="chip ${c} pop">${n} ${fx[k] > 0 ? '+' : '−'}${Math.abs(fx[k])}</span>`);
    return out.join('');
  }
  function applyFx(m, fx){ for(const [k] of METERS) if(fx && fx[k]) m[k] = clamp(m[k] + fx[k]); }

  // ---------- Season poster (Kai's story, carried episode to episode) ----------
  const TEAM = {made:'On the team', cut:'Tried out, not picked', none:'Didn’t try out'};
  const ENDS = {
    grades:{short:'Science grade to a B', long:'Get the science grade up to a B by winter break'},
    team:{short:'Earn a spot and keep it', long:'Earn a spot on the team, and stay eligible all season'},
    squad:{short:'Someone people can count on', long:'Be someone friends and family can count on again'},
    battery:{short:'Run on a full battery', long:'Sleep, eat and recharge like an athlete'}
  };
  const FLAGS = {forwarded:'Forwarded Dev’s photo', blamed:'Blamed Sam', told:'Told Mom the truth'};
  const freshPoster = () => ({b:5, g:5, s:5, team:'none', forwarded:false, blamed:false, told:false, end:null, character:null, deal:null, friend:null, escaped:null});

  function posterPanel(p, o = {}){
    const st = (k, n, c) => `<div class="stepper ${c}"><span class="name">${n}</span><button data-act="pst" data-k="${k}" data-d="-1" aria-label="${n} down">−</button><span class="v">${p[k]}</span><button data-act="pst" data-k="${k}" data-d="1" aria-label="${n} up">+</button></div>`;
    return `<div class="poster">
      ${o.presets ? `<div class="label">${o.presetLabel || 'Quick start'}</div><div class="presets">${o.presets.map((pr, i) => `<button class="preset${o.presetOn === i ? ' on' : ''}" data-act="ppreset" data-i="${i}"><b>${pr.name}</b><span>${pr.sub}</span></button>`).join('')}</div>` : ''}
      <div class="label">Kai's meters</div>
      <div class="steppers">${st('b','Battery','m-b')}${st('g','Grades','m-g')}${st('s','Squad','m-s')}</div>
      <div class="label">Tryouts</div>
      <div class="toggles">${Object.keys(TEAM).map(k => `<button class="tog${p.team === k ? ' on' : ''}" data-act="pteam" data-v="${k}">${TEAM[k]}</button>`).join('')}</div>
      <div class="label">Plot twists from the Snooze Effect</div>
      <div class="toggles">${Object.keys(FLAGS).map(k => `<button class="tog${p[k] ? ' on' : ''}" data-act="pflag" data-k="${k}">${FLAGS[k]}</button>`).join('')}</div>
      ${o.showEnd ? `<div class="label">Kai's END from Episode 3</div><div class="toggles">${Object.keys(ENDS).map(k => `<button class="tog${p.end === k ? ' on' : ''}" data-act="pend" data-v="${k}">${ENDS[k].short}</button>`).join('')}</div>` : ''}
    </div>`;
  }
  function presetsHTML(presets, on, label){
    return `<div class="label">${label || 'Quick start'}</div><div class="presets">${presets.map((pr, i) => `<button class="preset${on === i ? ' on' : ''}" data-act="ppreset" data-i="${i}"><b>${pr.name}</b><span>${pr.sub}</span></button>`).join('')}</div>`;
  }
  function posterAct(el, p){
    const a = el.dataset.act;
    if(a === 'pst'){ p[el.dataset.k] = clamp(p[el.dataset.k] + Number(el.dataset.d)); return true; }
    if(a === 'pteam'){ p.team = el.dataset.v; return true; }
    if(a === 'pflag'){ p[el.dataset.k] = !p[el.dataset.k]; return true; }
    if(a === 'pend'){ p.end = p.end === el.dataset.v ? null : el.dataset.v; return true; }
    return false;
  }
  function posterLine(p, extra = []){
    const bits = [
      `<span>Battery <b>${p.b}</b></span>`, `<span>Grades <b>${p.g}</b></span>`, `<span>Squad <b>${p.s}</b></span>`,
      `<span>Tryouts: <b>${TEAM[p.team]}</b></span>`
    ];
    if(p.end) bits.push(`<span>Kai's END: <b>${ENDS[p.end].short}</b></span>`);
    const fl = Object.keys(FLAGS).filter(k => p[k]).map(k => FLAGS[k]);
    if(fl.length) bits.push(`<span>Twists: <b>${fl.join(' · ')}</b></span>`);
    extra.forEach(x => bits.push(`<span>${x[0]}: <b>${x[1]}</b></span>`));
    return `<div class="posterline">${bits.join('')}</div>`;
  }

  // ---------- Personal Bank Account (Session 1) ----------
  const PBA = {
    promise:['Keep promises to yourself','Break a promise to yourself'],
    kind:['Do small acts of kindness','Keep to yourself'],
    gentle:['Be gentle with yourself','Beat yourself up'],
    honest:['Be honest','Not being honest'],
    renew:['Renew yourself','Wear yourself out'],
    talent:['Magnify your talents','Bury your talents']
  };
  function pbaChip(code, prefix = 'PBA'){
    if(!code) return '';
    const dep = code[0] === '+', k = code.slice(1); if(!PBA[k]) return '';
    return `<span class="chip ${dep ? 'pba-dep' : 'pba-wd'} pop">${prefix} ${dep ? 'deposit' : 'withdrawal'}: ${PBA[k][dep ? 0 : 1]}</span>`;
  }
  function pbaFor(text, map){ if(!text) return null; for(const k in map) if(text.indexOf(k) >= 0) return map[k]; return null; }
  function pbaBadge(n){ return `<div class="pbabadge" aria-label="Kai's Personal Bank Account ${n}"><span>Kai's PBA</span><b>${n > 0 ? '+' : n < 0 ? '−' : ''}${Math.abs(n)}</b></div>`; }
  const PBA_LINE = 'Your Personal Bank Account from Episode 1: every choice is a deposit or a withdrawal in how you feel about yourself.';

  function bankHTML(title, text, amt = 'H$'){
    return `<div class="bank pop"><div class="coin">${amt}</div><div><b>${title}</b><p>${text}</p></div></div>`;
  }

  function fullscreen(){ try{ const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); p && p.catch && p.catch(() => {}); }catch(e){} }

  function optsHTML(opts, o = {}){
    const n = opts.length;
    return `<div class="opts${n === 3 ? ' n3' : ''}">${opts.map((x, i) => {
      const cls = o.reveal ? (x.best ? ' right' : (o.picked === i ? ' picked' : ' wrong')) : (o.picked === i ? ' picked' : '');
      return `<button class="opt${cls}" data-act="pick" data-i="${i}"${o.reveal ? ' disabled' : ''}><span class="letter">${LETTERS[i]}</span><span class="choice">${x.t}</span><span class="fingers">${o.reveal && x.label ? x.label : `${i + 1} finger${i ? 's' : ''}`}</span>${o.reveal && x.why ? `<span class="why">${x.why}</span>` : ''}</button>`;
    }).join('')}</div>`;
  }

  return {LETTERS, clamp, val, esc, store, order, sfx, setSound, soundState, Timer, mmss, METERS, metersHTML, fxChips, applyFx, TEAM, ENDS, FLAGS, freshPoster, posterPanel, presetsHTML, posterAct, posterLine, bankHTML, fullscreen, optsHTML, PBA, pbaChip, pbaFor, pbaBadge, PBA_LINE};
})();

</script>
<script>
(() => {
const S = HF.store('hf-e4-auction-v1');
const BUDGET = 20;
const LOTS = [
  {n:`Study for Thursday's test`, k:'rock', need:3, why:`Three nights of 30 to 60 minutes. Cramming it all into one night is how it turns into Q1.`},
  {n:`Game with the squad`, k:'pebble', why:`Fun, and fine in moderation. Pebbles go in after the rocks, in the space that's left.`},
  {n:`Practice or open gym`, k:'rock', need:4, why:`Your body is a big rock. Skip it all week and it shows on the court and in your energy.`},
  {n:`Scroll short videos`, k:'sand', why:`It fills every gap in the jar and never leaves room for anything else. Q4.`},
  {n:`Grandma's birthday dinner`, k:'rock', need:2, why:`People first. Grandma will remember who showed up.`},
  {n:`Plan the week on Sunday`, k:'rock', need:1, why:`One hour that saves you about five. The Prioritizer's secret weapon.`},
  {n:`Mystery lot`, mystery:`Make a playlist for the bus`, k:'pebble', why:`A nice extra. Sometimes the mystery box is just a pebble.`},
  {n:`An extra hour of sleep, 4 nights`, k:'rock', need:4, why:`Sleep is the rock every other rock sits on. Remember the Snooze Effect?`},
  {n:`Group chat drama`, k:'sand', why:`Urgent, not important. It feels like it can't wait. It can. Q3.`},
  {n:`Hang out with your best friend`, k:'rock', need:2, why:`Friendship needs real time, not just reactions on their posts.`},
  {n:`Learn a new trick shot`, k:'pebble', why:`Fun and a little bit useful. A pebble, unless it's your goal this season.`},
  {n:`Help your little brother with reading`, k:'rock', need:1, why:`Small time, huge deposit. Ask Kai about Milo.`}
];
const ROCK_HOURS = LOTS.filter(l => l.k === 'rock').reduce((a, l) => a + l.need, 0);
const ROCK_COUNT = LOTS.filter(l => l.k === 'rock').length;
const KIND = {rock:{name:'Big rock', c:'var(--good)'}, pebble:{name:'Pebble', c:'var(--squad)'}, sand:{name:'Sand', c:'var(--muted)'}};
const STEPS = ['title','how','bid','reveal','payout','debrief'];

const fresh = () => ({screen:'title', revealed:[], cur:null, bidTime:180});
let state = fresh(), stack = [], confirmRestart = false;
const clock = HF.Timer(paintClock, () => {});

function save(){ S.save({state, stack}); }
function snap(){ stack.push(JSON.stringify(state)); if(stack.length > 150) stack.shift(); }
function back(){ if(!stack.length) return; state = JSON.parse(stack.pop()); go(); }
function go(){ save(); render(); document.getElementById('main').scrollTop = 0; }
function to(sc){ snap(); if(sc !== 'bid') clock.stop(); state.screen = sc; go(); }

function revealLot(i){
  if(state.revealed.includes(i)) { snap(); state.cur = i; state.screen = 'lot'; return go(); }
  snap(); state.revealed.push(i); state.cur = i; state.screen = 'lot'; HF.sfx.gavel(); go();
}
function next(){
  const s = state;
  if(s.screen === 'title') return to('how');
  if(s.screen === 'how') return to('bid');
  if(s.screen === 'bid') return to('reveal');
  if(s.screen === 'lot') return to(s.revealed.length >= LOTS.length ? 'payout' : 'reveal');
  if(s.screen === 'reveal'){ const n = LOTS.findIndex((_, i) => !s.revealed.includes(i)); if(n < 0) return to('payout'); return revealLot(n); }
  if(s.screen === 'payout') return to('debrief');
}

const nextBtn = (label, dis) => `<div class="btns"><button class="btn primary big" data-act="next"${dis ? ' disabled' : ''}>${label} →</button></div>`;
function hoursBar(){
  const revRock = state.revealed.filter(i => LOTS[i].k === 'rock').reduce((a, i) => a + LOTS[i].need, 0);
  const cells = Array.from({length:BUDGET}, (_, i) => `<i class="${i < revRock ? 'r' : ''}"></i>`).join('');
  return `<div class="hours"><div class="lbl"><span>Your 20 free hours this week</span><span>Big rocks need: ${revRock}${state.revealed.length >= LOTS.length ? '' : '+'} hours</span></div><div class="bar">${cells}</div></div>`;
}
function lotsGrid(clickable){
  const s = state, nextI = LOTS.findIndex((_, i) => !s.revealed.includes(i));
  return `<div class="lots">${LOTS.map((l, i) => {
    const r = s.revealed.includes(i);
    const nm = r && l.mystery ? `${l.n}: ${l.mystery}` : l.n;
    return `<button class="lot${r ? ' ' + l.k : ''}${clickable && i === nextI ? ' next' : ''}" data-act="${clickable ? 'lot' : 'none'}" data-i="${i}"${clickable ? '' : ' tabindex="-1"'}><span class="no">Lot ${i + 1}</span><span class="nm">${nm}</span>${r ? `<span class="res">${KIND[l.k].name}${l.need ? ` · needs ${l.need} hr${l.need > 1 ? 's' : ''}` : ''}</span>` : ''}</button>`;
  }).join('')}</div>`;
}

function render(){
  const s = state, main = document.getElementById('main');
  document.getElementById('meters').innerHTML = '';
  const si = Math.max(0, STEPS.indexOf(s.screen === 'lot' ? 'reveal' : s.screen));
  document.getElementById('dots').innerHTML = STEPS.map((_, i) => `<i class="${i < si ? 'done' : i === si ? 'now' : ''}"></i>`).join('');
  document.getElementById('btn-back').disabled = !stack.length;
  const rb = document.getElementById('btn-restart'); rb.textContent = confirmRestart ? 'Click again to restart' : 'Restart'; rb.classList.toggle('warn', confirmRestart);
  document.getElementById('btn-sound').textContent = HF.soundState() ? 'Sound on' : 'Sound off';
  document.getElementById('keys').innerHTML = s.screen === 'bid' ? `<kbd>T</kbd> start the clock · <kbd>Enter</kbd> lock the bids` : `<kbd>Enter</kbd> next · <kbd>Z</kbd> back`;
  let h = '';
  if(s.screen === 'title'){
    h = `<section class="screen"><div class="split">
      <div class="stack">
        <div class="eyebrow"><b>Habitflix Live</b> · S1:E4 · Habit 3: Put First Things First</div>
        <h1>The Big Rocks<br>Auction</h1>
        <p class="lede">You have 20 free hours this week. Twelve things want them. Bid your hours in secret, then watch which lots turn out to be big rocks, pebbles or sand.</p>
        ${nextBtn('How it works')}
      </div>
      <div class="panel">
        <h4>You need</h4>
        <ul><li>One Time Budget card per student (or scrap paper: write lot numbers 1 to 12)</li><li>A pencil</li><li>Bills for the payout at Checkout</li></ul>
        <h4>Time</h4><p class="note">About 8 minutes: 3 to bid, 4 to reveal, 1 to pay out.</p>
      </div></div></section>`;
  }
  else if(s.screen === 'how'){
    h = `<section class="screen"><div class="split">
      <div class="stack">
        <div class="eyebrow"><b>The rules</b> · Sealed bids</div>
        <h2>Spend your 20 hours</h2>
        <ol class="qs">
          <li>Write how many hours you'll spend on each lot. Whole hours only.</li>
          <li>Your total can't go over 20. You don't have to spend them all.</li>
          <li>Bids are secret. No talking while the clock runs.</li>
          <li>After the reveal, every <b>big rock</b> you gave enough hours to pays H$1 at Checkout.</li>
        </ol>
        ${nextBtn('Show the lots')}
      </div>
      <div class="stack">${HF.bankHTML('Bank rule', 'Nobody loses money in this auction. Hours are spent, H$ is only earned. Pebbles and sand pay nothing, and they cost nothing either.')}
      <p class="tagline">Willpower to say yes. Won't power to say no.</p></div>
    </div></section>`;
  }
  else if(s.screen === 'bid'){
    h = `<section class="screen top">
      <div class="split">
        <div class="stack"><div class="eyebrow"><b>Bidding is open</b> · Write your hours on your card</div><h3>12 lots. 20 hours. Choose.</h3></div>
        <div class="btns" style="justify-content:flex-end"><span class="clock" id="clock">${HF.mmss(s.bidTime)}</span><button class="btn ghost" id="btn-clock" data-act="clock">Start the clock</button></div>
      </div>
      ${lotsGrid(false)}
      ${nextBtn('Lock the bids')}</section>`;
  }
  else if(s.screen === 'reveal'){
    const left = LOTS.length - s.revealed.length;
    h = `<section class="screen top">
      <div class="eyebrow"><b>The reveal</b> · ${left} lot${left === 1 ? '' : 's'} left · Click any lot, or go in order</div>
      ${lotsGrid(true)}
      ${hoursBar()}
      ${nextBtn(left ? `Reveal lot ${LOTS.findIndex((_, i) => !s.revealed.includes(i)) + 1}` : 'Payout')}</section>`;
  }
  else if(s.screen === 'lot'){
    const l = LOTS[s.cur];
    h = `<section class="screen"><div class="split">
      <div class="big-reveal" style="--rc:${KIND[l.k].c}">
        <span class="eyebrow">Lot ${s.cur + 1} · Sold</span>
        <span class="nm">${l.mystery ? `Mystery lot: ${l.mystery}` : l.n}</span>
        <span class="k">${KIND[l.k].name}</span>
        ${l.need ? `<span class="chip good" style="justify-self:start">Needs ${l.need} hour${l.need > 1 ? 's' : ''} to count</span>` : ''}
        <p class="note">${l.why}</p>
      </div>
      <div class="stack">${hoursBar()}<p class="note">Hands up if you gave it ${l.need ? `at least ${l.need}` : 'any'} hour${l.need === 1 ? '' : 's'}. ${l.k === 'rock' ? 'Circle it on your card.' : 'No payout, no penalty.'}</p>
      ${nextBtn(s.revealed.length >= LOTS.length ? 'Payout' : 'Back to the lots')}</div>
    </div></section>`;
  }
  else if(s.screen === 'payout'){
    h = `<section class="screen">
      <div class="eyebrow"><b>Payout</b> · Cash in at Checkout</div>
      <h2>The big rocks needed ${ROCK_HOURS} of your ${BUDGET} hours</h2>
      ${hoursBar()}
      <div class="payout">
        <div><b>H$1</b><span>for every big rock you covered with enough hours (up to ${ROCK_COUNT})</span></div>
        <div><b>+H$2</b><span>Prioritizer bonus if you covered all ${ROCK_COUNT} big rocks</span></div>
        <div><b>H$0</b><span>for pebbles and sand. Nobody loses money.</span></div>
      </div>
      <p class="tagline">If you put the pebbles in first, there's no room left for the rocks.</p>
      ${nextBtn('Debrief')}</section>`;
  }
  else if(s.screen === 'debrief'){
    h = `<section class="screen"><div class="split top">
      <div class="stack">
        <div class="eyebrow"><b>Debrief</b> · Put first things first</div>
        <h2>Where did your hours go?</h2>
        <ol class="qs">
          <li>Which lot did you spend the most hours on? Was it a rock, a pebble or sand?</li>
          <li>Did anyone run out of hours before a big rock? What happened?</li>
          <li>Which pebble was hardest to say no to? That's your won't power test.</li>
          <li>Kai's week had the same six rocks. Which character would bid like you just did?</li>
        </ol>
        <div class="btns"><button class="btn ghost" data-act="restart-now">Run it again</button></div>
      </div>
      ${lotsGrid(false)}
    </div></section>`;
  }
  main.innerHTML = h;
  paintClock(clock);
}
function paintClock(t){
  const el = document.getElementById('clock'); if(!el) return; t = t || clock;
  el.textContent = t.running() || t.done ? HF.mmss(t.left) : HF.mmss(state.bidTime);
  document.getElementById('btn-clock').textContent = t.running() ? 'Restart the clock' : t.done ? 'Time! Pencils down' : 'Start the clock';
}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if(!el || el.disabled) return;
  if(el.tagName === 'BUTTON') el.blur();
  const a = el.dataset.act;
  if(a === 'next') next();
  else if(a === 'lot') revealLot(Number(el.dataset.i));
  else if(a === 'clock') clock.start(state.bidTime);
  else if(a === 'back') back();
  else if(a === 'restart'){ if(!confirmRestart){ confirmRestart = true; render(); return; } clock.stop(); stack = []; state = fresh(); go(); }
  else if(a === 'restart-now'){ clock.stop(); stack = []; state = fresh(); go(); }
  else if(a === 'sound'){ HF.setSound(!HF.soundState()); render(); }
  else if(a === 'full') HF.fullscreen();
  if(a !== 'restart' && confirmRestart){ confirmRestart = false; render(); }
});
document.addEventListener('keydown', ev => {
  if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key.toLowerCase();
  if(state.screen === 'bid' && k === 't'){ clock.start(state.bidTime); return; }
  if(k === 'enter' || k === 'arrowright' || k === ' ' || k === 'pagedown'){
    if(document.activeElement && document.activeElement.tagName === 'BUTTON' && k !== 'arrowright' && k !== 'pagedown') return;
    ev.preventDefault(); next(); return;
  }
  if(k === 'z' || k === 'backspace' || k === 'pageup' || k === 'arrowleft'){ ev.preventDefault(); back(); }
});
function boot(data){
  const d = data && data.state ? data : S.load();
  if(d && d.state){ state = Object.assign(fresh(), d.state); stack = d.stack || []; }
  render();
}
try{ window.claude?.hot?.snapshot?.(() => ({state, stack})); }catch(e){}
const hot = window.claude?.hot;
if(hot?.ready) hot.ready(boot); else boot(hot?.data ?? {});
window.__t = {get s(){ return state; }, next};
})();
</script>
