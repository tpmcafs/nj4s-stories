<style>
/* Layout: a fixed 1600x900 stage scaled to the window. Scenes sit on one vertical strip, so moving on
   is always the same slow slide upward. Inside a scene, steps add classes s1..sN; many items can also
   be tapped or dragged directly, which is what makes it work on a touch screen. */
:root {
  --ink: #0d1016; --gold: #c39a3c; --gold-hi: #f1d488; --gold-deep: #8a6a1f; --indigo: #1f3552;
  --text: #1c2029; --muted: #5d6270; --cream: #ece5d4; --cream-muted: #a9a394; --paper-gold: #9c7a2a;
  --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.45,0,.2,1); --slide: cubic-bezier(.7,0,.2,1);
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: #07090d; color: var(--cream); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#viewport { position: fixed; inset: 0; }
#stage { position: absolute; width: 1600px; height: 900px; overflow: hidden; transform-origin: 0 0; background: var(--ink); touch-action: none; }
#strip { position: absolute; left: 0; top: 0; width: 1600px; transition: transform 1.5s var(--slide); will-change: transform; }
.sec { position: absolute; left: 0; width: 1600px; height: 900px; overflow: hidden; }
.sec.dark { background: radial-gradient(ellipse at 70% 40%, #1a2130 0%, var(--ink) 62%); color: var(--cream); }
.sec.paper { background: #f3f2ee url(assets/paper.jpg) center/cover; color: var(--text); }
.el { position: absolute; transition: transform 1.2s var(--ease), opacity .9s var(--ease), filter .9s var(--ease); }
img { display: block; -webkit-user-drag: none; }
.eyebrow { font: 500 15px/1.3 var(--body); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.paper .eyebrow { color: var(--gold-deep); }
.h1 { font: 500 92px/1.02 var(--display); margin: 0; text-wrap: balance; }
.h2 { font: 500 58px/1.08 var(--display); margin: 0; text-wrap: balance; }
.h3 { font: 500 32px/1.15 var(--display); margin: 0; }
.lead { font: 400 25px/1.5 var(--body); margin: 0; }
.body { font: 400 21px/1.55 var(--body); margin: 0; }
.small { font: 400 15px/1.45 var(--body); margin: 0; }
.gold { color: var(--gold); } .paper .gold { color: var(--paper-gold); }
.muted { color: var(--cream-muted); } .paper .muted { color: var(--muted); }
.t, .r { opacity: 0; transform: translateY(26px); transition: opacity .8s var(--ease), transform 1s var(--ease); pointer-events: none; }
/* photos: framed, tappable to enlarge */
.photo { position: absolute; overflow: hidden; border-radius: 6px; box-shadow: 0 24px 50px rgba(0,0,0,.35); cursor: zoom-in; background: #222; }
.photo img { width: 100%; height: 100%; object-fit: cover; }
.photo .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 14px 10px; font: 400 13px/1.35 var(--body); color: #f3efe6; background: linear-gradient(transparent, rgba(0,0,0,.72)); }
.photo .zoom { position: absolute; right: 10px; top: 10px; width: 34px; height: 34px; border-radius: 50%; background: rgba(10,12,17,.55); display: grid; place-items: center; }
.photo .zoom svg { width: 16px; height: 16px; }
/* tap affordances */
[data-i] { cursor: pointer; }
.pulse { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity .6s; }
.pulse::before, .pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--gold-hi); animation: ping 2s ease-out infinite; }
.pulse::after { animation-delay: 1s; }
.paper .pulse::before, .paper .pulse::after { border-color: var(--paper-gold); }
.tip { position: absolute; font: 500 15px/1 var(--body); padding: 10px 16px; border-radius: 999px; background: rgba(13,16,22,.82); color: var(--gold-hi); border: 1px solid rgba(241,212,136,.35); pointer-events: none; opacity: 0; transition: opacity .6s; white-space: nowrap; }
.paper .tip { background: rgba(255,255,255,.9); color: var(--paper-gold); border-color: rgba(156,122,42,.35); }
@keyframes ping { 0% { transform: scale(.35); opacity: .9 } 100% { transform: scale(1.25); opacity: 0 } }
.btn { all: unset; cursor: pointer; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; padding: 0 26px; border-radius: 999px; font: 500 20px var(--body); border: 1.5px solid rgba(241,212,136,.5); color: var(--cream); background: rgba(255,255,255,.04); transition: background .3s, border-color .3s, color .3s; }
.paper .btn { color: var(--text); border-color: rgba(28,32,41,.25); background: rgba(255,255,255,.55); }
.btn[aria-pressed="true"], .btn.on { background: var(--gold); border-color: var(--gold); color: #1a1408; }
.btn:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 3px; }
/* gold seam drawing (SVG) */
.seam { fill: none; stroke: url(#goldStroke); stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.8s var(--ease); filter: url(#goldGlow); }
.b3d { display: block; touch-action: none; }
.bowlhost { position: absolute; }
/* chrome outside the stage: big touch targets */
#bar { position: absolute; left: 0; bottom: 0; height: 4px; width: 1600px; background: rgba(255,255,255,.08); z-index: 20; pointer-events: none; }
#bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold-deep), var(--gold-hi)); transition: width 1s var(--ease); }
.navb { position: fixed; z-index: 50; width: 64px; height: 64px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: rgba(13,16,22,.55); color: var(--cream); font: 400 30px/1 var(--body); display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: .55; transition: opacity .3s, background .3s; padding: 0; }
.navb:hover, .navb:focus-visible { opacity: 1; outline: none; background: rgba(13,16,22,.8); }
.navb:active { background: var(--gold); color: #1a1408; }
#prev { left: max(14px, env(safe-area-inset-left, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); }
#next { right: max(14px, env(safe-area-inset-right, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); }
#tools { position: fixed; z-index: 50; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; opacity: .45; transition: opacity .3s; }
#tools:hover, #tools:focus-within { opacity: 1; }
#tools button { all: unset; cursor: pointer; min-width: 48px; height: 48px; padding: 0 14px; box-sizing: border-box; border-radius: 24px; background: rgba(13,16,22,.6); color: var(--cream); border: 1px solid rgba(255,255,255,.16); font: 500 14px var(--body); display: grid; place-items: center; }
#tools button:focus-visible { outline: 2px solid var(--gold); }
#count { position: fixed; z-index: 50; bottom: max(30px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); font: 500 13px var(--body); color: var(--cream-muted); opacity: .6; pointer-events: none; font-variant-numeric: tabular-nums; letter-spacing: .1em; }
#notes { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); width: min(880px, calc(100vw - 32px)); max-height: 38vh; overflow: auto; background: rgba(10,12,17,.94); border: 1px solid rgba(195,154,60,.4); border-radius: 10px; padding: 16px 20px; z-index: 60; font: 400 17px/1.55 var(--body); color: var(--cream); }
#notes b { color: var(--gold-hi); font-weight: 500; display: block; margin-bottom: 4px; letter-spacing: .08em; font-size: 12px; text-transform: uppercase; }
#lb, #menu { position: fixed; inset: 0; z-index: 80; background: rgba(5,6,9,.94); display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .4s; }
#lb.open, #menu.open { opacity: 1; pointer-events: auto; }
#lb figure { margin: 0; max-width: 92vw; display: grid; gap: 12px; }
#lb img { max-width: 92vw; max-height: 78vh; object-fit: contain; border-radius: 6px; margin: 0 auto; }
#lb figcaption { font: 400 16px/1.5 var(--body); color: var(--cream); text-align: center; max-width: 820px; margin: 0 auto; padding: 0 16px; }
#lb figcaption small { display: block; color: var(--cream-muted); font-size: 13px; margin-top: 4px; }
#lb .x, #menu .x { position: fixed; top: 16px; right: 16px; }
#menu .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; width: min(1100px, calc(100vw - 32px)); max-height: 80vh; overflow: auto; padding: 4px; }
#menu .grid button { all: unset; cursor: pointer; padding: 18px 16px; border-radius: 10px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); color: var(--cream); font: 500 17px/1.3 var(--body); }
#menu .grid button span { display: block; color: var(--gold); font-size: 12px; letter-spacing: .14em; margin-bottom: 4px; }
#menu .grid button.cur { border-color: var(--gold); }
@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
@keyframes flow { to { stroke-dashoffset: -60 } }
@keyframes ripple { 0% { transform: scale(.2); opacity: 0 } 20% { opacity: .9 } 100% { transform: scale(1); opacity: 0 } }
@keyframes wobble { 0%,100% { transform: rotate(0) } 20% { transform: rotate(-4deg) } 40% { transform: rotate(3deg) } 60% { transform: rotate(-2deg) } 80% { transform: rotate(1deg) } }
@keyframes glint { 0%,100% { filter: drop-shadow(0 18px 24px rgba(0,0,0,.25)) } 50% { filter: drop-shadow(0 0 26px rgba(241,212,136,.85)) drop-shadow(0 18px 24px rgba(0,0,0,.25)) } }
@keyframes kenburns { from { transform: scale(1.04) translate(0,0) } to { transform: scale(1.14) translate(-30px,-14px) } }
@keyframes drift { 0% { transform: translate(0,0); opacity: 0 } 20% { opacity: .7 } 100% { transform: translate(var(--dx), -160px); opacity: 0 } }
@media (prefers-reduced-motion: reduce) { #strip, .el, .t, .r { transition-duration: .01s !important; } * { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }
</style>

<div id="viewport"><div id="stage">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a1f"/><stop offset=".35" stop-color="#f6dc8f"/><stop offset=".6" stop-color="#c79c3a"/><stop offset="1" stop-color="#fbe6a6"/></linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2" result="b"/><feColorMatrix in="b" type="matrix" values="1 0 0 0 .25  0 1 0 0 .18  0 0 1 0 0  0 0 0 .9 0" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="teaGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b1907" stop-opacity=".95"/><stop offset=".45" stop-color="#b16e2d" stop-opacity=".85"/><stop offset=".6" stop-color="#d99a54" stop-opacity=".8"/><stop offset="1" stop-color="#3b1907" stop-opacity=".95"/></linearGradient>
    <radialGradient id="teaSurf" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#a8642c"/><stop offset=".6" stop-color="#6e3714"/><stop offset="1" stop-color="#341707"/></radialGradient>

<script>/*BOWL3D*/</script>
<script>
const DATA = /*DATA*/;
const PH = /*PHOTOS*/;
const A = "assets/";
const $ = (s, r = document) => r.querySelector(s);
const SECTIONS = [], HOOKS = {}, ACT = {};
let css = "";
function sec(id, cls, title, html, steps, extraCss = "") { SECTIONS.push({ id, cls, title, html, steps }); css += extraCss; }
function img(src, x, y, w, h, cls = "", extra = "") { return `<img class="el ${cls}" src="${A}${src}" alt="" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${extra}">`; }
function fit(asp, mw, mh) { let w = mw, h = w / asp; if (h > mh) { h = mh; w = h * asp; } return [w, h]; }
function objAt(name, cx, cy, mw, mh, cls = "", extra = "") { const [w, h] = fit(DATA.asp[name], mw, mh); return img(name + ".webp", cx - w / 2, cy - h / 2, w, h, cls, extra); }
function stepCss(id, sel, from) { return `#${id}.s${from} ${sel}{opacity:1;transform:none;pointer-events:auto}`; }
function polyD(pts) { return "M" + pts.map(p => p.join(" ")).join(" L"); }
function smoothD(pts) { let d = `M${pts[0][0]} ${pts[0][1]}`; for (let i = 0; i < pts.length - 1; i++) { const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2; const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6]; d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0]} ${p2[1]}`; } return d; }
const ZOOM = `<span class="zoom"><svg viewBox="0 0 16 16" fill="none" stroke="#f1d488" stroke-width="1.6"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/></svg></span>`;
// a framed real photograph; tap to see it large with its caption and credit
function photo(key, x, y, w, h, caption, cls = "", extra = "", pos = "50% 50%") {
  return `<div class="photo el ${cls}" data-i="photo" data-key="${key}" data-cap="${caption.replace(/"/g, "&quot;")}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${extra}">
    <img src="${A}p_${key}.webp" alt="${caption.replace(/"/g, "&quot;")}" style="object-position:${pos}">${caption ? `<div class="cap">${caption}</div>` : ""}${ZOOM}</div>`;
}
function credit(key) { const p = PH[key]; return `${(p.artist || p.credit || "Wikimedia Commons").split(" (")[0]} · ${p.license} · Wikimedia Commons`; }
const pulse = (x, y, cls) => `<div class="pulse ${cls}" style="left:${x}px;top:${y}px"></div>`;
const tip = (x, y, text, cls) => `<div class="tip ${cls}" style="left:${x}px;top:${y}px">${text}</div>`;
const bowlFallback = `<img src="${A}image25.webp" alt="" style="width:100%;height:100%;object-fit:contain">`;
function makeBowl(host, opt) {
  if (!window.THREE || !window.Bowl3D) { host.innerHTML = bowlFallback; return null; }
  try { return new Bowl3D(host, opt); } catch (e) { console.error(e); host.innerHTML = bowlFallback; return null; }
}

// =================== TITLE: a real-time porcelain bowl, mended with gold ===================
sec("title", "dark", "Title", `
  <img class="el" src="${A}veins.webp" alt="" style="left:-40px;top:-30px;width:1700px;height:auto;opacity:.12">
  <div class="bowlhost" id="titleBowl" style="left:700px;top:40px;width:880px;height:780px"></div>
  <div class="el" style="left:110px;top:210px;width:640px;display:grid;gap:22px">
    <div class="eyebrow">NJ4S presents</div>
    <h1 class="h1">The Art of<br><span class="gold">Everyday Wellbeing</span></h1>
    <p class="lead muted" style="max-width:560px">What a broken tea bowl can teach us about the eight dimensions of wellness</p>
  </div>
  ${tip(1010, 800, "Drag to turn it · Tap it to break it", "ttip")}
  <div class="el small muted" style="left:110px;bottom:56px">Swipe, tap or use the arrow keys to move on.</div>`,
  [{ note: "Welcome. Today is about something everyone experiences: things breaking, and how we put them back together. Invite someone to come up, turn the bowl, and tap it." }],
  `#title.on .ttip{opacity:1}`);
HOOKS.title = { init(s) { this.b = makeBowl($("#titleBowl"), { seed: 11, autoRotate: 0.18, rot0: 0.9 }); if (!this.b) return;
    this.b.setAll({ seams: 1, gold: 1, fat: 1 }, true);
    this.b.onTap = () => { const b = this.b; if (this.busy) return; this.busy = true;
      b.shards.forEach(sh => { sh.userData.te = 1; sh.userData.toff.set(0, 0, 0); });
      b.seams.forEach(m => { m.p = 0; });
      setTimeout(() => { b.setAll({ e: 0 }); b.seams.forEach(m => m.tp = 1); }, 1500);
      setTimeout(() => this.busy = false, 3600); };
  }, bowls() { return [this.b]; } };

// =================== WHAT IS KINTSUGI (real photograph) ===================
sec("word", "dark", "What is kintsugi?", `
  <div class="el" style="left:520px;top:0;width:1080px;height:900px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%);mask-image:linear-gradient(90deg,transparent 0,#000 30%)">
    <img src="${A}p_kintsugi_bowl.webp" alt="A tea bowl repaired with gold" style="width:100%;height:100%;object-fit:cover;object-position:55% 50%;animation:kenburns 24s ease-in-out infinite alternate">
  </div>
  <div class="el small" style="right:24px;bottom:22px;color:rgba(236,229,212,.55);font-size:12px">Photo: ${credit("kintsugi_bowl")}</div>
  <div class="el" style="left:110px;top:140px;display:flex;gap:40px;align-items:flex-end">
    <div class="r k1" style="text-align:center"><div style="font:500 190px/1 var(--display);color:var(--gold)">金</div><div class="eyebrow" style="margin-top:14px">kin · gold</div></div>
    <div class="r k2" style="text-align:center"><div style="font:500 190px/1 var(--display);color:var(--cream)">継ぎ</div><div class="eyebrow" style="margin-top:14px;color:var(--cream-muted)">tsugi · joining</div></div>
  </div>
  <div class="el r k3" style="left:110px;top:500px;width:620px;display:grid;gap:16px">
    <h2 class="h2">Kintsugi <span class="muted" style="font-size:.6em">“golden joinery”</span></h2>
    <p class="body muted">The Japanese art of repairing broken pottery with urushi lacquer, then finishing the seams with powdered gold. Also called <i>kintsukuroi</i>, “golden repair.”</p>
  </div>`,
  [{ note: "Kintsugi is written with two parts. Ask: what do you think a 'golden join' might be?" }, { note: "Kin: gold." }, { note: "Tsugi: joining." },
   { note: "This is a real bowl mended this way. The repair isn't hidden. It's the most beautiful part." }],
  stepCss("word", ".k1", 1) + stepCss("word", ".k2", 2) + stepCss("word", ".k3", 3));

// =================== THE LEGEND (illustrated; tap the teapot, tap the bowl) ===================
(() => {
  const S = DATA.story, ox = 70, oy = -50, B = S.bowl, T = S.teapot;
  const pieces = ["image16","image18","image19","image17","image20","image22"].map(n => { const [x, y, w, h] = S.pieces[n]; return img(n + ".webp", x + ox, y + oy, w, h, `pc pc-${n}`); }).join("");
  const st = S.pieces.image15;
  const sp = [[784.2,463.8],[763.2,483.6],[726,546],[719.4,672]].map(([x, y]) => [x + ox, y + oy]);
  const streamD = `M${sp[0][0]} ${sp[0][1]} C${sp[1][0]} ${sp[1][1]} ${sp[2][0]} ${sp[2][1]} ${sp[3][0]} ${sp[3][1]}`;
  const goldPaths = S.gold.map((p, i) => `<path class="seam sg${i}" pathLength="1" d="${smoothD(p)}" stroke-width="9"/>`).join("");
  const texts = [
    ["The legend · Japan, late 1400s", "A favorite tea bowl", "The shōgun Ashikaga Yoshimasa treasured a tea bowl from China. In the tea ceremony, every bowl is handled slowly and with care."],
    ["Used every day", "Filled again and again", "A tea bowl is made to be used: warm in the hands, holding what matters."],
    ["One moment", "Then it broke.", "One slip, and something precious was in pieces."],
    ["The quick fix", "Held together with staples", "He sent it to China to be replaced. It came back clamped with metal staples. It held, but everyone could see where it had failed."],
    ["A better way", "Mended with gold", "Japanese craftsmen looked for a more beautiful repair: join the pieces with lacquer and finish the seams in gold. The break became the most beautiful part."]];
  sec("legend", "paper", "The legend", `<div class="el scene" style="left:0;top:0;width:1600px;height:900px;transform:scale(.9);transform-origin:1250px 560px">
    <img class="el" src="${A}slate.jpg" alt="" style="left:${586 + ox}px;top:${139 + oy}px;width:954px;height:954px;transform:rotate(23.6deg);box-shadow:18px 22px 40px rgba(0,0,0,.35)">
    <img class="el" src="${A}goldleaf.jpg" alt="" style="left:${562 + ox}px;top:${343 + oy}px;width:1033px;height:1033px;transform:rotate(-41deg);box-shadow:18px 22px 40px rgba(0,0,0,.35)">

const DIMS = /*DIMS*/;
const RING = { cx: 800, cy: 470, rx: 590, ry: 300 };
function ringPos(k) { const a = (-90 + 45 * k) * Math.PI / 180; return [RING.cx + RING.rx * Math.cos(a), RING.cy + RING.ry * Math.sin(a)]; }
function ringObjects(prefix) {
  return DIMS.map((d, k) => { const [x, y] = ringPos(k);
    return `<div class="el ${prefix} ${prefix}${k}" data-i="gotoDim" data-k="${k}" style="left:${x - 110}px;top:${y - 95}px;width:220px;height:190px;display:grid;justify-items:center;align-content:center;gap:8px">
      <div style="height:130px;display:grid;place-items:center">${objAt(d.obj, 0, 0, 170, 125, "", "position:static;animation:bob " + (5 + k * .37) + "s ease-in-out infinite")}</div>
      <div style="font:700 13px var(--body);letter-spacing:.18em;color:var(--text)">${d.name.toUpperCase()}</div></div>`; }).join("");
}
function faceHTML() { return Object.entries(DATA.face).map(([n, f]) => `<img class="fp fp-${n}" src="${A}${n}.webp" alt="" style="position:absolute;left:${f.box[0]}px;top:${f.box[1]}px;width:${f.box[2]}px;height:${f.box[3]}px">`).join(""); }
(() => {
  const F = DATA.face, FCX = 954, FCY = 497, MOV = ["image33","image34","image35","image36"];
  const st = (n, k) => { const v = F[n][k]; return v ? `translate(${v[0]}px,${v[1]}px) scale(${v[2]})` : "none"; };
  const qs = [["What if", "the bowl", "is you?"], ["What holds", "you", "together?"], ["What if", "your cracks", "became gold?"]];
  sec("face", "paper", "What if the bowl is you?", `
    <div class="el facewrap" style="left:0;top:0;width:1600px;height:900px;transform-origin:${FCX}px ${FCY}px">${faceHTML()}</div>
    <div class="el facedrag" data-i="facedrag" style="left:560px;top:40px;width:1000px;height:860px;touch-action:none"></div>
    ${tip(110, 500, "Drag the pieces together →", "ftip")}
    ${qs.map((q, i) => `<div class="el t q${i}" style="left:110px;top:300px;font:500 54px/1.12 var(--display);color:var(--paper-gold)">${q.join("<br>")}</div>`).join("")}
    ${ringObjects("ro")}
    <div class="el r ringcap" style="left:100px;top:812px;font:700 15px var(--body);letter-spacing:.3em;color:var(--paper-gold)">8 DIMENSIONS OF YOU · TAP ONE</div>
    <div class="el r ringsrc small muted" style="right:100px;top:822px">Eight Dimensions of Wellness · SAMHSA, adapted from Swarbrick (2006)</div>`,
    [{ note: "Ask the question and let it sit. A student can drag the pieces together, or it moves on by itself." },
     { auto: 3600, note: "What holds you together? Take a few answers: family, friends, faith, music, sport." },
     { auto: 3000, note: "Watch the gold fill the cracks. What if your cracks became gold?" },
     { note: "You are the bowl, and these are the eight dimensions of you. Tap any one to jump to it." }],
    `${MOV.map(n => `#face .fp-${n}{transform-origin:0 0;transform:${st(n, "apart")};transition:transform 2.2s var(--ease)}
       #face.s1 .fp-${n}{transform:${st(n, "closer")}} #face.s2 .fp-${n}{transform:none;transition-duration:1.4s}`).join("")}
     #face.dragging .fp{transition:none!important}
     #face .fp-image37{clip-path:inset(100% 0 0 0);transition:clip-path 3.2s var(--ease);filter:drop-shadow(0 0 6px rgba(241,212,136,.6))}
     #face.s2 .fp-image37{clip-path:inset(0 0 0 0);transition-delay:1.3s}
     ${[0,1,2].map(k => `#face[data-cur="${k}"] .q${k}{opacity:1;transform:none}`).join("")}
     #face.on:not(.s2) .ftip{opacity:1;transition-delay:1.5s} #face.s2 .facedrag{display:none}
     #face.s3 .facewrap{transform:translate(${800 - FCX}px,${RING.cy - FCY}px) scale(.4);transition:transform 1.8s var(--ease)}
     #face .ro{opacity:0;pointer-events:none;transition:transform 1.4s var(--ease),opacity 1s}
     ${DIMS.map((d, k) => { const [x, y] = ringPos(k); return `#face .ro${k}{transform:translate(${(x - RING.cx) * .9}px,${(y - RING.cy) * .9}px) scale(.6)} #face.s3 .ro${k}{opacity:1;transform:none;pointer-events:auto;transition-delay:${.5 + k * .12}s}`; }).join("")}
     ${stepCss("face", ".ringcap", 3)}${stepCss("face", ".ringsrc", 3)}`);
  // dragging: progress 0 = apart, .5 = closer, 1 = mended
  const lerpT = (n, p) => { const a = F[n].apart, c = F[n].closer, fin = [0, 0, 1];
    const [u, v, t] = p < .5 ? [a, c, p / .5] : [c, fin, (p - .5) / .5];
    const m = (i) => u[i] + (v[i] - u[i]) * t; return `translate(${m(0)}px,${m(1)}px) scale(${m(2)})`; };
  HOOKS.face = { init() {
    const layer = $("#face .facedrag"), sect = $("#face"); let d = null;
    layer.addEventListener("pointerdown", e => { const k = cur()[1]; if (cur()[0] !== idx("face") || k > 1) return; e.stopPropagation(); layer.setPointerCapture(e.pointerId); clearTimeout(timer);
      d = { x: e.clientX, y: e.clientY, p0: k === 1 ? .5 : 0, p: 0 }; sect.classList.add("dragging"); });
    layer.addEventListener("pointermove", e => { if (!d) return; e.stopPropagation();
      const dist = Math.hypot(e.clientX - d.x, e.clientY - d.y) / (window.__stageScale || 1);
      d.p = Math.min(1, d.p0 + dist / 520); MOV.forEach(n => $("#face .fp-" + n).style.transform = lerpT(n, d.p));
      if (d.p >= 1) finish(true); });
    const finish = (done) => { if (!d) return; sect.classList.remove("dragging"); MOV.forEach(n => $("#face .fp-" + n).style.transform = ""); const p = d.p; d = null;
      if (done || p > .8) jumpStep(2); else if (p > .4) jumpStep(1); else sync(); };
    layer.addEventListener("pointerup", e => { e.stopPropagation(); finish(false); }); layer.addEventListener("pointercancel", () => finish(false));
    layer.addEventListener("click", e => e.stopPropagation());
  } };
  ACT.gotoDim = (el) => jump(idx("dim" + (+el.dataset.k + 1)), 0);
})();

// =================== THE 8 DIMENSIONS ===================
const FRONT = ["gold","slate","slate","gold","slate","gold","slate","gold"];
const GROT = [14, 26, 6, 22, 10, 30, 4, 18], SROT = [-12, -24, -6, -28, -16, -8, -22, -14];
function rng(seed) { let s = seed * 9301 + 49297; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
function crackPts(r, x0, y0, x1, y1, n, amp) { const pts = []; for (let i = 0; i <= n; i++) { const f = i / n, j = (i === 0 || i === n) ? 0 : (r() - .5) * 2 * amp; const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy); pts.push([+(x0 + dx * f - dy / L * j).toFixed(1), +(y0 + dy * f + dx / L * j).toFixed(1)]); } return pts; }
function crackLayer(k, cx, cy) {
  const r = rng(k + 3), flip = k % 2 ? -1 : 1;
  const main = crackPts(r, cx - 215 * flip, cy - 205, cx - 110 * flip, cy + 255, 11, 20);
  const b0 = main[3], branch = crackPts(r, b0[0], b0[1], cx - 270 * flip, b0[1] + 120, 5, 12);
  const b1 = main[8], branch2 = crackPts(r, b1[0], b1[1], cx - 250 * flip, cy + 150, 4, 10);
  const staples = [1, 4, 7].map(i => { const [a, b] = [main[i], main[i + 1]], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2; const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI + 90;
    return `<g class="stp" transform="translate(${mx} ${my}) rotate(${ang.toFixed(1)})"><rect x="-24" y="-5" width="48" height="10" rx="2" fill="#80868f" stroke="#3c4048" stroke-width="1.5"/><circle cx="-17" cy="0" r="2.6" fill="#2a2d33"/><circle cx="17" cy="0" r="2.6" fill="#2a2d33"/></g>`; }).join("");
  return `<svg class="el dcrack" style="left:0;top:0;width:1600px;height:900px;z-index:3;overflow:visible;pointer-events:none" viewBox="0 0 1600 900" aria-hidden="true">
    ${[main, branch, branch2].map((p, i) => `<path class="crk crk${i}" pathLength="1" d="${polyD(p)}"/>`).join("")}${staples}</svg>`;
}

     ${[0,1,2].map(i => `#${id}[data-cur="3"] .stp:nth-of-type(${i + 1}){opacity:1;transition-delay:${.2 + i * .35}s}`).join("")}
     #${id}.s4 .crk{stroke:url(#goldStroke);stroke-width:7;filter:url(#goldGlow)}`);
});

     ${[0,1,2,3,4].map(k => `#activity[data-cur="${k}"] .as${k} .adesc{max-height:90px}`).join("")}
     #activity .ab{opacity:0;pointer-events:none;display:none} #activity[data-cur="2"] .ab2,#activity[data-cur="3"] .ab3{opacity:1;pointer-events:auto;display:inline-flex}
     #activity .timer{opacity:0;transition:opacity 1s} #activity[data-cur="4"] .timer{opacity:1}
     #activity .lbl{position:absolute;transform:translate(-50%,-130%);padding:7px 14px;border-radius:999px;background:rgba(13,16,22,.88);border:1px solid #c39a3c;color:#f1d488;font:500 16px var(--body);white-space:nowrap;transition:opacity .3s}`);
  HOOKS.activity = {
    init() {
      const b = this.b = makeBowl($("#actBowl"), { seed: 21, autoRotate: 0.1, rot0: 0.5, draggable: true, bases: [0.6, 2.4, 4.3], scale: 0.8 });
      if (!b) return; b.setAll({ seams: 0 }, true);
      this.labels = {};
      b.onTap = () => { if (cur()[0] === idx("activity") && cur()[1] === 1) { b.scatter(); this.say("Now drag each piece back. Or press next."); setTimeout(() => jumpStep(2), 1600); } };
      b.onShardHome = () => { if (b.shards.every(s => s.userData.joined)) { b.setAll({ seams: 1, gold: 0, fat: 0 }); this.say("Joined! The lacquer seams are drawing in."); setTimeout(() => { if (cur()[0] === idx("activity") && cur()[1] === 2) jumpStep(3); }, 2600); } };
      b.onSeamTap = (j, x, y) => { if (cur()[1] < 3) return; this.pick = j; const c = $("#activity .chooser"); const s = 1;
        c.style.display = "flex"; c.style.left = Math.min(1250, 740 + x - 165) + "px"; c.style.top = Math.max(20, Math.min(560, 90 + y + 30)) + "px"; };
      b.onFrame = () => { Object.entries(this.labels).forEach(([j, el]) => { const p = b.seamScreen(+j, 0.22); el.style.left = p.x + "px"; el.style.top = p.y + "px"; }); };
    },
    say(t) { $("#activity .ask").textContent = t; },
    step(k) { const b = this.b; $("#activity .chooser").style.display = "none"; this.say(asks[k]); if (!b) return; clearInterval(this.tm);
      if (k <= 1) { b.setAll({ e: 0, seams: 0, gold: 0, fat: 0 }); b.seams.forEach(m => m.p = 0); this.clearLabels(); }
      if (k === 2) { if (b.shards.every(s => s.userData.joined)) b.scatter(); b.setAll({ seams: 1, gold: 0, fat: 0 }); this.clearLabels(); }
      if (k === 3) { b.setAll({ e: 0, seams: 1, fat: 0 }); }
      if (k === 4) { b.setAll({ e: 0, seams: 1, gold: 1, fat: 1 }); let t = 24 * 60; const el = $("#activity .tt");
        this.tm = setInterval(() => { t = Math.max(0, t - 9); el.textContent = `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`; if (!t) clearInterval(this.tm); }, 60); }
    },
    clearLabels() { Object.values(this.labels).forEach(el => el.remove()); this.labels = {}; },
    label(j, text) { const b = this.b; if (!b) return; b.seams[j].tgold = 1; b.seams[j].tfat = 1;
      let el = this.labels[j]; if (!el) { el = document.createElement("div"); el.className = "lbl"; $("#activity .labels").appendChild(el); this.labels[j] = el; } el.textContent = text; },
    bowls() { return [this.b]; } };
  ACT.astep = (el) => jumpStep(+el.dataset.n);
  ACT.pickDim = (el) => { const H = HOOKS.activity; $("#activity .chooser").style.display = "none"; if (H.pick === undefined) return; H.label(H.pick, DIMS[+el.dataset.k].name);
    if (H.b && H.b.seams.every(m => m.tgold === 1)) H.say("Every seam is gold. Press next to let it cure."); };
  ACT.autoJoin = () => { const b = HOOKS.activity.b; if (!b) return; b.setAll({ e: 0, seams: 1 }); b.onShardHome(); };
  ACT.autoGild = () => { const H = HOOKS.activity; if (!H.b) return; const names = ["Emotional", "Social", "Physical"]; H.b.seams.forEach((m, j) => { if (!H.labels[j]) H.label(j, names[j % 3]); }); };
})();

// =================== CLOSING ===================
sec("close", "dark", "Find your gold", `
  <video class="el" src="${A}hero.mp4" poster="${A}hero.jpg" autoplay muted loop playsinline style="left:700px;top:0;width:960px;height:900px;object-fit:cover;object-position:35% 50%;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 32%);mask-image:linear-gradient(90deg,transparent 0,#000 32%)"></video>

  [{ note: "Close with reflection." }, { auto: 1400, note: "Invite a few volunteers." }, { auto: 1400, note: "" }, { auto: 1400, note: "Remind students where to find support at school and through NJ4S." }],
  stepCss("close", ".c1", 1) + stepCss("close", ".c2", 2) + stepCss("close", ".c3", 3));

// =================== SOURCES & CREDITS ===================
sec("sources", "dark", "Sources and credits", `
  <div class="el" style="left:100px;top:70px;width:1400px;display:grid;gap:16px">
    <div class="eyebrow">Sources</div>
    <ul class="small muted" style="font-size:17px;line-height:1.65;margin:0;padding-left:20px">

      <li>Teen sleep 8–10 hours (AASM) and 60 minutes of daily activity. <a style="color:var(--gold-hi)" href="https://cdn.rileychildrens.org/resources/Well-Visit-Guide-Sleep.pdf" target="_blank" rel="noopener">Riley Children’s Health</a></li>

// =================== ENGINE ===================
const strip = $("#strip");
const styleEl = document.createElement("style"); styleEl.textContent = css; document.head.appendChild(styleEl);
SECTIONS.forEach((s, i) => { const el = document.createElement("section"); el.className = "sec " + s.cls; el.id = s.id; el.style.top = (i * 900) + "px"; el.innerHTML = s.html; el.dataset.cur = 0; strip.appendChild(el); s.el = el; });
$("#sources .pcredits").innerHTML = Object.entries(PH).map(([k, p]) => `<div><a href="${p.page}" target="_blank" rel="noopener" style="color:var(--gold-hi)">${p.title.replace(/\.(jpg|jpeg|png|tif)$/i, "")}</a> · ${k === "bakohan" ? "Tokyo National Museum (ColBase)" : k === "goryeo_cup" ? "Cleveland Museum of Art" : (p.artist || p.credit || "").split(" (")[0]} · ${p.license}</div>`).join("");
const flat = []; SECTIONS.forEach((s, si) => s.steps.forEach((st, k) => flat.push([si, k])));
const idx = (id) => SECTIONS.findIndex(s => s.id === id);
let pos = 0, timer = null, lastSi = -1;
const cur = () => flat[pos];
function sync() {
  const [si, k] = flat[pos];
  strip.style.transform = `translateY(${-si * 900}px)`;
  SECTIONS.forEach((s, i) => {
    const c = i === si ? k : (i < si ? s.steps.length - 1 : 0), prev = +s.el.dataset.cur;
    s.el.dataset.cur = c;
    for (let j = 1; j < s.steps.length; j++) s.el.classList.toggle("s" + j, j <= c);
    s.el.classList.toggle("on", i === si);
    const H = HOOKS[s.id];
    if (H && Math.abs(i - si) <= 1 && !H._init) { H._init = true; H.init && H.init(s); }
    if (H && H.step && (i === si) && (prev !== c || lastSi !== si)) H.step(c);
    if (H && H.bowls) H.bowls().forEach(b => { if (!b) return; if (Math.abs(i - si) <= 1) { b.active = true; clearTimeout(b._off); if (i !== si) b._off = setTimeout(() => { if (cur()[0] !== i) b.active = false; }, 1700); } else b.active = false; });
  });
  lastSi = si;
  $("#bar i").style.width = (pos / (flat.length - 1) * 100) + "%";
  $("#count").textContent = `${si + 1} / ${SECTIONS.length}`;
  const note = SECTIONS[si].steps[k].note || "";
  $("#notes").innerHTML = `<b>${SECTIONS[si].title} · step ${k + 1} of ${SECTIONS[si].steps.length}</b>${note || "<span style='opacity:.6'>No notes for this step.</span>"}`;
  try { history.replaceState(null, "", "#" + SECTIONS[si].id); } catch (e) {}
  clearTimeout(timer);
  const nxt = flat[pos + 1];
  if (nxt && nxt[0] === si && SECTIONS[si].steps[nxt[1]].auto) timer = setTimeout(() => go(1), SECTIONS[si].steps[nxt[1]].auto + (k === 0 ? 1500 : 0));
  document.querySelectorAll("#menu .grid button").forEach((b, i) => b.classList.toggle("cur", i === si));
}
function go(d) { pos = Math.max(0, Math.min(flat.length - 1, pos + d)); sync(); }
function jump(si, k = 0) { const p = flat.findIndex(([a, b]) => a === si && b === k); if (p >= 0) { pos = p; sync(); } }
function jumpStep(k) { jump(cur()[0], k); }
function fitStage() {
  const s = Math.min(innerWidth / 1600, innerHeight / 900); window.__stageScale = s;
  const st = $("#stage"); st.style.transform = `scale(${s})`;
  st.style.left = ((innerWidth - 1600 * s) / 2) + "px"; st.style.top = ((innerHeight - 900 * s) / 2) + "px";
  (window.__bowls || []).forEach(b => b.resize());
}
addEventListener("resize", fitStage); fitStage();
addEventListener("keydown", e => {
  if ($("#lb").classList.contains("open") || $("#menu").classList.contains("open")) { if (e.key === "Escape") closeOverlays(); return; }
  if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)) { if (e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return; e.preventDefault(); go(1); }
  else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); go(-1); }
  else if (e.key === "Home") { pos = 0; sync(); } else if (e.key === "End") { pos = flat.length - 1; sync(); }
  else if (e.key.toLowerCase() === "n") toggleNotes(); else if (e.key.toLowerCase() === "f") toggleFs(); else if (e.key.toLowerCase() === "m") openMenu();
});
// touch + mouse: swipe to move, tap empty space to advance, tap items to interact
const stage = $("#stage"); let sw = null;
stage.addEventListener("pointerdown", e => { if (e.target.closest("[data-i],button,a,video,.b3d")) { sw = null; return; } sw = { x: e.clientX, y: e.clientY, t: Date.now() }; });
stage.addEventListener("pointerup", e => {
  if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
  else if (Math.abs(dy) > 60) go(dy < 0 ? 1 : -1);
  else if (Math.abs(dx) < 12 && Math.abs(dy) < 12) go(1);
});
stage.addEventListener("click", e => { const t = e.target.closest("[data-i]"); if (t && ACT[t.dataset.i]) { e.preventDefault(); ACT[t.dataset.i](t, e); } });
// photo lightbox
ACT.photo = (el) => { const k = el.dataset.key, p = PH[k]; const cap = (window.__CAPS && window.__CAPS[k]) || el.dataset.cap || "";
  $("#lb img").src = A + "p_" + k + ".webp"; $("#lb img").alt = cap;
  $("#lb figcaption").innerHTML = `${cap}<small>Photo: ${k === "bakohan" ? "Tokyo National Museum (ColBase)" : (p.artist || p.credit || "")} · ${p.license} · Wikimedia Commons</small>`; $("#lb").classList.add("open"); };
function closeOverlays() { $("#lb").classList.remove("open"); $("#menu").classList.remove("open"); }
$("#lb").addEventListener("click", closeOverlays); $("#menu .x").addEventListener("click", closeOverlays);
$("#menu .grid").innerHTML = SECTIONS.map((s, i) => `<button data-s="${i}"><span>${String(i + 1).padStart(2, "0")}</span>${s.title}</button>`).join("");
$("#menu .grid").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; closeOverlays(); jump(+b.dataset.s, 0); });
function openMenu() { $("#menu").classList.add("open"); }
$("#menuBtn").onclick = openMenu;
$("#next").onclick = () => go(1); $("#prev").onclick = () => go(-1);
function toggleNotes() { const n = $("#notes"); n.hidden = !n.hidden; $("#notesBtn").setAttribute("aria-pressed", String(!n.hidden)); }
$("#notesBtn").onclick = toggleNotes;
function toggleFs() { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} }
$("#fsBtn").onclick = toggleFs;
const start = SECTIONS.findIndex(s => "#" + s.id === location.hash);
if (start > 0) pos = flat.findIndex(([si]) => si === start);
strip.style.transition = "none"; sync(); requestAnimationFrame(() => requestAnimationFrame(() => strip.style.transition = ""));
</script>
